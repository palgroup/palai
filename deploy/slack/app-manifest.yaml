# Palai Slack app manifest (E19 §0.1)
#
# Paste this at https://api.slack.com/apps → Create New App → "From a manifest".
# It sets EXACTLY what the shipped receivers need and nothing more — every scope and
# event here is claimed by a UAT case, and an event we do not subscribe to is an event
# we wrote no code for.
#
# WHY SOCKET MODE: socket_mode_enabled carries both events AND interactivity payloads
# over a WebSocket, so no public HTTPS Request URL, tunnel or ngrok is needed. That is
# the cheapest real proof an owner can run (plan §0.1). The HTTP transport still exists
# and is tested — it is simply not what this manifest configures.
#
# NOT SET ON PURPOSE:
#   - request_url under event_subscriptions / interactivity: Socket Mode does not use it.
#     Add one only if you deliberately switch to the HTTP transport, in which case it is
#     <public-https-base>/v1/slack/events and .../v1/slack/interactions.
#   - groups:history: private channels are out of scope. Do not grant it "just in case" —
#     an unused scope is standing read access.
#   - features.agent_view.actions[]: an INVOCABLE surface. Every actionable element in this
#     integration is minted by interactions.go and passes the approval chain; an action the
#     model or the panel can invoke would need its own authorization path, so it is not
#     declared until one exists (E20 plan §5).
#   - links.embed:write: a video block cannot show a Slack-hosted file at all (the url must
#     be public, on one of the app's unfurl domains and iframe-embeddable), so the scope has
#     nothing to do here. An unused scope is standing access (E20 plan §3.5 S13).
#
# files:write — GRANTED IN E22, AND THE PRECONDITION E20 NAMED IS WHAT OPENED IT (E22 plan §0.1,
# decided 2026-07-28).
#
# E20 T4 refused this scope in as many words: "FILE UPLOAD IS NOT BUILT (S14) … files:write is a new
# standing write access, and the iOS scenario does not exist yet." E22 IS that scenario — a run
# that writes code on a Mac produces a screenshot, a screen recording and a build log, and a link
# to bytes nobody in the thread can open is not a delivery. So the door opens because the condition
# written on it came true, not because somebody asked again.
#
# WHAT IS BEING GRANTED, in plain words: the app may CREATE files in this workspace and share them
# into conversations it is already in. It is a WRITE scope, not a read one — it does not let the app
# see files other people uploaded (that is files:read, granted separately for SLK-005) and it does
# not let it delete or edit anybody else's. What it does mean is that the bot can put bytes in front
# of humans, so the bytes it puts there are bounded (8 MiB, our ceiling, not Slack's), named from
# their own content rather than from anything a model typed, and read only from artifacts the run
# that is answering actually produced.
#
# NOT granting it is a supported outcome, not a failure: leave files:write out, and a run's answer
# still lands with the artifact as a LINK, exactly as E20 and E21 shipped it. The upload simply
# fails with `missing_scope`, which is logged, and the answer is untouched.
#
# im:history — A POSTURE CHANGE, GRANTED DELIBERATELY (E20 plan §0.2, decided 2026-07-27).
# E19's manifest refused this scope and said so: "private channels and DMs are out of scope
# for the first run." The agent panel cannot exist without reversing that, because the panel
# conversation IS a DM: it arrives as message.im, and message.im requires im:history
# (https://docs.slack.dev/reference/events/message.im/, checked 2026-07-27).
#
# WHAT IS BEING GRANTED, in plain words, because a scope nobody understood is a scope nobody
# revokes: im:history is STANDING READ ACCESS to every DM conversation the bot is a party to.
# It is narrower than it sounds — it does not cover DMs between other people — and it is wider
# than a single feature — it does not expire when the panel is closed. The decision is the
# workspace owner's and it takes effect at REINSTALL, which is where it belongs.
#
# NOT granting it is a supported outcome, not a failure: leave im:history and message.im out,
# and the app keeps working exactly as E19 shipped it (mentions in channels). The panel then
# greets with the agent_description and suggested_prompts below but carries no conversation.
#
# RESOLVED (2026-07-27), and the record is kept rather than deleted because the uncertainty was
# real: users:read vs users:profile.read was LOW-CONFIDENCE from plan §3.5, because the scope page
# we had fetched was a navigation index. users.info's own reference page states `users:read`
# (https://docs.slack.dev/reference/methods/users.info/, checked 2026-07-27), and the live app
# reports it granted. It is what adapters/integrations/slack/users.go calls, for thread speaker
# names — NOT for principal mapping, which still keys on the id alone.
_metadata:
  major_version: 1
  minor_version: 2

display_information:
  name: Palai
  description: Palai agent platform — mentions open a run, buttons approve publications.
  background_color: "#1f2933"

features:
  bot_user:
    display_name: Palai
    always_online: false

  # The AGENT PANEL (E20 T2). https://docs.slack.dev/reference/app-manifest/ (checked 2026-07-27).
  #
  # ONE-WAY DOOR, and it is the manifest's own words rather than our caution: "New apps can only
  # use agent_view. Apps that already use assistant_view can continue to do so for now, but
  # assistant_view will eventually be deprecated... Switching an app from assistant_view to
  # agent_view CANNOT BE REVERSED." This app is new, so agent_view was never a choice — but the
  # sentence is copied here so the next reader does not go looking for a way back.
  agent_view:
    # REQUIRED when agent_view is present; maximum 300 characters (manifest reference).
    agent_description: >-
      Palai runs your agents where the work already is. Ask a question here and it starts a
      real run against this workspace's configured agent; high-risk steps come back as an
      approval only a listed approver can grant.
    # STATIC prompts, rendered by Slack itself — no API call, no runtime, no scope. The dynamic
    # form (assistant.threads.setSuggestedPrompts, at most four, `assistant:write`) is NOT wired:
    # nothing here needs a per-thread suggestion yet.
    suggested_prompts:
      - title: "What can you do?"
        message: "What can you do in this workspace, and what will you ask me to approve?"
      - title: "Check the release"
        message: "What is still open on the current release?"

  # THE MESSAGES TAB (found live 2026-07-27, after the panel rendered but refused to accept typing).
  # Without this block Slack leaves the Messages tab READ-ONLY and the panel shows "Sending messages
  # to this app has been turned off": agent_view renders, the suggested prompts render, and the human
  # cannot type a word. agent_view's own page says agent conversations happen in the Messages tab but
  # never says the tab must be enabled for that to work — we found it by hitting it.
  # https://docs.slack.dev/reference/app-manifest/ (checked 2026-07-27)
  app_home:
    home_tab_enabled: false                 # nothing here renders a Home tab; do not advertise one
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false   # false = the human may actually send

oauth_config:
  scopes:
    bot:
      - app_mentions:read   # SLK-001, SLK-003 — the app_mention event
      - assistant:write     # SLK-010 — agent_view's own scope. Slack ADDS THIS AUTOMATICALLY when the
                            # feature is enabled; it is written out so it is visible rather than implied.
                            # It backs assistant.threads.setSuggestedPrompts / setTitle and the
                            # app_context_changed event. NOTE (plan §3.5 S3): status and streaming do NOT
                            # need it — chat.startStream/appendStream/stopStream and setStatus are chat:write.
      - channels:history    # SLK-002, SLK-005 — message events in channels the bot is in.
                            # ALSO the one READ this app makes: conversations.replies, for a thread it was
                            # invited into after the discussion started (SLK-003). Removing this scope would
                            # look like it only stopped a delivery; it would also silently make that read
                            # `missing_scope`. groups:history and mpim:history are deliberately NOT granted,
                            # so a private channel and a group DM stay unreadable.
      - chat:write          # SLK-006, SLK-007 — chat.postMessage AND chat.update
      - files:read          # SLK-005 — fetch a shared file's content
      - files:write         # SLK-012 (E22 T5) — put a run's own artifact IN the thread. See the block
                            # at the top of this file before granting it.
      - im:history          # SLK-010 — the ONLY way to receive message.im, i.e. the panel conversation.
                            # A POSTURE CHANGE: see the block at the top of this file before granting it.
      - search:read.public  # TLM-005 — assistant.search.context, the Real-time Search API. THE SECOND POSTURE
                            # CHANGE IN THIS FILE, and it is narrower than im:history but wider than it looks.
                            #
                            # WHAT IT GRANTS, plainly: the agent can search this workspace's PUBLIC channel
                            # messages. Slack's own scope page is explicit that membership is not the boundary
                            # — "the searching user need not be a member of the public channels, just of the
                            # workspace, for the channels to be included in the search results". So the agent
                            # can surface a message from a public channel the person asking has never opened.
                            # That is Slack's design, not ours, and there is no documented parameter to narrow
                            # it (https://docs.slack.dev/reference/scopes/search.read.public/, 2026-07-27).
                            #
                            # WHAT IT DOES NOT GRANT, and this half is structural rather than promised:
                            # private channels, DMs and group DMs need search:read.private / .im / .mpim, and
                            # those are USER-token scopes that a bot token cannot hold. We could not ask for
                            # them here if we wanted to.
                            #
                            # NOTHING RETRIEVED IS STORED — the API's own terms: "You must not store or copy
                            # any of the data retrieved from this API." A result enters one prompt and is gone.
                            # It is why knowledge-vector stays disabled rather than being wired to this.
                            #
                            # NOT granting it is a supported outcome: leave this scope out and the agent keeps
                            # working exactly as E20 shipped it, answering from the thread it is in.
      - users:read          # SLK-004 — users.info. Its ONE caller resolves the speakers of a fetched
                            # thread to display names, so a summary says who said what instead of
                            # "person 1" / "person 2". A name is DATA: it is rendered inside the
                            # untrusted quoted block and nothing maps it to a principal (see note above).

settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_context_changed # SLK-010/011 — what the human is LOOKING AT. Births NO run.
      - app_home_opened     # SLK-010 — the panel was opened (tab: home | messages). Births NO run.
                            # Requires no scope at all (app_home_opened reference, 2026-07-27).
      - app_mention
      - message.channels
      - message.im          # SLK-010 — the panel conversation. Requires im:history, above.
  interactivity:
    is_enabled: true
  org_deploy_enabled: false      # Enterprise Grid / org-wide install is out of scope
  token_rotation_enabled: false
