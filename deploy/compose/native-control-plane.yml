# Overlay: the control plane runs NATIVELY on this machine; everything else stays in Docker.
#
#   docker compose -f compose.yaml -f native-control-plane.yml up -d
#
# This is what a Mac deployment is (E22 T1). The control-plane binary compiles for darwin/arm64, so
# reaching a Mac's own toolchain — `xcodebuild`, `xcrun simctl`, `axe` — needs no worker protocol and
# no typed capability: it needs the control plane to BE on the Mac, with the host shell posture
# declared (`PALAI_SHELL_NATIVE=unsandboxed-host`). Read docs/operations/palai-on-a-mac.md first; it
# states what that posture deletes.
#
# THREE THINGS THIS OVERLAY DOES, and each is one line of why:
#
#  1. The in-compose control plane moves into a profile, so it is NOT started. `!reset` would remove
#     the service and leave the runner's `depends_on` dangling; a profile keeps the definition around
#     for `--profile container-control-plane`, which is exactly the A/B an operator wants when
#     something breaks.
#
#  2. The runner reaches the native control plane by the name its certificate ALREADY carries.
#     `cmd/cli/internal/stack/certs.go` mints ONE SAN, `control-plane`, and the runner pins exactly
#     one (packages/runner/session.go). So the fix is DNS, not certificates: `control-plane` resolves
#     to the host gateway, and the URL is unchanged. The native control plane must therefore bind its
#     runner listener on a routable interface — PALAI_RUNNER_LISTEN_ADDR=":${PALAI_RUNNER_PORT}", not
#     127.0.0.1 — or the container's connection is refused.
#
#  3. The workspace is bound at the SAME ABSOLUTE PATH on both sides. The control plane hands the
#     runner a host path; the runner passes it to the Docker daemon as a bind source, which the daemon
#     resolves on the HOST. When the control plane is native, its own path IS the host path — the trap
#     the split deployment had (a named volume the daemon cannot resolve) does not arise, but the
#     identical-path requirement remains and is what this mount states.
#
# PROVEN END TO END on 2026-07-28 (E22 T5): `palai up --native` brought this overlay up on a Mac,
# the runner CONTAINER enrolled with the NATIVE control plane over the host gateway, a live model
# round-trip completed, and the agent's shell tool ran the host's own `xcodebuild -version`. The
# transcript is in docs/operations/palai-on-a-mac.md §4.1. The guard in native_control_plane_test.go
# still checks what can be checked without a machine to burn — the profile, the host-gateway alias,
# the identical workspace path — and cmd/cli/internal/stack/native.go now REFUSES a bring-up that
# would violate points 2 or 3 above, by the name of the variable that is wrong.
#
# ORDER MATTERS AND IS NOT EXPRESSIBLE HERE: because the runner's depends_on is reset below, compose
# will happily start it before a native control plane is listening — and cmd/runner/main.go
# log.Fatalf's on a failed enroll with no restart policy, so that runner is a DEAD container. Driving
# this file by hand means starting postgres + object-store, then the control plane, then the runner.
# `palai up --native` does exactly that.
services:
  control-plane:
    profiles: ["container-control-plane"]

  runner:
    # The native control plane is not a compose service, so there is no health condition to wait on.
    depends_on: !reset {}
    environment:
      # Same DNS name the certificate carries; only the resolution changes (see 2 above).
      PALAI_CONTROLLER_URL: "https://control-plane:${PALAI_RUNNER_PORT}"
      # THE RUNNER'S OWN COPY OF THE ALLOCATION ROOT, and it is a DIFFERENT job from the bind below.
      #
      # The volume makes the path REACHABLE inside the container. This variable is what makes the runner
      # CHECK it: packages/runner's workspaceUnderRoot refuses to bind-mount a leased path that does not
      # sit under this root, which is the §24 boundary against a control plane naming an arbitrary host
      # path. Until this line existed the runner got the mount and not the variable, so the check saw an
      # empty root — and an empty root used to mean "disabled". Measured 2026-08-01: not one shipped
      # compose file put PALAI_WORKSPACE_ROOT in a runner's environment block, and `docker inspect` on the
      # live runner found zero. The boundary was off on every deployment, including this one, which is the
      # only shipped posture where workspaces work at all.
      #
      # IT MUST BE THE SAME VALUE THE BIND USES. Both sides interpolate the same variable, and the bind is
      # "${PALAI_WORKSPACE_ROOT}:${PALAI_WORKSPACE_ROOT}" — identical host and container paths (see 3
      # above) — so the root the runner checks against is the root the control plane allocates under.
      # deploy/compose/native_control_plane_test.go asserts the two stay in step; a bind whose variable
      # this block did not carry would refuse every coding run instead of admitting every host path, which
      # is the safe direction and still a broken deployment.
      PALAI_WORKSPACE_ROOT: "${PALAI_WORKSPACE_ROOT}"
    extra_hosts:
      - "control-plane:host-gateway"
    volumes:
      # Same absolute path on both sides (see 3 above). PALAI_WORKSPACE_ROOT is the host directory the
      # native control plane mints allocations under, so the runner sees a run's workspace at exactly
      # the path the control plane named.
      - "${PALAI_WORKSPACE_ROOT}:${PALAI_WORKSPACE_ROOT}"
