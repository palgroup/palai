# Production overlay for the packaged Palai stack (E14 T1). Layered ON TOP of compose.yaml —
# it does NOT fork the base:
#
#   docker compose --env-file production.env \
#     -f deploy/compose/compose.yaml -f deploy/compose/production.yml up -d
#
# Same images, hardened posture:
#   - a digest-pinned TLS-terminating reverse-proxy edge is the ONLY host-published surface;
#   - the control-plane API and the mutually-authenticated runner gateway (:8443) stay on the
#     internal compose network, never host-published;
#   - every persistent service restarts always;
#   - the dispatch exec-path is ON by default (1 worker; base defaults 0/queued-only);
#   - the control-plane REFUSES to boot on an unset/dev-default secret master key
#     (production-entrypoint.sh, fail-closed — a real check, not documentation).
#
# Registration posture: the stack has NO public self-registration endpoint by construction
# (bootstrap key + `provision` capability); this overlay adds none. Provisioning goes through
# the `palai` admin CLI (E14 T2) over the edge. See docs/operations/install.md.
#
# DEFAULT TLS IDENTITY: the edge presents the LOCAL `palai init` CA's server cert
# (${PALAI_HOME}/ca/server.crt, SAN "control-plane"). PALAI_EDGE_CERT / PALAI_EDGE_KEY point it at
# a real-domain certificate instead; the runner gateway keeps ${PALAI_HOME}/ca/server.* either way,
# which is what it must have (see the edge service below). Unset, the mounts are byte-identical to
# what every install before this change had.
#
# HONEST CEILING (plan §6): ACME/renewal is still the operator's — this overlay mounts the files it
# is given and Caddy runs with auto_https off. The dedicated cloud VM + real domain is the operator
# leg, not run here.

services:
  postgres:
    restart: always
    ports: !reset [] # not host-published in production

  object-store:
    restart: always
    ports: !reset []

  control-plane:
    restart: always
    # The API is no longer host-published; it is reachable ONLY behind the TLS edge. The
    # runner gateway (:8443) keeps LISTENING on the internal network for runner enrollment —
    # it is simply never published to the host.
    ports: !reset []
    # Guard the boot on a real secret master key, THEN exec the plain bridge entrypoint ($@).
    entrypoint: ["/usr/local/bin/production-entrypoint.sh", "/usr/local/bin/entrypoint.sh"]
    environment:
      # Production exec-path on by default (base defaults 0 = queued-only).
      PALAI_DISPATCH_WORKERS: ${PALAI_DISPATCH_WORKERS:-1}
      # The DB-backed secret store's master key is MANDATORY in production: the entrypoint
      # fails closed on an unset/dev-default key. Delivered as a file-secret, never an env value.
      PALAI_SECRET_MASTER_KEY_FILE: /run/secrets/master_key
    secrets:
      - master_key

  runner:
    restart: always

  edge:
    # Digest-pinned TLS-terminating reverse proxy — the ONLY host-published surface. Caddy
    # serves :443 with the mounted cert/key and proxies to the internal control-plane API.
    # Pin origin: caddy:2.8-alpine (resolved 2026-07 via `crane digest caddy:2.8-alpine`).
    # Upgrade: re-resolve the tag with crane/`docker buildx imagetools inspect` and replace.
    image: caddy@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: always
    depends_on:
      control-plane:
        condition: service_healthy
    configs:
      - source: edge_caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # The edge TLS pair. It DEFAULTS to the self-minted local-CA server cert (SAN "control-plane")
      # `palai init` writes into ${PALAI_HOME}/ca, so an install that sets neither variable mounts
      # exactly the files it always did.
      #
      # PALAI_EDGE_CERT / PALAI_EDGE_KEY exist because that default file is NOT the edge's alone: it
      # is also the control-plane's runner-gateway certificate (compose.yaml PALAI_RUNNER_SERVER_CERT),
      # and packages/runner pins that identity to EXACTLY one DNS SAN equal to PALAI_CONTROLLER_DNS
      # ("control-plane") — enrollment.go, session.go and renewal.go each refuse anything else,
      # including a cert carrying both "control-plane" and the operator's domain. Overwriting
      # ${PALAI_HOME}/ca/server.crt with a real-domain certificate therefore broke every run, and
      # broke it LATE: the running control-plane holds its cert in memory, so the stack stayed green
      # until the next restart and then runs simply queued forever with no mention of a certificate
      # anywhere (measured: docs/operations/cloud-smoke-report.md, Bulgu 3).
      #
      # So point these two at the domain certificate and leave ${PALAI_HOME}/ca/server.* untouched.
      # deploy/compose/edge_cert_test.go holds this seam open; docs/operations/install.md step 7 is
      # the procedure.
      - "${PALAI_EDGE_CERT:-${PALAI_HOME}/ca/server.crt}:/etc/palai/edge/edge.crt:ro"
      - "${PALAI_EDGE_KEY:-${PALAI_HOME}/ca/server.key}:/etc/palai/edge/edge.key:ro"
    ports:
      # Fail closed: an unset PALAI_EDGE_PORT must error, not publish 443 from a random port.
      - "${PALAI_EDGE_PORT:?PALAI_EDGE_PORT must be set}:443"

configs:
  # Inline Caddyfile (no separate file, no bind-mount path ambiguity). auto_https off disables
  # ACME + HTTP->HTTPS redirects; the explicit `tls` cert/key makes :443 a TLS listener that
  # serves the mounted cert for any host, then proxies to the internal control-plane API.
  #
  # The reverse_proxy is PATH-MATCHED to /v1/* deliberately: every externally-required surface on the
  # control-plane's top mux lives under /v1/* (the API, the signed /v1/inbound receiver, /v1/tool-
  # callbacks). The unauthenticated internal probes — /healthz (compose healthcheck) and /metrics
  # (Prometheus) — do NOT, and both are reached on the internal Compose network, never through this
  # edge. Matching /v1/* keeps them off the public listener, so /metrics cannot leak operational
  # intel to the internet. An unmatched path is never proxied — it gets Caddy's default empty response,
  # so nothing on the control-plane top mux outside /v1/* is reachable through the edge (verified: a
  # public GET /metrics returns no exposition, while GET /v1/... proxies through).
  edge_caddyfile:
    content: |
      {
      	admin off
      	auto_https off
      }
      :443 {
      	tls /etc/palai/edge/edge.crt /etc/palai/edge/edge.key
      	reverse_proxy /v1/* control-plane:8080
      }

secrets:
  master_key:
    file: "${PALAI_HOME}/secrets/master-key"
