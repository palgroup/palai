# The packaged local Palai stack: Postgres (durable spine), SeaweedFS (object store,
# run-not-consumed in LP-0), the control-plane, and one private runner. `palai local up`
# interpolates the ${PALAI_*} contract below from .palai/config.json; the raw provider
# credential rides a native Docker file-secret (top-level `secrets:`), never a compose
# `environment:` value, so it appears in no `docker inspect`/`compose config` surface.
#
# External bases are digest-pinned (postgres matches CI ci.yml; seaweedfs matches
# ADR-0004). The control-plane and runner are built locally from the repo; the reference
# engine is NOT a service here — `local up` builds it and passes its ref as
# PALAI_ENGINE_IMAGE. Only the runner mounts the Docker socket; the engine (Task 8 OCI
# driver) receives none.
services:
  postgres:
    image: postgres@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
    environment:
      POSTGRES_USER: palai
      POSTGRES_DB: palai
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - palai-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PALAI_PG_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palai -d palai"]
      interval: 2s
      timeout: 2s
      retries: 30

  object-store:
    image: docker.io/chrislusf/seaweedfs@sha256:c7d6c721b30ae711db766bbbfd40192776e263d4e51e22f57baef7bef93c12c6
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - palai-objects:/data
    ports:
      - "127.0.0.1:${PALAI_S3_PORT}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/compose/control-plane.Dockerfile
      args:
        # E15 T2: the release version stamp baked into the image binary. Unset = unstamped (VCS/"dev").
        PALAI_VERSION_STAMP: ${PALAI_VERSION_STAMP:-}
    # E15 T2: `palai upgrade` swaps the control-plane image tag N -> N+1 by setting this; the default is
    # the locally-built tag, so a plain `local up` is unchanged.
    image: ${PALAI_CONTROL_PLANE_IMAGE:-palai/control-plane:local}
    environment:
      # The provider secret and the DB password are NOT here — the entrypoint bridges
      # them from /run/secrets at start (Option B, LP fork 1). Only non-secret config.
      PALAI_LISTEN_ADDR: ":8080"
      PALAI_RUNNER_LISTEN_ADDR: ":8443"
      PALAI_RUNNER_CA_CERT: /palai/ca/ca.crt
      PALAI_RUNNER_CA_KEY: /palai/ca/ca.key
      PALAI_RUNNER_SERVER_CERT: /palai/ca/server.crt
      PALAI_RUNNER_SERVER_KEY: /palai/ca/server.key
      PALAI_ENROLLMENT_TOKEN_FILE: /palai/runner-token
      PALAI_BOOTSTRAP_API_KEY_FILE: /run/secrets/bootstrap_api_key
      PALAI_ENGINE_IMAGE: ${PALAI_ENGINE_IMAGE}
      # The object store this same file starts, addressed by its service name on the compose
      # network (the published 127.0.0.1:${PALAI_S3_PORT} above is how the HOST reaches it).
      # Until these two lines existed compose ran a healthy, depended-on object store and told
      # the control-plane NOTHING about it, so artifactStoreFromEnv returned nil and everything
      # gated on it was off: the Slack image leg (a shared screenshot was silently admitted as
      # text the model could not see), artifact retrieval, the checkpoint/snapshot sinks,
      # retention's byte deletion and the orphan collector. NOT interpolated and with no empty
      # default on purpose — this is not operator configuration, it is the address of a peer
      # service in this same file, and a `${...:-}` would restore the bug for anyone running
      # compose without an env file. SeaweedFS accepts anonymous S3, so no credential belongs
      # here; a real backend sets PALAI_S3_ACCESS_KEY/SECRET_KEY through the secret path.
      PALAI_S3_ENDPOINT: http://object-store:8333
      PALAI_S3_BUCKET: palai-artifacts
      # Dispatch drives the production exec-path (Task 15). Default 0 (queued-only) keeps the
      # browser/clean-boot proofs unchanged; the wiring test and live UAT set it to 1 with
      # PALAI_MODEL_PROVIDER to run a real create -> engine -> terminal round-trip.
      PALAI_DISPATCH_WORKERS: ${PALAI_DISPATCH_WORKERS:-0}
      # The workspace shell tool's sandbox. Unset = NO shell tool at all: shellRunnerFromEnv returns
      # nil and a shell call fails cleanly, which is what every compose deployment has always done.
      # Set it to a PINNED DIGEST (the driver refuses a mutable tag) to enable the tool.
      PALAI_SANDBOX_IMAGE: ${PALAI_SANDBOX_IMAGE:-}
      # …and the wall time ONE shell call runs under, which is why it sits on the next line rather
      # than somewhere an operator would meet it after their first hang. Unset = 10m, measured
      # against real builds rather than picked (see defaultSandboxWallTime in main.go); the container
      # posture REFUSES a non-positive bound, so this must never be blank once the image is set.
      # Raise it for a toolchain whose builds legitimately run longer.
      PALAI_SANDBOX_WALL_TIME: ${PALAI_SANDBOX_WALL_TIME:-}
      # How many tool REFUSALS one attempt may hand a model before the run fails with a named terminal
      # (docs/operations/tool-errors.md). A tool error is delivered to the model as a result so it can
      # correct itself, which removed the accidental stop a wedged run used to be; this is the bound
      # that replaced it. Unset = 16; `0` is unbounded and has to be written.
      PALAI_TOOL_ERROR_BUDGET: ${PALAI_TOOL_ERROR_BUDGET:-}
      # Model provider the exec-path routes to: "fake" (deterministic, no network/credential)
      # or "provider-one" (live OpenAI; model id from PALAI_MODEL, credential redeemed at call
      # time from the provider_one_key file secret bridged by the entrypoint). The credential
      # never rides this environment block.
      PALAI_MODEL_PROVIDER: ${PALAI_MODEL_PROVIDER:-fake}
      PALAI_MODEL: ${PALAI_MODEL:-}
      # The exchange the deterministic adapter replays, as a path to a JSON file (fake.LoadScript).
      # Unset — every deployment that exists — replays the built-in fixed script, so nothing about an
      # existing stack's runs changes. Set, it lets a stack with NO provider credential drive a run that
      # calls a tool and answers with its result, which is otherwise unprovable here: this tree exposes
      # no tools to a real provider, so a key would not produce a tool call either.
      #
      # THE PATH IS READ INSIDE THE CONTAINER, so a host file needs a bind mount onto this service. It is
      # not a silent miss if you forget: the control plane refuses to boot and names the path it could
      # not read.
      PALAI_FAKE_SCRIPT_FILE: ${PALAI_FAKE_SCRIPT_FILE:-}
      # E15 T2: overrides the baked version stamp (§48.2 window / applied_by). Unset = the image's stamp.
      PALAI_VERSION: ${PALAI_VERSION:-}
      PALAI_RETENTION_STORE_FALSE_TTL: ${PALAI_RETENTION_STORE_FALSE_TTL:-}
      # THE FIVE BOUNDS THIS FILE NEVER PASSED. Measured on main at 444a1576, 2026-08-01:
      #
      #   grep -c 'PALAI_MAX_CONCURRENT_RUNS' compose.yaml production.yml   -> 0, 0
      #   docker inspect <control-plane> --format '{{range .Config.Env}}…'
      #     | grep -c 'PALAI_QUEUE_DEADLINE\|PALAI_REQUEST_*\|PALAI_MAX_*'  -> 0
      #
      # main.go has read all five since they were written — edgeLimitsFromEnv (main.go:1969) and
      # orch.SetQueueDeadline (main.go:604) — and every one of their readers coerces an unset value to
      # ZERO, which each of these four spells "unbounded". So every compose deployment that has ever
      # existed admits an unlimited request rate, an unlimited burst, and an unlimited number of
      # concurrent and queued runs per tenant, and times no run out on queue age. The variables were not
      # missing from the binary; they were missing from the one file that could hand them to it, and
      # GET /v1/deployment reported them as "unset — unbounded" beside a change_with sentence
      # ("recreate the control-plane with the new value") naming a command that could not work, because
      # there was no value to recreate with.
      #
      # Unset keeps every existing deployment BYTE-IDENTICAL: `${X:-}` passes an empty string, envInt and
      # envFloat and envDuration all read that as their zero, which is what an absent variable already
      # gave them. What changes is that a value can now arrive.
      PALAI_QUEUE_DEADLINE: ${PALAI_QUEUE_DEADLINE:-}
      PALAI_FLEET_PARK_TTL: ${PALAI_FLEET_PARK_TTL:-}
      PALAI_REQUEST_RATE_PER_SEC: ${PALAI_REQUEST_RATE_PER_SEC:-}
      PALAI_REQUEST_BURST: ${PALAI_REQUEST_BURST:-}
      PALAI_MAX_CONCURRENT_RUNS: ${PALAI_MAX_CONCURRENT_RUNS:-}
      PALAI_MAX_QUEUED_RUNS: ${PALAI_MAX_QUEUED_RUNS:-}
      # Issued runner-cert lifetime; unset = 5m production default. A short value (the
      # fault-live renewal proof) makes the runner renew mid-session over the renew endpoint.
      PALAI_RUNNER_CERT_TTL: ${PALAI_RUNNER_CERT_TTL:-}
      # PALAI_SLACK_SOCKET_TEAM_ID WAS PASSED HERE AND IS GONE (cutover, 2026-08-05). It named the one
      # workspace the control-plane's own Socket Mode loop dialled. That loop is deleted: Slack is
      # apps/slack-bot, which reads its own bot row and reaches this control plane over /v1, so a
      # compose deployment configures nothing Slack-shaped at all.
      # The DB-backed secret store's master key (E13 T3). This is the ONE place a *_ref handle can
      # redeem, which is what makes a registered Slack connection able to verify a signature, post a
      # reply and open a socket. The VALUE here is a PATH; the key itself rides the file-secret
      # below, never a compose environment value.
      #
      # WRITTEN LITERALLY, exactly as production.yml already does, and that is the whole of §3.6 D5.
      # It used to read ${PALAI_SECRET_MASTER_KEY_FILE:-} — interpolated from whatever shell invoked
      # compose — and the ONLY thing that ever exported it was `palai up`'s applySlackEnv, which ran
      # only when .env.local held Slack credentials. So `docker compose up -d`, and every `palai up`
      # on a stack with no Slack app, passed an EMPTY value: dbSecretStore stayed nil, the secret-ref
      # routes stayed unmounted, and every handle resolved nowhere. The secrets themselves were never
      # fragile (they are envelope-encrypted rows in Postgres, re-read on every resolve) — the
      # POINTER to their key was. `palai up`'s ensureSecretSlots is what guarantees the file this
      # path names holds a parseable key on every bring-up; the control-plane log.Fatalf's otherwise.
      PALAI_SECRET_MASTER_KEY_FILE: /run/secrets/master_key
      # ‼️ TWELVE LINES DESCRIBING A DEPLOYMENT-GLOBAL GITHUB APP STOOD HERE, ABOVE NO KEYS AT ALL. They
      # explained how PALAI_GITHUB_APP_ID / _INSTALLATION_ID / _PRIVATE_KEY_FILE reached the container and
      # what breaks without them — and `9ad0665d` deleted that path on 2026-08-05, taking the keys with it
      # and leaving the prose exactly where a reader audits the wiring. A comment is what a reader accepts
      # INSTEAD of reading the caller, which is why one describing a deleted mechanism is worse than none.
      #
      # What replaced it: main.go's repositoryPublisher builds the publisher UNCONDITIONALLY, and a
      # publication authenticates with the BINDING's own connection_ref — a secret-ref name, written over
      # POST /v1/secret-refs and pointed at with PUT /v1/repository-bindings/{id}/connection. A binding
      # carrying none is refused AT THE TOOL, before a human is asked to approve something that could not
      # happen. So this deployment needs no App variable and no App key, and the `github_app_key` secret
      # that was still declared below goes with them.

      # ‼️ THE CATALOGUE ADVERTISED 71 SETTINGS AND THIS FILE COULD SET 36 OF THEM. Measured 2026-08-06 by
      # matching real YAML keys — never a grep, which counts a name in a comment as a passed variable and
      # which is how the first attempt at this number came out wrong. compose passes ONLY the keys it
      # lists: there is no env_file passthrough for an unlisted name, so a knob absent here is one an
      # operator of the shipped deployment cannot turn AT ALL, however carefully the settings screen
      # documents it. That is the same shape as a declared-but-unbound symbol, one layer out.
      #
      # THE `${VAR:-}` FORM IS BEHAVIOUR-PRESERVING AND THAT WAS CHECKED RATHER THAN ASSUMED. Unset, it
      # yields a variable that is PRESENT and EMPTY (measured on this Docker, 2026-08-04, recorded in the
      # runner block below). Every reader here treats empty as absent — envDurationOr falls to its default
      # on a zero parse, the two egress gates compare `== "1"`, and the settings API reports Set only when
      # `raw != ""` — so an existing deployment that sets none of these is byte-for-byte unchanged.
      #
      # WHAT IS DELIBERATELY STILL ABSENT, named so the next reader does not "fix" it:
      #   * PALAI_WORKSPACE_ROOT — capabilities.go gates the whole `workspaces` capability on it, and no
      #     service here mounts a workspace tree. Passing it would let an operator switch the capability
      #     on for a deployment that cannot serve it; `palai up --native` remains the path.
      #   * PALAI_SESSION_ACCOUNT_HELPER — a privileged HOST path that mints macOS session accounts. A
      #     Linux container has none, and a path interpolated into one names a file that is not there.
      # tests/docs/deployment_reachability_test.go holds both, with these reasons, and fails on a 42nd.
      PALAI_PUBLIC_BASE_URL: ${PALAI_PUBLIC_BASE_URL:-}
      PALAI_TOOL_CALLBACK_BASE_URL: ${PALAI_TOOL_CALLBACK_BASE_URL:-}
      PALAI_OPENAI_COMPATIBLE_BASE_URL: ${PALAI_OPENAI_COMPATIBLE_BASE_URL:-}
      PALAI_S3_REGION: ${PALAI_S3_REGION:-}
      PALAI_METRICS_DISK_PATH: ${PALAI_METRICS_DISK_PATH:-}
      PALAI_WORKSPACE_IDLE_TTL: ${PALAI_WORKSPACE_IDLE_TTL:-}
      # The E26 background ceilings, passed for the reason every line here is: a setting the panel may
      # write is a setting this container has to RECEIVE, or the write lands in the desired document and the
      # process never sees it. They are read per call inside the dispatcher, so the value has to be in the
      # environment rather than captured at start.
      PALAI_BACKGROUND_DISABLED: ${PALAI_BACKGROUND_DISABLED:-}
      PALAI_BACKGROUND_MAX_WALL_TIME: ${PALAI_BACKGROUND_MAX_WALL_TIME:-}
      PALAI_BACKGROUND_MAX_PER_RUN: ${PALAI_BACKGROUND_MAX_PER_RUN:-}
      PALAI_BACKGROUND_MAX_PER_HOST: ${PALAI_BACKGROUND_MAX_PER_HOST:-}
      PALAI_BACKGROUND_LOG_TTL: ${PALAI_BACKGROUND_LOG_TTL:-}
      # Catalogued but NOT panel-writable, and passed for exactly that reason: the entry tells an operator
      # this switch is set on the machine rather than from a form, and a name compose does not list cannot be
      # set on the machine either — `--env-file` supplies values, it cannot introduce a key. Empty is absent.
      PALAI_ALLOW_LOCAL_REPOSITORY: ${PALAI_ALLOW_LOCAL_REPOSITORY:-}
      # How long one attempt's ENGINE may run. It sits on the control plane and not on the runner
      # because the limits ride the lease: the plane decides the bound and the machine enforces the one
      # it was given, so the two cannot disagree about how long a run had.
      PALAI_ENGINE_WALL_TIME: ${PALAI_ENGINE_WALL_TIME:-}
      PALAI_ABANDONED_LEASE_GRACE: ${PALAI_ABANDONED_LEASE_GRACE:-}
      PALAI_DRAIN_TIMEOUT: ${PALAI_DRAIN_TIMEOUT:-}
      PALAI_QUEUE_TICK: ${PALAI_QUEUE_TICK:-}
      PALAI_QUEUE_DELIVERY_BACKOFF: ${PALAI_QUEUE_DELIVERY_BACKOFF:-}
      PALAI_SCHEDULE_TICK: ${PALAI_SCHEDULE_TICK:-}
      PALAI_SCHEDULE_BATCH: ${PALAI_SCHEDULE_BATCH:-}
      PALAI_TRIGGER_RECONCILE_TICK: ${PALAI_TRIGGER_RECONCILE_TICK:-}
      PALAI_TRIGGER_RECONCILE_BATCH: ${PALAI_TRIGGER_RECONCILE_BATCH:-}
      PALAI_TRIGGER_MAPPED_GRACE: ${PALAI_TRIGGER_MAPPED_GRACE:-}
      PALAI_WEBHOOK_TICK: ${PALAI_WEBHOOK_TICK:-}
      PALAI_WEBHOOK_BACKOFF_BASE: ${PALAI_WEBHOOK_BACKOFF_BASE:-}
      PALAI_WEBHOOK_BACKOFF_MAX: ${PALAI_WEBHOOK_BACKOFF_MAX:-}
      PALAI_SSE_HEARTBEAT: ${PALAI_SSE_HEARTBEAT:-}
      PALAI_SSE_POLL_INTERVAL: ${PALAI_SSE_POLL_INTERVAL:-}
      PALAI_SSE_WRITE_TIMEOUT: ${PALAI_SSE_WRITE_TIMEOUT:-}
      PALAI_SSE_BATCH_LIMIT: ${PALAI_SSE_BATCH_LIMIT:-}
      PALAI_ARTIFACT_GC_INTERVAL: ${PALAI_ARTIFACT_GC_INTERVAL:-}
      PALAI_ARTIFACT_GC_GRACE: ${PALAI_ARTIFACT_GC_GRACE:-}
      PALAI_INBOUND_RAW_TTL: ${PALAI_INBOUND_RAW_TTL:-}
      PALAI_INBOUND_MAX_INFLIGHT: ${PALAI_INBOUND_MAX_INFLIGHT:-}
      PALAI_INBOUND_BACKLOG_MAX: ${PALAI_INBOUND_BACKLOG_MAX:-}
      PALAI_INBOUND_TOLERANCE: ${PALAI_INBOUND_TOLERANCE:-}
      PALAI_MCP_TIMEOUT: ${PALAI_MCP_TIMEOUT:-}
      PALAI_MCP_SWEEP_INTERVAL: ${PALAI_MCP_SWEEP_INTERVAL:-}
      PALAI_MCP_SWEEP_GRACE: ${PALAI_MCP_SWEEP_GRACE:-}
      # The two egress gates open loopback and RFC1918 and both read `== "1"`, so an unset deployment
      # stays CLOSED — which is why passing them costs nothing and withholding them cost a self-host
      # operator the only way to reach an MCP server on their own network.
      PALAI_MCP_ALLOW_PRIVATE: ${PALAI_MCP_ALLOW_PRIVATE:-}
      PALAI_A2A_PUSH_ALLOW_PRIVATE: ${PALAI_A2A_PUSH_ALLOW_PRIVATE:-}
      PALAI_A2A_PUSH_ALLOWED_HOSTS: ${PALAI_A2A_PUSH_ALLOWED_HOSTS:-}
      PALAI_SLACK_API_BASE_URL: ${PALAI_SLACK_API_BASE_URL:-}
    secrets:
      - provider_one_key
      - bootstrap_api_key
      - pg_password
      - master_key
    volumes:
      - "${PALAI_HOME}/ca:/palai/ca:ro"
      - "${PALAI_HOME}/runner-token:/palai/runner-token:ro"
    ports:
      - "127.0.0.1:${PALAI_API_PORT}:8080"
      - "127.0.0.1:${PALAI_RUNNER_PORT}:8443"
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  runner:
    build:
      context: ../..
      dockerfile: deploy/compose/runner.Dockerfile
      args:
        PALAI_VERSION_STAMP: ${PALAI_VERSION_STAMP:-}
    image: ${PALAI_RUNNER_IMAGE:-palai/runner:local}
    environment:
      PALAI_CONTROLLER_URL: https://control-plane:8443
      PALAI_CONTROLLER_DNS: control-plane
      # ‼️ PALAI_CONTROLLER_CA, NOT PALAI_RUNNER_CA_CERT, AND THE RENAME IS THE POINT. This file used to
      # give the agent the same name the control-plane service above uses for a DIFFERENT thing: there it
      # is the CA the plane SIGNS runner certificates with (beside _CA_KEY and _SERVER_CERT); here it is
      # the CA an agent TRUSTS. One name meaning two things in one file is worse than an alias, and the
      # entrypoint had to translate it because the binary never read that name at all.
      PALAI_CONTROLLER_CA: /palai/ca/ca.crt
      # The bootstrap credential: spent at enrollment, and re-presented ONLY if the runner's
      # identity expires before renewal could roll it forward (a sleeping laptop, a stalled
      # Docker Desktop) — the one recovery path that needs no operator. Never persisted by the
      # runner; the control plane rate-limits it to one certificate per issued lifetime.
      PALAI_ENROLLMENT_TOKEN_FILE: /palai/runner-token
      PALAI_ENGINE_IMAGE: ${PALAI_ENGINE_IMAGE}
      # E15 T2: overrides the baked version stamp the runner advertises in the enroll handshake (§48.2
      # window / OPS-008). Unset = the image's stamp; a drill sets it (e.g. 0.12.0) to prove skew rejection.
      PALAI_VERSION: ${PALAI_VERSION:-}
      # Concurrent lease slots on this runner. Default 1 (LP-0 + existing stacks unchanged); the
      # delegation smoke sets 2 so a run's parent and its inline child each hold an engine (§25.18).
      PALAI_RUNNER_CONCURRENCY: ${PALAI_RUNNER_CONCURRENCY:-1}
      # How many sessions this machine says it can hold AT ONCE — the ceiling coordinator.AcquireLease
      # enforces (Faz A.4 T5). UNSET DECLARES NOTHING AND IS THE DEFAULT: `${VAR:-}` leaves an empty
      # string, cmd/runner reads that as no declaration, and the enrolment body stays byte-identical —
      # so every stack built before this line enrols with no ceiling exactly as it did.
      #
      # It has no `:-1` like the slot count above, and that asymmetry is the point: a default here
      # would cap every container runner at a number no operator chose, which is the clamp
      # 000005_capacity_declaration deleted for exactly that reason.
      PALAI_RUNNER_CAPACITY: ${PALAI_RUNNER_CAPACITY:-}
      # The compose project this runner belongs to; it labels every engine sandbox it
      # launches so `palai local down` reaps exactly this stack's orphaned engines (H4).
      PALAI_COMPOSE_PROJECT: ${PALAI_COMPOSE_PROJECT}
      # WHERE THIS MACHINE RUNS A SHELL COMMAND (A.3). The control plane no longer holds a
      # process-wide executor: a run's shell tool call travels to the machine holding the attempt's
      # lease and runs HERE, so THIS copy is what decides whether `palai.workspace.shell` can run
      # anything at all. Unset on both leaves the tool refusing cleanly, which is what every compose
      # deployment before A.3 did.
      #
      # THE `${VAR:-}` FORM MATCHES THE CONTROL-PLANE BLOCK ABOVE, and the tree's older reason for
      # insisting on it does NOT hold on this Docker. Measured 2026-08-04, Docker 24.0.2, both forms
      # in one file, read from INSIDE the started containers:
      #
      #   docker compose --env-file X -f probe.yaml up -d && docker exec <c> sh -c 'echo $VAR'
      #     environment: {VAR: "${VAR:-}"}  -> the operator's value        VAR unset -> PRESENT, empty
      #     environment: {VAR:}             -> the operator's value        VAR unset -> ABSENT
      #
      # So a bare key IS settable, from the shell and from --env-file alike; the only difference is
      # whether an unconfigured deployment gets an empty variable or no variable. posture.RunnerFromEnv
      # reads these with os.Getenv, which cannot tell those apart, so the choice here is consistency.
      #
      # PALAI_SHELL_NATIVE HERE MEANS THIS CONTAINER, NOT THE HOST, and that is the whole of the
      # remaining Mac gap: `palai up --native` makes the CONTROL PLANE native and leaves the runner a
      # Linux container, so an `xcodebuild` dispatched to it would not find a Mac. Reaching a Mac's own
      # toolchain now needs the RUNNER on the Mac.
      PALAI_SANDBOX_IMAGE: ${PALAI_SANDBOX_IMAGE:-}
      PALAI_SHELL_NATIVE: ${PALAI_SHELL_NATIVE:-}
      PALAI_SANDBOX_WALL_TIME: ${PALAI_SANDBOX_WALL_TIME:-}
      # ‼️ WHICH POOL THIS MACHINE JOINS, AND UNDER WHICH POSTURE. cmd/runner/main.go has read both since
      # enrolment existed and compose passed NEITHER, so every containerised machine landed wherever the
      # unnamed default put it — measured 2026-08-06, alongside PALAI_RUNNER_CAPACITY three lines up,
      # which this file did pass. A fleet whose machines cannot be told apart is one where "devices are
      # free, and a device may belong to one project" is a sentence with no way to say it.
      #
      # Unset leaves both empty and the enrolment behaves exactly as it did, which is what makes adding
      # them safe on a running deployment.
      PALAI_RUNNER_POOL: ${PALAI_RUNNER_POOL:-}
      PALAI_RUNNER_POSTURE: ${PALAI_RUNNER_POSTURE:-}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${PALAI_HOME}/ca/ca.crt:/palai/ca/ca.crt:ro"
      - "${PALAI_HOME}/runner-token:/palai/runner-token:ro"
    depends_on:
      control-plane:
        condition: service_healthy

secrets:
  provider_one_key:
    file: "${PALAI_HOME}/secrets/provider-one"
  bootstrap_api_key:
    file: "${PALAI_HOME}/api-key"
  pg_password:
    file: "${PALAI_HOME}/secrets/pg-password"
  # The secret-store master key. The slot exists on every stack (`palai init` / every bring-up
  # creates it EMPTY, like provider-one, because a missing mount source fails `compose up`
  # outright); it only DOES anything when PALAI_SECRET_MASTER_KEY_FILE above names it. Same path
  # the production overlay and `palai restore verify`'s secret canary already use.
  master_key:
    file: "${PALAI_HOME}/secrets/master-key"
  # ‼️ A `github_app_key` FILE SECRET WAS DECLARED HERE AND NOTHING CREATED THE FILE. Its comment said
  # "ensureSecretSlots creates it, like provider-one, because a missing mount source fails `compose up`" —
  # and ensureSecretSlots' loop names provider-one and nothing else, while applyGitHubAppEnv, the function
  # that used to fill it, went with the deployment-global App on 2026-08-05. So the sentence explaining why
  # the file must exist was the proof it no longer did: a fresh `palai up` never wrote it, and the first
  # containerised bring-up on a clean home would have failed on a mount source that was never there.
  # Removed with the mechanism it belonged to; a publication now authenticates with the binding's own
  # connection_ref, which is a database row and not a mount.

volumes:
  palai-pg: {}
  palai-objects: {}
