{
  "components": {
    "headers": {
      "ApiVersion": {
        "description": "Dated API version that served the request.",
        "example": "2026-07-16",
        "schema": {
          "type": "string"
        }
      },
      "RequestId": {
        "description": "Correlates the response with server-side logs.",
        "schema": {
          "$ref": "../schemas/common/id.json#/$defs/request_id"
        }
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "description": "Client-generated key that makes response creation idempotent.",
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "minLength": 1,
          "type": "string"
        }
      },
      "LastEventId": {
        "description": "Resume an event stream after the given event id.",
        "in": "header",
        "name": "Last-Event-ID",
        "required": false,
        "schema": {
          "type": "string"
        }
      },
      "ResponseId": {
        "in": "path",
        "name": "response_id",
        "required": true,
        "schema": {
          "$ref": "../schemas/common/id.json#/$defs/response_id"
        }
      },
      "SessionId": {
        "in": "path",
        "name": "session_id",
        "required": true,
        "schema": {
          "$ref": "../schemas/common/id.json#/$defs/session_id"
        }
      }
    },
    "responses": {
      "Problem": {
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../schemas/common/problem.json"
            }
          }
        },
        "description": "RFC 9457 problem document.",
        "headers": {
          "API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          },
          "Request-Id": {
            "$ref": "#/components/headers/RequestId"
          }
        }
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "bearerFormat": "opaque",
        "scheme": "bearer",
        "type": "http"
      }
    }
  },
  "info": {
    "description": "Canonical Palai HTTP contract. JSON Schema 2020-12 bodies are referenced from protocols/schemas; a mechanical OpenAPI 3.1.2 projection is derived for generators that cannot yet read 3.2.",
    "title": "Palai HTTP API",
    "version": "2026-07-16"
  },
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "openapi": "3.1.2",
  "paths": {
    "/v1/capabilities": {
      "get": {
        "operationId": "getCapabilities",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": true,
                  "type": "object"
                }
              }
            },
            "description": "Advertised capabilities.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Advertise supported capabilities"
      }
    },
    "/v1/responses": {
      "post": {
        "operationId": "createResponse",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/execution/response-create.json"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/execution/response.json"
                }
              }
            },
            "description": "Accepted; the response is being produced.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Location": {
                "description": "URL of the created response resource.",
                "required": true,
                "schema": {
                  "format": "uri-reference",
                  "type": "string"
                }
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Create a response"
      }
    },
    "/v1/responses/{response_id}": {
      "get": {
        "operationId": "getResponse",
        "parameters": [
          {
            "$ref": "#/components/parameters/ResponseId"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/execution/response.json"
                }
              }
            },
            "description": "The response resource.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          },
          "410": {
            "$ref": "#/components/responses/Problem"
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Fetch a response"
      }
    },
    "/v1/responses/{response_id}/cancel": {
      "post": {
        "operationId": "cancelResponse",
        "parameters": [
          {
            "$ref": "#/components/parameters/ResponseId"
          }
        ],
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/execution/response.json"
                }
              }
            },
            "description": "Cancellation accepted.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Cancel a response"
      }
    },
    "/v1/sessions": {
      "get": {
        "description": "A tenant-scoped, cursor-paged page of sessions. Each row carries the whole Sessions screen — label, the agent profiles its runs pinned, metered tokens and the activity span — so rendering a page costs one request and not one per row. `agents` is plural because the association is per-run: a session may have used none, one, or several. Ordered newest-first by (created_at, id); that order is total, so `next_cursor` cannot skip or repeat a row across a page boundary.",
        "operationId": "listSessions",
        "parameters": [
          {
            "description": "Page size, 1..100 (default 20).",
            "in": "query",
            "name": "limit",
            "required": false,
            "schema": {
              "maximum": 100,
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "description": "Opaque cursor from a previous page's next_cursor. Bound to the calling tenant: a cursor minted for another tenant is a 400 invalid_cursor, never a silently empty page.",
            "in": "query",
            "name": "after",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Filter by session lifecycle state.",
            "in": "query",
            "name": "status",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "created_after",
            "required": false,
            "schema": {
              "format": "date-time",
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "created_before",
            "required": false,
            "schema": {
              "format": "date-time",
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/common/pagination.json"
                }
              }
            },
            "description": "A page of sessions.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "List sessions"
      },
      "post": {
        "operationId": "createSession",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/execution/session-write.json"
              }
            }
          },
          "description": "Optional session label. Absent leaves the session unlabelled, and its projection then derives one from the first prompt.",
          "required": false
        },
        "responses": {
          "201": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/execution/session.json"
                }
              }
            },
            "description": "The created session.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Location": {
                "description": "URL of the created session resource.",
                "required": true,
                "schema": {
                  "format": "uri-reference",
                  "type": "string"
                }
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Create a session"
      }
    },
    "/v1/sessions/{session_id}": {
      "get": {
        "operationId": "getSession",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/execution/session.json"
                }
              }
            },
            "description": "The session resource.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Fetch a session"
      },
      "patch": {
        "description": "Sets the session's operator label. This is the write path that matters: a session opened implicitly by POST /v1/responses never passed through session creation, so a create-time name would leave exactly the sessions a list is full of with no way to be labelled. The label is NOT unique — several sessions may share one. `name` must be present; an empty string clears the operator label and returns the row to its derived one.",
        "operationId": "updateSession",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/execution/session-write.json"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/execution/session.json"
                }
              }
            },
            "description": "The renamed session resource.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Rename a session"
      }
    },
    "/v1/sessions/{session_id}/commands": {
      "post": {
        "operationId": "createCommand",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../schemas/execution/command-create.json"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/execution/command.json"
                }
              }
            },
            "description": "The command was durably accepted (queued, not necessarily applied).",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Submit a durable session command"
      }
    },
    "/v1/sessions/{session_id}/events": {
      "get": {
        "operationId": "streamSessionEvents",
        "parameters": [
          {
            "$ref": "#/components/parameters/SessionId"
          },
          {
            "$ref": "#/components/parameters/LastEventId"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "text/event-stream": {
                "schema": {
                  "$ref": "../schemas/execution/event.json"
                }
              }
            },
            "description": "Server-sent event stream of session events.",
            "headers": {
              "API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              },
              "Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "summary": "Stream session events"
      }
    }
  },
  "security": [
    {
      "bearerAuth": []
    }
  ]
}
