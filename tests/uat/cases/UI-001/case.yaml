id: UI-001
name: console-accessibility-axe-clean-and-keyboard-operable-manual-screenreader-is-operator-leg
proof_class: e2e-deterministic
provider: fake
input: "The open-core console is accessible (§47.1/§47.5, UI-001). The AUTOMATED proof is playwright + axe-core against the built console, and as of E19 T7 it runs on TWO PROFILES over the SAME spec files: a deterministic FAKE /v1 upstream, and a REAL compose control plane reached with a real bootstrap API key taken from the environment. On both: axe-core reports ZERO WCAG 2 A/AA violations on the admin surface AND on the live-run surface after a completed run; keyboard navigation reaches the visible skip link as the FIRST Tab stop and genuinely Tabs through to operate the run flow with no mouse; status is conveyed by a glyph + word, never color alone. WHAT THE REAL PROFILE NARROWED: the axe scans now cover surfaces no fixture had ever rendered — an admin panel over a genuinely EMPTY collection, and the ERROR panel the console shows for a capability the real stack does not mount (/v1/secret-refs is unregistered on compose) — and the keyboard flow drives a REAL run over a REAL SSE stream to a REAL terminal. WHAT IT DID NOT NARROW, precisely: the keyboard claim's APPROVE half stays fake-only because no compose run can reach an approval at all (see UI-002), and the manual VoiceOver/screen-reader pass over a DEPLOYED console is untouched — axe is not a screen reader, and COMPOSE IS NOT A DEPLOYMENT. A deployed console is NOT claimed here. That pass remains the other half of §6 operator leg 8 and `console` stays preview."
expect_status: completed
proof:
  - "apps/web-console/tests/a11y.spec.ts:axe-core reports zero violations on the admin surface"
  - "apps/web-console/tests/a11y.spec.ts:axe-core reports zero violations on the live-run surface after a completed run"
  - "apps/web-console/tests/a11y.spec.ts:keyboard navigation: skip link is the first stop and the run→approve flow works with no mouse"
  - "apps/web-console/tests/conformance.test.mjs:every (method, path-pattern) the fixture serves is registered by the RUNNING real router"
