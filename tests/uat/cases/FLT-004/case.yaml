id: FLT-004
name: the-tenant-enters-the-runner-plane-and-a-run-with-no-machine-parks-instead-of-dying
proof_class: component-real
provider: fake
input: "A RUN NOW HAS A TENANT ON THE RUNNER PLANE, AND A RUN WITH NO MACHINE PARKS INSTEAD OF DYING. TENANT, RED FIRST AND BORN RED: the runner plane had NO tenant concept at all — enrolment carried none, `AttemptDescriptor` carried none, the lease offer carried none, `Dial` checked none — so tenant B's attempt was offered tenant A's machine, measured over the real mTLS wire against a real Postgres with two tenants, two pools and two enrolled machines. In a single-runner topology that was a definition; the moment two customers have Macs it is a hole. The rendezvous is now keyed by (TENANT, pool) rather than by pool, which makes a cross-tenant offer UNREACHABLE rather than refused — the same structural choice T2 made for the pool, and made for the same reason: a comparison inside `Dial` would be one `if` away from being softened by somebody debugging an idle Mac at 3am. The proof is two-sided, because a `Dial` that refused everything would satisfy the refusal half: the machine that must NOT be used is asserted still parked and still lease-less, and then takes its OWN tenant's run. THE TENANT IS DELIBERATELY NOT ON THE LEASE OFFER, a correction to how the plan described the fix: the refusal is a control-plane decision, and a field there would break the byte-identical offer §2 makes non-negotiable while telling the machine nothing it can act on. AND THE POOL ALONE COULD NOT HAVE TOLD TWO TENANTS APART, which is the correction underneath the tenant one: `fleet.DefaultPoolID` is a CONSTANT and migration 000045 R6 seeds it for the BOOTSTRAP tenant only, while every later organization gets a minted pool id — so every tenant that had configured nothing resolved to a pool belonging to somebody else. `ResolvePool` gained a step, the tenant's OWN default pool, read by name in the same round trip as the rest of the placement inputs; without it the tenant check would have been correct and would have parked those runs forever. PARK, RED FIRST: a run placed in a pool with no machine returned `dial engine: context deadline exceeded` — a FAILED attempt, so the retry ladder spent five of them and dead-lettered the job in about two and a half minutes, while AWS documents a Mac host taking six to twenty minutes to start. \"Bring a Mac up when load arrives\" was therefore not an economic choice, it was an UNREACHABLE BEHAVIOUR. `Dial` now spends the wait first — a runner that is merely still starting up is picked up exactly as it always was — and answers a NAMED emptiness when the pool held no machine of that tenant for the whole budget; the run parks through E23 T1's choreography with no second mechanism written, and `ExecuteAttempt` returns NIL. THE DURABLE PROOF THAT A PARKED RUN HOLDS NO DISPATCH WORKER is not the nil: the run is asserted to have ZERO attempts in an active state and exactly one carrying the parked marker, so nothing believes it is driving that run and no engine is held. WAKE, RED FIRST WITH A DEADLINE: a machine joining that pool re-enters the pool's OLDEST waiting run and appends its `response.run` job in ONE transaction, and the assertion is on the job as well as the state, because a wake that enqueues nothing is a run nobody opens an attempt for. EXACTLY ONCE is its own leg: a SECOND machine joining the same pool must not enqueue a second job for a run that is already running, because a runner re-dials after every single lease and one park would otherwise become an attempt per connect for the rest of the run's life. A WAKE DOES NOT RESERVE THE MACHINE IT WOKE FOR, and that race is shown rather than argued: one machine, two parked runs, and the run the wake did not take is asserted still `waiting` rather than failed — reserving would have been a second, parallel notion of \"assigned to\" beside the durable one the job queue already is. WHAT MADE THE WAKE SAFE IS THE HARDEST PART OF THIS TASK AND IT IS NOT IN THE PLAN: `waiting` is FOUR conditions — a human's pause, an approval, a detached child, no capacity — each with its own waker, and a capacity wake fires on every connect, so a predicate of `state = 'waiting' AND pool_id = ...` would resume paused runs against their user's decision and re-drive approval-parked runs in a loop. The marker is therefore POSITIVE and lives on the ATTEMPT (`attempts.state = 'awaiting_capacity'`), which needs NO migration — T1 owns the epic's only one — because that column has only ever held 'assigned' and 'preempted', nothing reads it for a decision, and it is the ATTEMPT that found no machine; it is cleared by the supersede the next attempt already performs. The guard was MUTATION-PROVED: removing the predicate resumes a paused run. AND `ResolvePool` HAD NO PRODUCTION CALLER — T2 built four ordered sources with a table-driven proof of each and nothing in the tree asked it, so every run went wherever the queue handed it, which is the failure this repository has shipped at least three times (`CreateSlackConnection`, `DecideToolApproval`, T3's own three fenced sites). The orchestrator is that caller now, `runs.pool_id` records the decision write-once so a resume returns to the SAME pool, and both halves are fenced BY NAME against `main.go` and `orchestrator.go` — every component proof here constructs the gateway and the orchestrator itself and would pass against a binary that wires neither; the fence was shown to go red when the wake's wiring line is removed. The record is guarded on the pool actually being this tenant's, because `runs.pool_id` has a foreign key and one typo in a project's policy would otherwise have failed every run in that project. AND THE SECOND MAC IS EXPLAINED: `palai up` now warns verbatim that N runners are enrolled but PALAI_DISPATCH_WORKERS=1, so concurrent runs are bounded by the control plane and not by the fleet — the correction of a measured lie rather than a code change, and it matters because two sessions DO run concurrently on one Mac once both knobs are raised. THREE HONEST CEILINGS, all filed: a parked run has no quota and no deadline and `PALAI_QUEUE_DEADLINE` cannot reach it (MEASURED — it reaps only a `queued` run) (`FLT-P6`); a run parked in a pool that will never have a machine waits FOREVER and the reaper is T5's, with no default duration because that would be a guess about how long a rented Mac takes to arrive (`FLT-P7`); and the park covers a pool that is EMPTY, never one that is merely busy, because a wake fires on CONNECT and a busy machine is already connected (`FLT-P8`). THIS TASK ADDS NO MIGRATION: `runs.pool_id` is T1's 000045 R5 and `attempts.state` is 000001's."
expect_status: completed
