id: SUB-007
name: remote-a2a-child-run-executor-untrusted-and-no-credential-inheritance-wired-into-dispatchchild
proof_class: component-real
provider: fake
input: "A registered remote A2A agent acts as an external CHILD-RUN executor — the remote counterpart of an inline E08 ChildRun — and since E19 T5 it is WIRED: orchestrator.dispatchChild routes a child.request naming an a2a_remote_agents row to the client's RemoteChildRun instead of a local engine, while the inline and detached paths stay exactly as they were (E10 T8 semantics preserved). The delegated child receives the MINIMUM context (its objective only, no parent artifacts by default per the data_policy 'minimum' pin) and its reply is UNTRUSTED tool-result data folded into the child.result the engine folds (completed -> typed result; any other terminal -> a failure the parent treats per the delegation's required flag). CROWN: the remote child NEVER inherits the parent credential — the sole outbound Authorization is the remote connection's OWN redeemed secret, and an agent registered with NO credential of its own dials with NO Authorization at all rather than borrowing the platform's; a sentinel parent token, in scope both as the attempt's model-route secret and inside the parent's own stored input, reaches neither a header nor the wire. The remote's task id is CONNECTION-SCOPED: it is journaled only beside the agent that minted it, and the folded frame carries no child_run_id at all because no local run executed. The frame is built from FIXED keys, so a remote reply carrying a tool list, a capability grant, a canonical-looking child_run_id and a 'trusted' self-label grants nothing. A remote delegation that cannot be dispatched — no client wired, an unknown registration id, a DISABLED agent, or the fan-out bound reached through remote children — is DENIED, never quietly executed on the local engine under our own credentials. LOCAL proof: a deterministic FAKE-ENGINE emission delegates one child to a remote agent and the client's RemoteChildRun negotiates the card, dispatches the objective and folds an untrusted result; the WIRED leg drives the REAL dispatchChild over real Postgres (RLS-scoped a2a_remote_agents rows, the parent's journal, zero local ChildRun rows) against a loopback fake peer; the exchange also runs over the on-main T2 server (loopback). HONEST CEILING (E08): the parent run is FAKE-ENGINE driven — the engine opens NO tool to a real provider — so the delegation is a fixed frame, never a live model turn; and every peer is a LOOPBACK fixture this repo wrote, so a foreign peer accepting these dispatches remains §6 operator leg 2 (loopback != interop) and a2a stays preview."
expect_status: completed
proof:
  - adapters/integrations/a2a/client_test.go:TestA2AClientRemoteChildIsUntrustedAndNoCredentialInheritance
  - adapters/integrations/a2a/client_test.go:TestA2AClientLoopbackInteropAgainstT2Server
  - adapters/integrations/a2a/client_test.go:TestA2AClientIngestsAPushedFileOnTheDIRECTMESSAGEBranchToo
  - apps/control-plane/internal/execution/remote_child_component_test.go:TestRemoteChildDispatchesToTheRegisteredRemote
  - apps/control-plane/internal/execution/remote_child_component_test.go:TestRemoteChildNeverInheritsTheParentCredential
  - apps/control-plane/internal/execution/remote_child_component_test.go:TestRemoteChildFailureIsAnHonestParentTerminal
  - apps/control-plane/internal/execution/remote_child_component_test.go:TestRemoteChildIsRefusedRatherThanRunLocally
  - apps/control-plane/internal/execution/child_dispatch_test.go:TestRemoteAgentRidesTheChildRequestOnlyWhenNamed
  - apps/control-plane/internal/execution/child_dispatch_test.go:TestRemoteChildrenCountAgainstFanout
