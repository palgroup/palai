input: "an upstream redelivery after a lost ack (the receiver committed but the ack never reached the sender) does NOT duplicate the action — the durable source-event dedupe absorbs the retry. LOCAL seam: component-real against a real Postgres inbound pipeline PLUS the SHIPPED queue bridge (E19 T6) driving the reference QUEUE adapter's lost-ack redelivery into the real admission path — the canonical dedupe is one seam, not a per-source reinvention. §6 leg 5: a real SQS/PubSub conformance run is operator work; the cloud adapters are unwritten and deliberately NOT advertised in discovery."
expect_status: completed
proof:
  - apps/control-plane/internal/automation/inbound_component_test.go:TestRedeliveryAfterLostAckDoesNotDuplicate
  # Queue-adapter leg (E17 T7): the SAME redelivery-after-lost-ack crux proven via the durable queue
  # adapter — a crashed consumer's un-acked message redelivers and the append-only idempotency ledger
  # makes the effect run exactly once (real Postgres; no real broker — SQS/PubSub/Kafka is the operator leg).
  - apps/control-plane/internal/automation/queue_adapter_component_test.go:TestQueueAdapterRedeliversAfterLostAckSingleEffect
  # WIRED leg (E19 T6): the SAME lost-ack redelivery, now through the SHIPPED consume->admit bridge and the
