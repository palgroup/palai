id: BGT-002
name: a-tool-call-returns-a-handle-and-the-model-keeps-working-and-no-new-read-tool-is-added
proof_class: component-real
provider: fake
input: "THE DEFINING PROPERTY OF THIS EPIC IS THE ONE MOST LIKELY TO BE BUILT WRONG, AND IT IS THE ONLY ONE WHOSE TEST HAS TO DISTINGUISH SUCCESS FROM A CONVINCING IMITATION OF IT. A park-and-wait would also, eventually, let a second tool run — after the attempt ENDED and a later one resumed — so `TestTheModelCallsAnotherToolWhileTheBackgroundProcessIsStillRunning` carries two assertions in one function and neither alone is the claim. THE PARK ASSERT: the spawning dispatch returned NIL, not errRunPaused and not errRunAwaitingApproval, the run reads `running` in the database afterwards, and the model was handed a tool.result to continue on — the attempt did not end. THE SECOND-TOOL ASSERT: a DIFFERENT tool call, made after the spawn in the SAME attempt, completed and wrote a real file, while the kernel still listed the background process. Everything here is driven BY TOOL NAME through the production dispatcher — dispatchTool resolves the tool out of the broker a deployment registers, runs the shipped approval gate, writes the shipped ledger row and delivers the shipped frame — because a test that builds its own config never sees the config production builds, which is how a shell wall time was simultaneously unbounded on the host and refusing every call in the container while every sandbox test stayed green. BACKGROUND IS A PARAMETER, NOT A SECOND TOOL, taken verbatim from the published harness behaviour: `background: true` on palai.workspace.shell returns `{task_id, output_path, status}` WHILE THE PROCESS IS STILL RUNNING, measured as a SEQUENCE rather than a stopwatch — the call returned, and at that moment `kill(-pgid, 0)` against a pgid THE PROCESS ITSELF WROTE DOWN still succeeds. THE RETURNED BODY CARRIES NO OUTPUT AND THAT IS A CONTEXT DECISION: a model backgrounds a five-minute build precisely so it does not have to hold that build's output, and the test asserts the ABSENCE of stdout, stderr, content and output keys. AND NO NEW READ TOOL IS ADDED — the output is a file under the allocation's `.palai-session` subtree, which Snapshot already skips whole, and `palai.workspace.file` already reads files under escape control; two consecutive mid-flight reads return a RISING line count with the second an extension of the first, both taken while the kernel still lists the process, so the silence of a long build is broken by a file rather than by a fourth output mechanism. The vendor reached this conclusion first and shipped it as a deprecation: `TaskOutput` is 'Deprecated in favor of Read on the task's output file path'. THREE TASKS RUN AT ONCE, all three process groups alive at the same instant, three separate log files, and each log asserted to contain its own marker and NEITHER of the other two. THE APPROVAL GATE IS A STRUCTURAL ORDERING CLAIM AND IT CARRIES ITS OWN NON-VACUITY HALF, because without that half it was worth nothing: measured at the fork point, the gated assertion PASSED before a line of this task was written — there was no spawn path at all, so a counter reading zero was free — so the same function now asserts that the IDENTICAL call on the IDENTICAL harness with the gate OFF reads ONE. The spawn lives inside Exec, which dispatchTool reaches only after the gate, so `background: true` cannot be a side door around E23; the gated call starts zero processes, runs zero synchronous commands, leaves the ledger row `approval_pending` and creates no output file at all. DISABLED MEANS REFUSED, NEVER DOWNGRADED, and a SECOND counter is the entire proof: a silent fall back to a synchronous run would satisfy every assertion about 'no background task was started' while doing the one thing this feature exists to prevent, so the test counts the synchronous runner too and requires zero — and the switch fails CLOSED on a value it cannot parse, because an operator who wrote `=yes` meant off. A backgrounded `cd` does not carry over: the next command runs in the allocation root, compared through the machine's own symlink resolution because a Mac temp dir is reached via /var while `pwd` reports /private/var. The kill tool takes ONE argument, is ClassIdempotent, and killing twice is killing once — while a task id this run did not start is REFUSED rather than answered, so a mistyped id is never reported as a dead task. BIT-UNCHANGED IS PINNED AS A COMMITTED WORD RATHER THAN A RECOMPUTED BASELINE: the exact key set a shell call produced before background execution existed is a literal in the test, recorded by running it against the tree at the fork point, and it covers both what the model receives and what the ledger row stores — with the background counter at zero, because an unchanged result would mean nothing if the call had quietly detached and then waited. THE HONEST CEILING THIS CASE SHIPPED WITH WAS CORRECTED RATHER THAN LEFT TO ROT: T2 recorded that a started task's handle lived in MEMORY, so a kill by id failed after a control-plane restart, and named a test for it — E26 T5 then deleted both the registry and that test, replacing them with the durable row, and the claim is now the opposite one (`TestARestartedControlPlaneAdoptsItsRunningTasksFromTheRowRatherThanFromMemory`, BGT-005). The line naming the deleted test stayed in this file for two tasks, which is a proof entry that resolved to nothing — the same family of hole as a `-run` allow-list that does not name a test. What DOES remain a ceiling: there is still no live progress stream; the model must read the file, and nobody tells it ten more lines arrived. AND THE READ IS REDACTED, WHICH IS THE CONDITION E26 T6 ADDED TO THIS CASE AND THE ONE THAT MADE THE §2.2 'no new read tool' decision cost something. A background process writes its OWN file, so it bypasses both redactors — they act on a CAPTURED Go string — and `palai.workspace.file` had never masked anything it read; the exit notice then quoted the last 2 KiB of that same file into `commands.payload` and `delivered_messages`, which is an asymmetry with the synchronous path, where a result is masked before it reaches `tool_calls.result`. BOTH LANDING SITES ARE NOW CLOSED FROM ONE FUNCTION, asserted in ONE test for the reason T5 collapsed two setters into one: two redaction points are two chances to diverge. A run pinned to a real environment, sealed through the real AES-256-GCM store, spawns a build that prints its own environment plus a token-SHAPED string; the shipped file tool returns `***` for both and the shipped notice composer quotes `***` for both, while the raw bytes on the allocation still carry the value — which is what makes the two masks a redaction rather than a log that never contained anything. BOTH REDACTORS RUN AND NEITHER SUBSTITUTES FOR THE OTHER: the value sentinel matches no secret pattern, so masking it can only be the VALUE-based redactor, and the shaped token resolves to no environment value, so masking it can only be the SHAPE-based one. THE VALUE IS RE-RESOLVED AT READ TIME because the row holds key NAMES and never values — which is E25 T3's “there is no handle to redeem” rewritten for the first time, since for a background task there is one and it is a row. NO FIELD OF ANY ROW CARRIES A VALUE, measured by DECODING every column `background_tasks`, `events`, `commands` and `tool_calls` return and re-walking anything that parses as JSON or base64 — never a raw substring scan, which over an encoded field can never fail and which this repository shipped exactly once. AND UNBOUNDED PLUS A CREDENTIAL IS REFUSED: a value handed to `exec.Cmd.Env` lives in the kernel's environ copy for the whole life of the process, so a task with no `deadline_at` is a credential with no expiry — the refusal is a CODE GATE and not a CHECK constraint, because `PALAI_BACKGROUND_MAX_WALL_TIME=0` stays a legitimate choice for a task that carries nothing, and the identical call with no environment is accepted with a NULL deadline in the same test. A RUN PARKED FOR A HUMAN STILL HOLDS NOTHING: the background path did not move `resolveEnvValues`, which runs one statement before Execute, and a gated call resolves ZERO values — counted at the resolver, with the ungated call resolving exactly one beside it. THE EXPOSURE THAT REMAINS IS NAMED RATHER THAN SOFTENED: anything running as the same uid can read the value out of the process, which is EQUALLY TRUE OF A SYNCHRONOUS COMMAND under the same executor and the same uid and is governed by `MAC-P6`; background does not widen that exposure, it LENGTHENS it, and the length's ceiling is §0.2's wall time. NO TIER ADVANCES, for the reason T1 gave: making a tool asynchronous is not evidence about the plane that tool runs on. §6 OPERATOR LEGS THIS CASE DOES NOT COVER: leg 1, a real xcodebuild backgrounded on a real Mac with a measured duration — the only real evidence of why this feature exists; and leg 5, whether a credential in a background task's environment is observable from another process under the same uid on the operator's own machine, which is an observation rather than an assertion."
expect_status: completed
