id: BGT-002
name: a-tool-call-returns-a-handle-and-the-model-keeps-working-and-no-new-read-tool-is-added
proof_class: component-real
provider: fake
input: "THE DEFINING PROPERTY OF THIS EPIC IS THE ONE MOST LIKELY TO BE BUILT WRONG, AND IT IS THE ONLY ONE WHOSE TEST HAS TO DISTINGUISH SUCCESS FROM A CONVINCING IMITATION OF IT. A park-and-wait would also, eventually, let a second tool run — after the attempt ENDED and a later one resumed — so `TestTheModelCallsAnotherToolWhileTheBackgroundProcessIsStillRunning` carries two assertions in one function and neither alone is the claim. THE PARK ASSERT: the spawning dispatch returned NIL, not errRunPaused and not errRunAwaitingApproval, the run reads `running` in the database afterwards, and the model was handed a tool.result to continue on — the attempt did not end. THE SECOND-TOOL ASSERT: a DIFFERENT tool call, made after the spawn in the SAME attempt, completed and wrote a real file, while the kernel still listed the background process. Everything here is driven BY TOOL NAME through the production dispatcher — dispatchTool resolves the tool out of the broker a deployment registers, runs the shipped approval gate, writes the shipped ledger row and delivers the shipped frame — because a test that builds its own config never sees the config production builds, which is how a shell wall time was simultaneously unbounded on the host and refusing every call in the container while every sandbox test stayed green. BACKGROUND IS A PARAMETER, NOT A SECOND TOOL, taken verbatim from the published harness behaviour: `background: true` on palai.workspace.shell returns `{task_id, output_path, status}` WHILE THE PROCESS IS STILL RUNNING, measured as a SEQUENCE rather than a stopwatch — the call returned, and at that moment `kill(-pgid, 0)` against a pgid THE PROCESS ITSELF WROTE DOWN still succeeds. THE RETURNED BODY CARRIES NO OUTPUT AND THAT IS A CONTEXT DECISION: a model backgrounds a five-minute build precisely so it does not have to hold that build's output, and the test asserts the ABSENCE of stdout, stderr, content and output keys. AND NO NEW READ TOOL IS ADDED — the output is a file under the allocation's `.palai-session` subtree, which Snapshot already skips whole, and `palai.workspace.file` already reads files under escape control; two consecutive mid-flight reads return a RISING line count with the second an extension of the first, both taken while the kernel still lists the process, so the silence of a long build is broken by a file rather than by a fourth output mechanism. The vendor reached this conclusion first and shipped it as a deprecation: `TaskOutput` is 'Deprecated in favor of Read on the task's output file path'. THREE TASKS RUN AT ONCE, all three process groups alive at the same instant, three separate log files, and each log asserted to contain its own marker and NEITHER of the other two. THE APPROVAL GATE IS A STRUCTURAL ORDERING CLAIM AND IT CARRIES ITS OWN NON-VACUITY HALF, because without that half it was worth nothing: measured at the fork point, the gated assertion PASSED before a line of this task was written — there was no spawn path at all, so a counter reading zero was free — so the same function now asserts that the IDENTICAL call on the IDENTICAL harness with the gate OFF reads ONE. The spawn lives inside Exec, which dispatchTool reaches only after the gate, so `background: true` cannot be a side door around E23; the gated call starts zero processes, runs zero synchronous commands, leaves the ledger row `approval_pending` and creates no output file at all. DISABLED MEANS REFUSED, NEVER DOWNGRADED, and a SECOND counter is the entire proof: a silent fall back to a synchronous run would satisfy every assertion about 'no background task was started' while doing the one thing this feature exists to prevent, so the test counts the synchronous runner too and requires zero — and the switch fails CLOSED on a value it cannot parse, because an operator who wrote `=yes` meant off. A backgrounded `cd` does not carry over: the next command runs in the allocation root, compared through the machine's own symlink resolution because a Mac temp dir is reached via /var while `pwd` reports /private/var. The kill tool takes ONE argument, is ClassIdempotent, and killing twice is killing once — while a task id this run did not start is REFUSED rather than answered, so a mistyped id is never reported as a dead task. BIT-UNCHANGED IS PINNED AS A COMMITTED WORD RATHER THAN A RECOMPUTED BASELINE: the exact key set a shell call produced before background execution existed is a literal in the test, recorded by running it against the tree at the fork point, and it covers both what the model receives and what the ledger row stores — with the background counter at zero, because an unchanged result would mean nothing if the call had quietly detached and then waited. HONEST CEILING, AND IT IS A TEST RATHER THAN A PARAGRAPH: the started task's handle lives in MEMORY until the park gate, the exit notification and the reaper read migration 000047's row (T3, T4, T5), so a kill by id FAILS after a control-plane restart — and the same test asserts the PROCESS IS UNAFFECTED and still running, which is what makes this survivable rather than broken: the task belongs to the RUN, not to the process that spawned it. There is also still no live progress stream; the model must read the file, and nobody tells it ten more lines arrived. NO TIER ADVANCES, for the reason T1 gave: making a tool asynchronous is not evidence about the plane that tool runs on."
expect_status: completed
