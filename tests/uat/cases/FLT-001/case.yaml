id: FLT-001
name: a-fleet-is-an-inventory-two-machines-are-two-rows-and-the-server-mints-the-identity
proof_class: component-real
provider: fake
input: "A FLEET IS AN INVENTORY BEFORE IT IS ANYTHING ELSE, AND THIS TABLE WAS ORDERED BY TWO FILES THAT NEVER MET. `runner_gateway.go:73` wrote that there is no hosts/runners table in this tier and called one 'the SaaS/post-SH-0 upgrade path'; `local_credentials.go:122` wrote, independently, that 'bounding concurrent identities per token needs a runner registry the single-runner SH-0 topology does not have; that is the upgrade path'. Two files, the same missing thing, no conversation between them. Migration 000045 is that table. WHAT WAS NOT TRUE BEFORE: the gateway accepted N runners already — `handleConnect` has no count guard and `available` was an unbuffered channel every parked machine sent itself down — but only two things were single-runner, and both were memory: `cordoned`/`revoked` were process-global atomic.Bools, and `identity atomic.Pointer[RunnerIdentity]` was ONE SLOT WHERE THE LAST WRITER WON, so with two machines up `palai local doctor` read whichever had presented a certificate most recently and knew nothing at all about the other. RED FIRST, TWICE. Two machines enrol and the registry carries TWO ROWS with two distinct ids — red at zero rows, because there was no table. And two machines claiming the SAME `runner_id` each receive their OWN identity — red with both issued `runner-local.runners.palai.internal`, because the gateway signed whatever name the enrolling party asked for (`enrollRequest{RunnerID, PublicKey}` carried no org, no project, no pool and no posture, and `runnerDNS(request.RunnerID)` trusted it) while `deploy/compose/runner-entrypoint.sh:10` hardcodes `PALAI_RUNNER_ID=runner-local`. So `docker compose up --scale runner=3` was three machines holding ONE certificate identity, and in a fleet 'revoke machine X' is meaningful only if X is the SERVER's word. THE SERVER MINTS THE ID NOW: the client's `runner_id` demotes to a LABEL, the certificate's DNS is derived from the server's `rnr_` id, and both directions of backward compatibility hold — a machine that names no pool still lands in `pool_default` and a pre-registry certificate resolves found=false rather than erroring, because an upgraded stack must not refuse its own runner. THEN THE VERIFICATION PASS FOUND THREE THINGS THE FIRST IMPLEMENTATION HAD NOT, and the first is the one worth reading. TWO ID MINTERS THAT NEVER MET: `handleEnroll` minted an `rnr_` id and derived the certificate from it, and the store minted an id OF ITS OWN for the row — so the certificate named one machine and the row named another, and since every later lookup goes through the SAN (a renew presents a certificate, never an id), `last_seen_at` could never advance for ANY runner. The registry recorded a fleet it could not then recognise. Nothing caught it because the FAKE registry minted its own id exactly as the store did, reproducing the divergence faithfully, and both wire proofs asserted on enrolment's output. The fix is the INVARIANT rather than the symptom: the store stops minting and REFUSES a registration whose DNS is not derived from its id. THE DOWN MIGRATION HAD NEVER RUN: `DROP COLUMN project_id` aborts with 2BP01 because an RLS POLICY names the column, and since MigrationDown is one concatenated chain this did not fail one test but TWENTY-SIX, including the tree's own forward-and-backward gate — one block moved above the column drops, and that it went unnoticed is the same fact as the rest, that the postgres component tier had never been run against this branch. AND THE BIT-UNCHANGEDNESS PROOF WAS STEALING A SINGLETON: once it was actually on the component `-run` allow-list it ran, called ProvisionFirstOrg with a key of its own, and claimed the singleton bootstrap identity on the database every component leg shares; it has its own database now. THE UPGRADE PROOF NEEDS NO LIVE STACK: `PALAI_MIGRATE_FAULT_AFTER=44` stops the boot runner one migration short, which is exactly the head an existing install sits on, and what it then asserts is that the bootstrap key still AUTHENTICATES — a key that no longer resolves is a lost row whatever a count says — and that the pre-upgrade run carries `pool_id` NULL, because a backfilled default would claim a placement decision nobody took. THE ENROLMENT JOURNAL IS APPEND-ONLY, copying migration 000040's `capability_jobs` pattern verbatim (GRANT SELECT, INSERT then REVOKE UPDATE, DELETE), and the journal entry commits in the SAME transaction as the row it describes — a door that turns a machine away and records nothing leaves an operator with an enrolment that 'just fails'. FOUR NEW TENANT TABLES, four `palai_apply_tenant_policy` calls, and neither tenant can read or address the other's machines. HONEST CEILING: two machines, one box, one process tree, darwin/arm64. This is an inventory of fake runners built from the SHIPPED enrollment package against the SHIPPED gateway over a real mTLS wire and a real PostgreSQL — it is not two physical machines, and §6 leg 1 (a CAPTURED, re-derivable receipt from two physical machines) is OPEN and got BIGGER, because it now covers a real remote enrolment and a real machine revocation across a restart. §6 leg 2, `linux/amd64` verification, is untouched and E24 makes it MORE pressing rather than less: a fleet is heterogeneous by definition and `runner_pools.arch` can already name an architecture nothing in this program has ever run on."
expect_status: completed
proof:
  - apps/control-plane/internal/execution/runner_registry_test.go:TestTwoRunnersAreTwoRowsInTheRegistry
  - apps/control-plane/internal/execution/runner_registry_test.go:TestTwoMachinesClaimingOneRunnerIDGetSeparateIdentities
  - apps/control-plane/internal/execution/runner_registry_test.go:TestTheEnrolledRowIsTheOneTheCertificateFindsAgain
  - apps/control-plane/internal/fleet/store_component_test.go:TestRegistryRecordsEachMachineOnceWithItsOwnJournalEntry
  - apps/control-plane/internal/fleet/store_component_test.go:TestRegisterRefusesAnUnknownPool
  - apps/control-plane/internal/fleet/store_component_test.go:TestRegisterRefusesAnIdentityItsDNSDoesNotName
  - apps/control-plane/internal/fleet/store_component_test.go:TestRecordSeenAdvancesLivenessAndReportsAnUnknownCertificate
  - apps/control-plane/internal/fleet/store_component_test.go:TestReadsAreConfinedToTheCallersTenant
  - apps/control-plane/internal/execution/runner_registry_component_test.go:TestBootstrapInstallEnrollsItsRunnerIntoTheDefaultPool
  - apps/control-plane/internal/execution/runner_pool_test.go:TestASingleRunnerDeploymentWithNoPoolConfigurationIsBitUnchanged
