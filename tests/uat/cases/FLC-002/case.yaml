id: FLC-002
name: a-policy-form-that-writes-the-whole-document-a-value-shown-once-and-a-confirmation-only-the-irreversible-half-gets
proof_class: e2e-deterministic
provider: fake
input: "THE MOST INNOCENT BUTTON AN ADMIN CONSOLE CAN CARRY OPENS THE APPROVAL GATE TO EVERYONE, AND THIS CASE IS THAT MEASURED AND THEN CLOSED (E28 T2, FLC-002). The chain is four links and every one of them was already in the tree: (1) `PATCH /v1/projects/{project_id}` is an ASSIGNMENT — `identity/store.go` `UpdateProjectPolicy` marshals the decoded `configPolicyInput` and hands the bytes to `UpdateProjectConfigPolicy`, with no merge and no patch; (2) that struct's four list fields are nil-able Go slices, so a request naming only `pool` stores `approvers: null` and the list is not left alone but ERASED; (3) `HIL-P11` measured that an unconfigured approver list is PERMISSIVE — every principal in the project may approve; (4) therefore a form offering to put a project on a Mac pool silently opens the approval gate, and the operator's own action succeeds while it happens. THE TREE ALREADY KNEW THIS IN A COMMENT — `cmd/cli/internal/admin/admin.go`, verbatim, 'the realistic accident is setting --pool and silently dropping --approvers', and `docs/operations/runner-fleet.md` says it to an operator — and a comment is not a control. MEASURED RED FIRST, AGAINST A NAIVE FORM RATHER THAN ASSERTED: a form that PATCHed `{config_policy: {pool}}` set the pool exactly as asked and the read-back returned `approvers: null`. The fixture reproduces the marshal step field for field, so the red is the real API's behaviour and not a fixture's opinion. WHAT IS PROVEN NOW, driven by a real browser against the built console and re-run under both colour schemes: the form READS the current document first (`GET /v1/projects/{project_id}`), fills all five fields, and SENDS all five — asserted twice and deliberately, once on the stored outcome and once on the request BODY the browser actually put on the wire, because a server that merged would let the outcome assertion pass over a form still sending one field. An operator who changes the pool has explicitly KEPT the other four, and a field they cannot see is a field they did not send — which is why the screen states the assignment semantics rather than quietly repairing them: the same operator's next `palai admin project set-policy` has no read-first step to save them. `HIL-P11` IS ON SCREEN where the operator can act on it — an empty approver list renders a warning saying every key in the project may approve — and writing a ceiling does not close it; what it prevents is an empty box reading as a locked door. The pool control is a `<select>` and never degrades to free text, which matters most where it is most tempting: every deployment before E28 T1 had exactly one pool. A VALUE THE SERVER MINTED IS SHOWN ONCE AND IS FINDABLE NOWHERE AFTERWARDS. `RevealOnce` is NOT a variant of `SecretField` and the plan measured why: that component takes what a HUMAN writes, and `type=password`, `autocomplete=new-password` and `takeSecret()` are all inapplicable to a value that arrives in a fetch response body and is therefore in JavaScript memory before any component exists. What the two share is one rule — the value never enters the component's state, ref cache or effect — and this one adds that it reaches no PERSISTENT place at all. PROVEN AS AN ENUMERATION AND NOT AN EYEBALL: a key is minted from the console, the region is dismissed, the page is RELOADED, and the value is absent from the serialized document PLUS every input's live `.value` property, from every key AND value of `sessionStorage`, the same of `localStorage`, from the full `location.href`, and from every response body the reload produced — including the console's own `GET /v1/api-keys`, which is asserted to have been READ by finding the key's ID in it, so the zero is a statement about the secret rather than about an empty haystack. Shown RED first, against the natural accident: a page that kept the value in `sessionStorage` so a refresh would not lose it, restored it on mount, and put it back in the DOM after a reload. THE COPY BUTTON IS CONDITIONAL, AND THE FALLBACK IS THE CARRYING PATH. `Clipboard.writeText` is secure-context only (MDN, verbatim: 'Writing to the clipboard can only be done in a secure context'), and an operator reaching this console over plain `http://` is a supported posture in this tree — compose's edge TLS lives in the `production.yml` overlay and not in the base profile. So with no `navigator.clipboard` the button is not rendered at all, a 'select the value and copy it' sentence stands in its place, and the value is STILL readable: the computed `user-select` is asserted (not the source), a `copy` event dispatched at the node is asserted not to have been cancelled, and a range selection over the node is asserted to yield the value. Shown RED against the naive component on all three: an unconditional button, `user-select: none`, and an `onCopy` calling `preventDefault`. WCAG 2.2 §3.3.8's normative text is about authentication FIELDS and no conformance to it is claimed here; what is carried across is its RATIONALE — 'would force the user to transcribe information' — which does not depend on the direction of travel, and that distinction is written in the component rather than assumed. A `NotAllowedError` is NOT swallowed: the refusal is rendered with its name, and the value stays on screen, because an error that also removed the one copy of a one-time credential would be worse than the failure it reports. A `role=\"status\"` region announces that the value arrived and is asserted NOT to contain it, since an announcement is read aloud in whatever room the operator is in. THE IRREVERSIBLE CONFIRMATION EXISTS FOR A PUBLISHED CRITERION AND FOR NOTHING ELSE YET. WCAG 2.2 SC 3.3.4 is satisfied by any ONE of three legs, and `cordon`/`resume`/`unbind` satisfy the Reversible leg — so `window.confirm` STAYS on them, keeping every property (keyboard operation, screen-reader announcement, focus trap) that a hand-rolled dialog has to re-earn and that axe cannot check. A revoke cannot satisfy that leg, the Checked leg is vacuous with no data entered, and the word 'reviewing' inside the Confirmed leg is a REQUIREMENT: the dialog shows the key's id, its project and its capabilities before the irreversible step. Once justified, the ARIA APG's four requirements are asserted on the rendered page — `role=\"alertdialog\"`, `aria-modal=\"true\"`, and an `aria-labelledby`/`aria-describedby` whose targets are RESOLVED rather than merely present — plus the modal keyboard contract: twenty `Tab` presses and twenty `Shift+Tab` presses each assert focus is still inside the dialog, `Escape` cancels, nothing is revoked, and focus returns to the control that opened it. Shown RED: without the trap, focus left on the second press. AND THE DISTINCTION IS ITSELF A TEST — a spec drives the environment screen's unbind and counts the native dialog, so converting the reversible half to this component is a red test rather than a review question. AND THE CONTRAST SWEEP FOUND SOMETHING NOBODY WAS LOOKING FOR: the capability checkboxes are the first checkboxes in this console, and `tests/contrast.spec.ts` read them as `border=null fill=null` — a native checkbox's boundary is drawn by the UA stylesheet, which no rule in this repository can measure and no token in `globals.css` controls. They now draw their own at `--border-control` (3.69:1 light, 4.45:1 dark, measured) and are sized at `--control-h-sm`, which is that file's own declared SC 2.5.8 floor with the comment 'and nothing goes under it' — a native checkbox had been under it all along. HONEST CEILINGS, FOUR. FIRST, BOUNDING EVERYTHING ABOVE: the minted value passes through the console's Node process, once, in memory — the relay is a pass-through and there is no other way for a control plane to hand a browser a credential; this is E25 T4's ceiling in the opposite direction. SECOND: no claim is made that the bytes leave BROWSER memory. A fetch response body lives until GC and no web API controls that; what is claimed is that the value reaches no persistent place and cannot be retrieved. THIRD: the policy form is LAST-WRITER-WINS — two operators saving at once means the second erases the first, because `PATCH /v1/projects/{id}` carries no `If-Match`; filed as `FLC-P6`. FOURTH: focus starting on CANCEL is a CHOICE and no accessibility requirement is claimed for it — the ARIA APG describes a choice of which element receives focus and publishes no normative sentence preferring the least destructive action; it matches what `window.confirm` already does here, and filed as `FLC-P5` a vendor silence is not a design freedom. NOT COVERED, and a §6 operator leg rather than a gap: no DEPLOYED console, no manual screen-reader pass, and no browser other than Chromium — what is proven is 'axe-clean with the WCAG 2.0+2.1+2.2 tags' and never 'accessible'. NO TIER ADVANCES ON THIS CASE and `console` stays preview: a management screen is not evidence about the plane it manages."
expect_status: completed
proof:
  - "apps/web-console/tests/policy.spec.ts:setting only the pool from the console leaves the approver list intact"
  - "apps/web-console/tests/policy.spec.ts:the request body carries all five policy fields, not the one that changed"
  - "apps/web-console/tests/policy.spec.ts:an empty approver list is shown as permissive, in words, before it is saved"
  - "apps/web-console/tests/policy.spec.ts:the pool control stays a dropdown and never degrades to a free-text box"
  - "apps/web-console/tests/policy.spec.ts:the revoke dialog is an alertdialog that reviews what is about to die"
  - "apps/web-console/tests/policy.spec.ts:Tab cannot leave the open dialog, and Escape cancels it"
  - "apps/web-console/tests/policy.spec.ts:window.confirm is still the confirmation for the REVERSIBLE actions"
  - "apps/web-console/tests/reveal-once.spec.ts:a minted key survives nowhere: not the DOM, not either storage, not the URL, not a later response"
  - "apps/web-console/tests/reveal-once.spec.ts:the value is readable and copyable by hand in a context with no clipboard API"
  - "apps/web-console/tests/reveal-once.spec.ts:a refused clipboard write is shown, not swallowed"
  - "apps/web-console/tests/reveal-once.spec.ts:the arrival of a one-time value is announced, and the region is axe-clean"
  - "apps/web-console/tests/contrast.spec.ts:every interactive control carries a 3:1 boundary against the surface behind it (SC 1.4.11)"
  - "apps/web-console/tests/a11y.spec.ts:every route lib/routes.ts declares was actually scanned by axe"
