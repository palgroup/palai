id: FLT-002
name: the-pool-is-the-queue-and-the-label-and-the-order-in-it-is-chosen-explicitly
proof_class: component-real
provider: fake
input: "A RUNNER POOL IS THE QUEUE, THE LABEL AND THE POSTURE, AND PLACEMENT INTO ONE IS A REFUSAL RATHER THAN A PREFERENCE. Before this task the gateway had a SINGLE unbuffered `available` channel that every parked runner sent itself down and every Dial received from, with no pool on either side, so a Mac pool and a container pool were two names for one queue and any parked machine satisfied any attempt. It is now one queue per pool behind an RWMutex, and a machine parked in pool A is STRUCTURALLY unreachable from a Dial on pool B — there is no code path left that could relax the refusal into a preference. RED FIRST: an attempt naming the `unsandboxed-host` pool was offered a runner enrolled in `pool_default`, and the proof is two-sided, because a Dial that always failed would satisfy the refusal — the machine that must NOT be used is asserted still parked and still lease-less, and then takes the run that IS its pool's. THE ORDER INSIDE A POOL IS A DECISION, NOT A PRESERVED BEHAVIOUR: the capability plane's queue is `ORDER BY latest.job_id LIMIT 1` over a crypto/rand hex id, so the smallest hex wins and keeps winning, which is a starvation rather than an order. E24 chooses `created_at` FIFO and writes it where the queue lives, with its reason — a run a human is waiting on must not be overtaken because another run's identifier sorted lower. THE COORDINATE IS THE RUN'S TIMESTAMP, NOT THE ATTEMPT'S ARRIVAL, so a run bounced by a cordon, a retry or a resume keeps its place instead of going to the back of the line every time it is bounced. The proof turns both plausible WRONG orders into its own inputs: three attempts arrive in one order, carry ids that sort in a second, carry timestamps in a third, and only the timestamps decide. THE PUSH MODEL IS KEPT AND POLLING IS REFUSED: the runner parks and receives a push, so queue latency is not bounded by a poll interval and there is no losing herd from a poll without SKIP LOCKED. PLACEMENT RESOLVES IN ONE FUNCTION, NEVER PER CALLER: the run's own pool_id (a resume returns to the same pool), the agent revision's binding, the project `config_policy.pool`, then the default — and each table case names a pool at more than one level, because which of two wins is the entire decision. POSTURE IS THE POOL'S FIELD AND THE MACHINE'S CLAIM IS COMPARED, NEVER VERIFIED: a runner states its posture at enrolment, the registry compares it with the pool's, and a disagreement refuses the enrolment with a 409 and journals `refused` with what was declared and what the pool is. We are not verifying the claim — there is no attestation on this wire — we are catching a mismatch, and those are two different assertions, said in those words in the code. A SINGLE-RUNNER DEPLOYMENT WITH NO POOL CONFIGURATION IS BIT-UNCHANGED, asserted on BYTES rather than on behaviour: the lease offer is compared byte-for-byte against the message the gateway produced before this task, and the enrolment request body of a machine that declares no posture is compared against the literal this package has always sent. Non-vacuity was checked rather than argued — adding a `pool_id` to the offer turns the byte comparison red. HONEST CEILINGS, all three filed: there is NO prioritisation inside a pool and an urgent run cannot jump (`FLT-P1`); a LYING runner can enrol into a `sandboxed-linux` pool and execute on the host, because verification needs attestation and this epic does not build one (`FLT-P2`); and the agent-revision placement step is ORDERED but has nowhere to read from, because `agent_revisions` has no pool column and E24 owns exactly one migration (`FLT-P3`, a correction to the plan). THIS TASK ADDS NO MIGRATION: 000045 is the epic's only one."
expect_status: completed
