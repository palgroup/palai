id: BGT-003
name: a-run-with-a-live-task-does-not-finish-and-a-response-says-waiting-for-tool-for-the-first-time-in-this-repositorys-history
proof_class: component-real
provider: fake
input: "A RUN WHOSE MODEL SENT run.terminal{completed} WHILE A TASK IT STARTED WAS STILL COMPILING BECAME `completed`, AND THAT IS THE SHAPE OF THIS CASE: not a missing feature but a run reporting an outcome for work that had not happened. It PARKS now — the attempt ends cleanly, the dispatch worker is released, and the run waits — and the park GOVERNS ON THE OPERATING SYSTEM'S ANSWER rather than on our own bookkeeping: the gate asks the probe whether the process group is still alive, so a row that says `running` about a process that died decides nothing. Four legs draw the boundary in both directions, because a park that fires too often is the same defect as one that never fires: a run with a live task parks, a run with none still completes, a FAILED terminal does not park at all (a failure is an answer and holding it back to wait for a build would turn an error into a hang), and a task whose handle is `lost` or unprobeable does NOT park the run — an unprovable handle already receives no signal, and parking on one would strand a run behind a process nobody can prove exists. THE PARK BODY IS NOT WRITTEN, IT IS GENERALISED. parkForApproval was already the one variant that accepts a checkpoint-sink-less park, and its own reasoning transfers verbatim: the woken attempt replays the transcript, reaches the same boundary and reads the same row. This is that choreography's THIRD user after E23 T1 and E24 T4, and a second body would have meant two waking bugs. AND THE PLAN'S OWN MEASUREMENT OF §3.6 D3 WAS WRONG TWICE OVER, IN THE DIRECTION THAT MATTERS. The plan said a live response reads `in_progress`. It reads `queued`: InsertResponse writes 'queued', the terminal UpdateResponse writes the end, and NOTHING HAS EVER WRITTEN A STATE IN BETWEEN — so ResponseTable's `provisioning` and `in_progress` were both unreachable, and `waiting_for_tool`, legal only from `in_progress`, was unreachable THROUGH them. The published schema has advertised these three states for three years (protocols/schemas/execution/response.json, protocols/asyncapi/asyncapi-3.1.yaml, and a conformance test asserting the enum) while no code path could produce one, which means an SDK author polling a run has been watching it jump from queued straight to terminal. E26 is therefore the FIRST PRODUCTION CALLER of a state machine this repository shipped with its spec — the sixth 'declared and never wired' measured in this line of work, and by some distance the largest. Two writes were needed, not one: the run reaches `in_progress` when the model's first turn is dispatched, and `waiting_for_tool` when it parks, because a transition the machine calls illegal cannot be reached by writing only its destination. MONOTONICITY WAS HONESTLY GREEN AT THE FORK POINT and is asserted anyway, with its non-vacuity demonstrated AGAINST THE FIX rather than claimed at the fork: nothing wrote waiting_for_tool at all, so nothing could overwrite a terminal, and a guard that cannot fail reports the same green as one that passes — the conditional UPDATE is the same discipline FinalizeResponse's has always used. THE SSE STREAM STAYS OPEN ACROSS THE PARK, which the console's own comment already asserted for waiting_for_approval and which is now a test rather than a comment: the stream survives the park and closes on the terminal, so a client watching a build does not see its connection drop and retry. THE RESPONSE STAYING OPEN IS A PRODUCT DECISION AND IS RECORDED AS ONE: a user sees `waiting_for_tool` while a build runs, and the alternative — the run finishes and the exit notification opens a NEW response — would have meant two waking paths, which §2 refuses. HONEST CEILING: this case proves the park and the state, not the wake. Nothing here notices an exit, nothing re-enters the run and no notification is delivered; BGT-004 owns all three, and until it lands a parked run stays parked. The proofs are component-real against a real PostgreSQL and the SHIPPED finalizer, with a fake provider, on ONE machine — §6 leg 2 (a control-plane restart during a real build, on a real service manager) is operator work and is never claimed here. NO TIER ADVANCES, and the reason is the rule T1 and T2 already gave: making a tool asynchronous is not evidence about the plane that tool runs on."
expect_status: completed
proof:
  - apps/control-plane/internal/execution/background_park_component_test.go:TestARunWithALiveBackgroundTaskParksInsteadOfCompleting
  - apps/control-plane/internal/execution/background_park_component_test.go:TestARunWithNoLiveBackgroundTaskStillCompletes
  - apps/control-plane/internal/execution/background_park_component_test.go:TestAFailedTerminalDoesNotParkOnALiveBackgroundTask
  - apps/control-plane/internal/execution/background_park_component_test.go:TestALostOrUnprobeableBackgroundTaskDoesNotParkTheRun
  - apps/control-plane/internal/execution/background_park_component_test.go:TestAParkedRunsResponseReadsWaitingForTool
  - apps/control-plane/internal/execution/background_park_component_test.go:TestALiveResponseReachesInProgressBeforeItParks
  - apps/control-plane/internal/execution/background_park_component_test.go:TestWaitingForToolNeverOverwritesATerminalResponse
  - apps/control-plane/internal/execution/background_park_component_test.go:TestTheParkWritesNoRunTerminalIntoTheSessionJournal
  - apps/control-plane/api/events_park_test.go:TestTheEventStreamStaysOpenAcrossAParkAndClosesOnATerminal
