id: HIL-005
name: an-approved-write-side-effect-lands-and-the-destination-still-does-not-come-from-the-model
proof_class: component-real
provider: fake
input: "AN APPROVED WRITE ACTUALLY HAPPENS — twice, on two different kinds of counterparty — AND NEITHER DESTINATION COMES FROM THE MODEL. (1) A JIRA TRANSITION. E22 wrote its own ceiling in `CAS-P4`: the agent reads a ticket and cannot update one, because \"a write side effect deserves the approval path push earned, and MCP tools have no such path today\". E23 built the path, so the write tool opens: the peer receives ZERO requests before a human decides and exactly one after — measured at the FAR END, in the fake server's request count, because a state read cannot tell you nothing left the process — and the arguments that reach the peer are BYTE-FOR-BYTE the arguments the approval screen showed, which is the whole meaning of every approval in this epic. A ticket body is still ATTACKER TEXT: a description demanding its own approval buys nothing, and the needles are swept in both directions — findable in what reached the model, findable in no decision, no approval row and no outbound body. (2) A PULL REQUEST MERGE, and its size is the epic's claim rather than an accident: once a tool call can wait on a human, the third side effect is a switch case and a CHECK value. `palai.publish.merge_pull_request` takes NO ARGUMENTS AT ALL, which is stronger than \"no destination\": WHICH pull request is the one THIS RUN opened, read back from its own published receipt; AT WHICH commit is the approved publication's `head_sha`; and HOW is the binding's `policy.merge_method`. A `pull_request_number` field would let a model aim an approved merge at somebody else's pull request while the approval message still read like this run's, and the schema guard refuses that spelling and three more (`number`, `pull_request`, `merge_method`, `method`) by SUBSTRING, because `pr` and `pull_request_number` are the same field asked for differently. THE RACE GUARD IS THE VENDOR'S AND E23 DOES NOT DECLINE IT: GitHub documents `sha` as OPTIONAL — \"SHA that pull request head must match to allow merge\", 409 \"if sha was provided and pull request head did not match\" (fetched 2026-07-29, plan §3.5 P16) — and this tree makes it MANDATORY, sending the approved publication's own head, so a head that moved between the approval and the merge takes a 409 and NOTHING merges. Without an approval the publisher is never called at all; after a deny it is never called and the run is released. AND THE PART GITHUB OWNS STAYS GITHUB'S: no required-checks query, no review request, no CI wait, no branch deletion — every refusal arrives as the documented 405 and becomes a visible warning with the provider's own reason, because a second, weaker copy of branch protection is worse than none, since it is the one people trust. LOCAL SEAM: component-real — the real dispatcher, the real Decide and the real boundary pump over real PostgreSQL, with a fake Atlassian MCP server over real TLS and a fake GitHub publisher; the `sha`-on-the-wire half is asserted untagged against a server built to GitHub's published contract. THE OPERATOR LEG THIS CASE DOES NOT COVER: §6 leg 5 — a REAL GitHub App merging a REAL pull request, and a REAL 409 from a head moved by hand — is opened by E23 and stays OPEN (the opt-in live leg logs github.com's own answer and is never claimed here); the Atlassian half's real tenant is §6's too; and §6 leg 1 is untouched and grew again. SECOND CEILING, STATED RATHER THAN DISCOVERED: this tree opens DRAFT pull requests only, and GitHub does not merge a draft until a human marks it ready for review — so the end-to-end line carries ONE HUMAN GATE MORE than the approval button, and that extra gate is GitHub's."
expect_status: completed
