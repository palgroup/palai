id: SLK-012
name: renderer-refuses-model-minted-actionable-elements
proof_class: component-real
provider: fake
input: "a run's answer becomes Block Kit through a CLOSED union with a total render function — text, table, tasks, file_ref — and the model can never reach an actionable element through it (E20 T4, plan §2). Model output carrying a literal {\"type\":\"actions\",…,\"action_id\":\"palai_approve\"} renders as ZERO actionable elements: the forged element falls to INERT TEXT (shown as characters, never deleted and never passed through) while the legitimate variants beside it still render, so the sweep is not vacuous. The sweep is shown to DISCRIMINATE by finding the two buttons interactions.go legitimately mints, and interactions.go's singularity is pinned by a source scan over the package's composite literals (approval.go PARSES action_id off a click through struct tags and is structurally excluded). WIRED: the same claim is asserted where it ships — a run driven terminal through the REAL coordinator, the REAL journal and the REAL admission route closes its stream with a table block and a plan block of task cards, and the forgery travels in markdown_text as characters. S10's status map is explicit (open/in_progress/done/canceled) and an unmapped status FAILS CLOSED to pending rather than being invented; task_display_mode's decision is applied at the block layer because it is a chat.startStream argument and blocks travel only on chat.stopStream (S12's conservative reading of a live vendor contradiction). Every vendor limit is a truncation point and every cut is VISIBLE: 50 blocks, 100 rows / 20 columns / 10,000 characters per table, 3,000 per section. Broadcast tokens on the block path are defused through the SAME NeutralizeBroadcasts the text path uses. E21 T6 WIDENS THE SAME CLAIM TO A RICHER RENDER: the model's prose now reaches Slack through a `markdown` block (M13) on the chat.postMessage path, which is where the fidelity was MEASURABLY lost — chat.stopStream already carries prose in `markdown_text`, while chat.postMessage carried it in `text`, Slack's narrower mrkdwn, so a fenced code block lost its language, a header rendered as a literal `#`, a table did not render and a nested list collapsed. A RICHER RENDER IS NOT A WEAKER DEFENCE: the markdown block's text passes through the SAME NeutralizeBroadcasts, and the sweep proving it JSON-DECODES first because encoding/json escapes `<` and a raw-substring assertion over marshalled bytes could never fail. The 12,000-character budget is CUMULATIVE across a payload rather than per block and every cut stays visible; no `block_id` is sent because the reference says it is ignored and not retained. M20(d) IS HELD FAIL-CLOSED: no published page says chat.stopStream's `blocks` array accepts a markdown block, so that path keeps its `section` until a live leg measures it, the fence is a test, and the fence is shown to DISCRIMINATE against the postMessage surface so it cannot rot into a vacuous green. M14 closes with numeric cells typed `raw_number`, carrying `type` and `text` ONLY — the data-table page's schema gives raw_number a `value`, but `value` is one of the two field names the actionable sweep hunts for, so a numeric cell carrying one would register as a forged interaction in every bundle and the only way to green it again would be to weaken the sweep; the table block's own page prints no raw_number schema, and that unconfirmed is named rather than assumed. task_card is UNTOUCHED (M15). Rejected with reasons and not silently: `alert` (modal-only, M16), `data_visualization` (buildable but no case asks for it, M17), and `actions`/`input`/`context_actions`/`icon_button`/`feedback_buttons`/`card`/`carousel`/`container` (actionable or carrying actionable children, M18 — each deserves the authorization path approve/deny earned). HONEST CEILING: blocks are validated SYNTACTICALLY against the published references, never visually — how the renderer LOOKS in a real workspace is §6 leg 1, and no file upload (S14, files:write is not requested) or video block (S13, structurally impossible for Slack-hosted media) exists here. THIS IS A LOOKS JOB, NOT AN INTERACTION JOB: it is the half of \"richer interaction\" that §2 permits, and a run that ends by STREAMING still gets the older render — visible, inconsistent, and deliberate until §6 leg 1 measures M20(d)."
expect_status: accepted
