id: SLK-012
name: renderer-refuses-model-minted-actionable-elements
proof_class: component-real
provider: fake
input: "a run's answer becomes Block Kit through a CLOSED union with a total render function — text, table, tasks, file_ref — and the model can never reach an actionable element through it (E20 T4, plan §2). Model output carrying a literal {\"type\":\"actions\",…,\"action_id\":\"palai_approve\"} renders as ZERO actionable elements: the forged element falls to INERT TEXT (shown as characters, never deleted and never passed through) while the legitimate variants beside it still render, so the sweep is not vacuous. The sweep is shown to DISCRIMINATE by finding the two buttons interactions.go legitimately mints, and interactions.go's singularity is pinned by a source scan over the package's composite literals (approval.go PARSES action_id off a click through struct tags and is structurally excluded). WIRED: the same claim is asserted where it ships — a run driven terminal through the REAL coordinator, the REAL journal and the REAL admission route closes its stream with a table block and a plan block of task cards, and the forgery travels in markdown_text as characters. S10's status map is explicit (open/in_progress/done/canceled) and an unmapped status FAILS CLOSED to pending rather than being invented; task_display_mode's decision is applied at the block layer because it is a chat.startStream argument and blocks travel only on chat.stopStream (S12's conservative reading of a live vendor contradiction). Every vendor limit is a truncation point and every cut is VISIBLE: 50 blocks, 100 rows / 20 columns / 10,000 characters per table, 3,000 per section. Broadcast tokens on the block path are defused through the SAME NeutralizeBroadcasts the text path uses. HONEST CEILING: blocks are validated SYNTACTICALLY against the published references, never visually — how the renderer LOOKS in a real workspace is §6 leg 1, and no file upload (S14, files:write is not requested) or video block (S13, structurally impossible for Slack-hosted media) exists here."
expect_status: accepted
proof:
  - adapters/integrations/slack/blocks_test.go:TestRenderRefusesToMintAnActionableElementFromModelOutput
  - adapters/integrations/slack/blocks_test.go:TestApprovalMessageIsTheOnlyMintOfAnActionableElement
  - adapters/integrations/slack/blocks_test.go:TestNoFileButInteractionsMintsAnActionableElement
  - adapters/integrations/slack/blocks_test.go:TestUnknownVariantRendersAsInertText
  - adapters/integrations/slack/blocks_test.go:TestTaskStatusMapIsExplicitAndFailsClosed
  - adapters/integrations/slack/blocks_test.go:TestOneTaskIsACardAndSeveralAreAPlan
  - adapters/integrations/slack/blocks_test.go:TestTableTruncationIsVisible
  - adapters/integrations/slack/blocks_test.go:TestBlockLimitIsVisible
  - adapters/integrations/slack/blocks_test.go:TestBlocksNeutralizeBroadcastTokens
  - adapters/integrations/slack/blocks_test.go:TestFileRefLinksOnlyHTTPAndHTTPS
  - apps/control-plane/internal/store/slack_stream_component_test.go:TestSlackStopStreamCarriesRenderedBlocksAndNoForgedButton
