id: FLT-005
name: one-machine-is-cordoned-resumed-and-decommissioned-and-the-decommission-outlives-the-process
proof_class: component-real
provider: fake
input: "A SINGLE MACHINE CAN NOW BE CORDONED, RESUMED AND DECOMMISSIONED, AND A DECOMMISSION OUTLIVES THE PROCESS THAT WAS TOLD. §3.6 D15 measured two things and the second is worse than the first. The first is what the plan expected: cordon, drain and revoke were whole-gateway `atomic.Bool`s, so taking one Mac out of service took EVERY Mac out of service. The second is that `Revoke()` and `Resume()` had NO PRODUCTION CALLER ANYWHERE IN THE TREE, and `Cordon()`'s only caller was `Drain`'s own first line whose only caller is SIGTERM — so SAN-011's hard stop, written for a compromised runner, was implemented, tested, registered in this very catalogue, and reachable by nobody. That is the FOURTH time this repository has shipped that shape (E19 T9's `CreateSlackConnection`, E23's `DecideToolApproval`, T2's own `ResolvePool`). RED (1), PER MACHINE: on a two-runner gateway over the real mTLS wire, cordoning ONE machine refused the OTHER machine's lease — measured verbatim as `Dial after cordoning ONE machine = runner gateway cordoned`. It is two-sided, because a build that ignored the cordon would satisfy 'the other one still serves': the cordoned machine is asserted to receive nothing across a full dial budget in which it is the only machine parked, to stay CONNECTED throughout (a cordon that drops the connection is an outage wearing a policy's name), and then to take a lease again after a resume. A CORDONED MACHINE LEAVES THE RENDEZVOUS RATHER THAN BEING COMPARED AGAINST INSIDE `Dial`, which is T2's structural choice for the pool and T4's for the tenant, taken here for the same reason: a machine that is not in the queue is UNREACHABLE from a Dial, so no later change can soften a refusal into a preference. `CordonRunner` EVICTS SYNCHRONOUSLY — a flag alone is only eventually effective, and a Dial arriving in that window would be handed a machine an operator had just taken out of service. That eviction broke the park loop's own discriminator, which is the subtlest thing in this task: `unpark`'s return value could no longer tell a Dial's claim from an eviction, so a RESUMED machine was stranded holding a lease it had never been offered. `markTaken` now happens UNDER THE QUEUE LOCK at the moment of handover, which makes `taken` the authority and the answer race-free because `unpark` takes the same lock. RED (2), DURABILITY: a revoked machine reconnected to a SECOND gateway on the same CA and the same database — which is precisely what a control-plane swap looks like to a machine, since the certificate it holds is still valid and the process that knew anything about it is gone. `runners.state` read `active` after a revoke because there was no row being written at all. It is a row now, written BEFORE the live gateway is told, and that order is the recovery story: a crash between the two leaves a machine recorded as revoked whose session is still up, which its next connect resolves because `handleConnect` ADOPTS the row. The opposite order would leave a cut session with no record — a revocation a restart undoes, which is the bug. The proof is two-sided again: the same restarted gateway must still admit the machine that was NOT revoked, or a build that refused every connect after a restart would pass the first half and be a total outage. A REVOKE IS IRREVERSIBLE AND THE PREDICATE IS THE ENFORCEMENT, not a rule in Go: `state <> 'revoked'` refuses to move a decommissioned machine, and `OR $4 = 'revoked'` is what keeps a repeated revoke IDEMPOTENT — an operator who cannot repeat one cannot confirm one, and a not-found would read as a wrong id. It is journalled exactly ONCE however many times it is repeated, by the append's own `NOT EXISTS` rather than by a read-then-write two concurrent callers would both pass; another tenant revoking the same machine is a non-disclosing not-found. RED (3), REACHABILITY: `palai admin runner revoke <id>` did not exist, and the test demanded a surface that did not exist, which is the point. The four verbs (`list`/`cordon`/`resume`/`revoke`) are proved against the GERÇEK router rather than a stub, because a stub proves the CLI builds a path and only the real mux proves something answers it — and the assertion is on WHICH verb and WHICH machine reached the store, since a route that answered 200 having asked for the wrong one would otherwise pass. The three routes are `POST /v1/runners/{id}/{cordon,resume,revoke}`, one mux pattern each, so the action reaching the store is a literal in the router's own file: an unknown verb is a 404 from the mux and there is no string anywhere to validate into a `runners.state` value. Gated on `provision`, and the refusal is asserted by the store having been asked NOTHING — a 403 written after the write would be a 403 that changed the fleet. E15 T2'S DRAIN IS KEPT AND PROVED BIT-UNCHANGED. The body is identical — same whole-gateway cordon, same 25ms tick, same handover to the E10 recovery layer by exiting anyway, same nil-on-quiesce and `ctx.Err()`-on-timeout — and only the counter moved: `active atomic.Int64` became one counter per machine and the whole-gateway drain waits on the SUM, because a drain that read one machine's counter would return nil while another was mid-lease, which is a control plane exiting during somebody's run. A test drives the SIGTERM path over two machines to say so. A PER-RUNNER `Drain` IS DELIBERATELY NOT A SURFACE: nothing in production would call one, and this task's whole subject is surfaces with no caller. The per-machine counter has an operator-facing consumer instead — `active_leases` on the single runner read — because after cordoning a Mac the only question left is whether it can be taken AWAY, and there was no way to ask. It is a pointer, so zero (the answer that means yes) is distinguishable from 'no gateway was asked'. THE HEARTBEAT IS A PING, AND THE PLAN'S PREMISE FOR IT WAS FALSE. §T5 reasoned that binding `readLoop`'s `default` arm was nearly free 'because the frame already arrives and is thrown away'. It does not arrive: `packages/runner` writes exactly `runner.hello`, `engine.frame` and `lease.complete`, and while PARKED it is blocked in Read and writes nothing at all. A gateway-driven WebSocket ping needs NO runner change — the peer answers from inside its own read loop, which every runner is in for its whole session — and it proves strictly more than a timer-driven frame: that the connection is alive in BOTH directions right now. That is what catches the failure the reaper exists for, a session alive to the kernel and dead to the process (a suspended laptop, an unplugged Mac, a wedged runner), where `readLoop` learns nothing because a peer that stopped answering produces no read error. The dead machine in the proof is a raw client that completes the handshake and never reads again, and the non-vacuity half is its own test: a live machine answers three passes, keeps its session, and is still leasable. The `default` arm IS bound as well, rate-limited, as forward compatibility for a runner that grows one. `runners.last_seen_at` NOW ADVANCES WHILE A MACHINE SITS PARKED, which before this froze the moment it finished connecting however long it then waited. THE REAPER WRITES NO `unhealthy` STATE, AND THAT IS A CORRECTION TO §T5 RATHER THAN A SHORTCUT. `runners.state` is CHECK-constrained to ('pending','active','cordoned','revoked') by migration 000045, and E24 owns exactly one migration which is T1's — so `unhealthy` is not a value this task can write. It is also not a value it needs: health is DERIVED from `last_seen_at`, which is already durable and now advancing, while a stamped flag would additionally have to be CLEARED when the machine came back, and a reaper re-derives after a restart either way. What the cut DOES decrement is the count that decides whether the next run parks or rides the retry ladder — the gateway's own pool membership — so a pool whose machines are all dead is an ABSENT pool and a run PARKS rather than being handed a corpse. That is asserted as `ErrPoolHasNoRunner` after the cut, which is the same distinction T4 built. AND THE PARK REAPER CLOSES T4'S `FLT-P7`, WITH ITS ANSWER LEARNED BY THE CALLER RATHER THAN BY THE MODEL — a third correction. §T5 says the parked run is WOKEN and the model LEARNS the 'no capacity' answer. Measured against the tree, a capacity park happens at the DIAL: before any engine process exists, with no tool call in flight and no model in the loop, so there is nothing to hand a tool result to — and a plain wake would re-dial into the same empty pool and park again forever. What CAN learn is the CALLER, so the run reaches a terminal `timed_out` whose problem detail says no runner joined its pool, which is the shape §20.12's queue deadline already uses for a run that waited too long to start (`TimeoutQueuedIfExpired`). E23 T1's choreography is reused rather than a second one written, and so are the EXISTING `run.timed_out.v1` event and the state machine's existing (waiting -> timed_out) edge: no new event type, no contract change, no migration. `PALAI_FLEET_PARK_TTL` HAS NO DEFAULT and unset expires nothing however old the park — AWS documents a Mac host taking approximately 6 to 20 minutes to start, so any number chosen here would be a guess about somebody else's fleet. Three of the four legs exist because a careless reaper passes the fourth: a park inside its TTL is left alone, an unconfigured deployment moves nothing, and a run waiting for ANY OTHER reason (the marker removed and nothing else changed) is untouched — the same guard T4 needed for the wake, because `waiting` is four conditions with four wakers and a fleet knob must not end a run a person paused. THE COMPOSITION ROOT IS FENCED BY NAME AND THE FENCE WAS SHOWN TO GO RED. Every component proof in this epic constructs the gateway, the registry and the router itself, so all of them would pass against a binary that wired none — which is exactly how the surface this task exists to reach became unreachable. Three sites are pinned: `WithLifecycle` (a cordon reaches the SESSIONS, not only the row), `WithRunners` (the routes are mounted at all) and `HeartbeatLoop` (the reaper runs), plus `WithCapacityParkTTL` so the knob is not an environment variable that does nothing. THREE HONEST CEILINGS, ALL FILED: a revoked CERTIFICATE never enters a CRL, so revocation is gateway-bound rather than certificate-bound and a second mTLS consumer would accept it — there is none today (`FLT-P9`); the heartbeat interval and its timeout are FIXED and not tunable per pool (`FLT-P10`); and a revoked machine can still RE-ENROL as a new identity, because the server mints a new id, so what stops a compromised machine coming back is the pool KEY's revocation and not this one (`FLT-P11`). THIS TASK ADDS NO MIGRATION: `runners.state` and the journal's `revoked` entry kind are both T1's 000045, and 000045 is the epic's only one. §6 OPERATOR LEG NOT COVERED: leg 1, a CAPTURED and re-derivable receipt from TWO PHYSICAL MACHINES, is open and now includes a real machine revocation surviving a real control-plane restart — the restart here is a second gateway in the same process tree on the same CA and database, which is the right shape and the wrong scale. Leg 2, `linux/amd64` verification, is untouched."
expect_status: completed
