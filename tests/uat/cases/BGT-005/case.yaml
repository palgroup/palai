  - apps/control-plane/internal/execution/background_reaper_component_test.go:TestARestartedControlPlaneAdoptsItsRunningTasksFromTheRowRatherThanFromMemory
  - apps/control-plane/internal/execution/background_reaper_component_test.go:TestADeadTaskNoWatcherEverSawGetsNoInventedExitCode
  - apps/control-plane/internal/execution/background_reaper_component_test.go:TestAnUnprovableHandleBecomesLostAndReceivesNoSignal
  - apps/control-plane/internal/execution/background_reaper_component_test.go:TestTheSixthBackgroundTaskOfARunIsRefusedRatherThanQueued
  - apps/control-plane/internal/execution/background_reaper_component_test.go:TestTheMachineCeilingIsCountedAcrossTenantsFromTheDatabase
