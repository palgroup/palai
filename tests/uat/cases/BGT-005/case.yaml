id: BGT-005
name: the-reaper-answers-four-questions-and-every-one-of-them-is-measured-from-the-operating-system
proof_class: component-real
provider: fake
input: "A BACKGROUND PROCESS RAISES FOUR QUESTIONS AND THIS IS THE TASK THAT ANSWERS ALL FOUR, each with its own RED, and four of the five answers are measured from the OPERATING SYSTEM rather than from the row that also records them — because they are claims about a process. THE WALL CLOCK IS A COLUMN AND ITS ENFORCER IS THE REAPER, never a context: a context dies with the process that created it and a background task exists to outlive that process, so the ceiling is `deadline_at` and the thing that reads it is Reconciler.Sweep beside the other five passes. A task past that deadline is KILLED — `kill(-pgid, 0)` says so, our bookkeeping does not — recorded `expired`, and the model LEARNS it through the same notification an ordinary exit produces, waking the run it parked. UNSET MEANS SIXTY MINUTES AND UNBOUNDED HAS TO BE WRITTEN as an explicit `0`, which is the exact inverse of E24 T5's PALAI_FLEET_PARK_TTL and for a stated reason: there was no honest default for how long a rented Mac takes to arrive, and there is one for how long a build may hold a machine, because the unbounded case here is the orphan this epic is named after. A value that cannot be parsed falls back to the ceiling rather than to infinity. CANCELLING A RUN NOW ENDS ITS LIVE WORK, which CancelRunReconciled did NOWHERE: it drove the run canceled, cancelled its children and finalized the response while three process groups kept compiling, and the proof of the fix is the kernel's answer about three pgids the processes themselves wrote down. The kill happens OUTSIDE any transaction — holding a row lock across a Docker round trip turns a wedged socket into a stuck run lock — and the rows settle afterwards under the run lock, in the order T4 fixed before this second writer existed. They settle as `killed` and stamped WITHOUT a notification, because a cancelled run has no turn left to read one and whoever cancelled it already knows. ADOPTION IS A DELETION AND NOT AN ADDITION: T2's in-memory registry is gone, and E24 T5's lesson is applied verbatim — an in-memory flag is erased by a restart and a column is not. A GENUINELY SECOND CONTROL PLANE, with its own store handle, its own orchestrator and its own executor, adopts a running task from the row: the live one is left alive, it can be killed BY ID (the exact inverse of the ceiling T2 pinned as a test and this task DELETED rather than relaxed), a handle nothing ever waited on settles `exited` with exit_code NULL — with its own non-vacuity half in the same function, a watched task recording the 7 the command chose, because a column NOTHING writes also reads NULL — and a handle that cannot be PROVEN ours becomes `lost` and RECEIVES NO SIGNAL, refused with ErrHandleLost rather than with a lookup miss, since any-error-will-do would have called a plane that lost the handle a proof about signalling. CONCURRENCY IS ENFORCED AND NOT DECLARED, which is the whole reason the counts exist: E24 opened `runners.capacity` under a CHECK constraint and no Go expression ever read it. The sixth task of a run is REFUSED at the shipped default of five and not queued — a queue is a delay the model cannot see, while a refusal is an answer it can act on — and the proof counts from the DATABASE and from the PROCESS TABLE, never from a number we returned, and checks the refused command left no file. The machine ceiling is counted ACROSS TENANTS, deliberately: a per-tenant twenty would give one Mac as many concurrent builds as there are tenants, so the count runs under system scope and the per-run half is scoped in the predicate. GARBAGE IS COLLECTED BY WALKING DIRECTORIES RATHER THAN ROWS, and that is what makes the sweep stateless: this task owns no migration, so there is no column marking a log deleted, and a row-driven sweep would re-examine every task that ever ran on every tick forever. Driven by the allocations that exist it is self-limiting — a file it deletes is never listed again — and the exclusion is by TASK ID rather than by age, so a build printing nothing for a day keeps its log while a settled task past PALAI_BACKGROUND_LOG_TTL loses it. Without that, `.palai-session` grows without bound and, because Snapshot skips the whole subtree, NOBODY WOULD NOTICE, which is exactly what a silent disk leak looks like; the container half of the same question is already shipped and proven on a real daemon, where a kill is a ContainerKill followed by a ContainerRemove and the suite's own before/after container count is the assertion. THE FOUR CEILINGS ARE READ THROUGH THE FUNCTIONS PRODUCTION CALLS, at the moment they are used rather than at wiring time, because a test that builds its own configuration never sees the configuration production builds — the trap that let a shell wall time be simultaneously unbounded on the host and refusing every call in the container while every sandbox test was green. AND THE CANCELLATION KILLER TAKES NO WIRING LINE OF ITS OWN: SetBackgroundRunner wires it, so a deployment that can START a build and cannot STOP one is unrepresentable rather than merely discouraged — E26 T2 already found one instance of that shape, granted by omission across two conditionals. THE HONEST CEILING, WRITTEN AS A CONSEQUENCE AND NOT AS A DEFECT: adoption only works on the SAME MACHINE. Move the control plane to another host and the host posture's pgids mean nothing there, so everything becomes `lost`; in the container posture the containers stay on the old daemon. That follows directly from there being exactly one machine — the execution relay planned for E24 T7 was never shipped — and nothing closes it before that relay does. AND ONE ASYMMETRY WAS FOUND BY REVIEW RATHER THAN BY A RED, and it is recorded as such: killing a task that had ALREADY finished stays idempotent but now CLAIMS NOTHING, because recording `killed` for a build that exited on its own would put a false statement in the audit record and settle the row before the sweep could read the exit code the model asked about. NO TIER ADVANCES, for the reason T1 gave and every task since has repeated: making a tool asynchronous is not evidence about the plane that tool runs on. §6 OPERATOR LEGS THIS CASE DOES NOT COVER: leg 2, a control-plane restart through a REAL launchctl/systemd unit while a real build runs — this case constructs a second plane over the same database, which is not a process that died; leg 3, the orphan hunt after an overnight run, where the numbers that matter are how many io.palai.bg containers remain, how many rows read `lost`, and how much disk .palai-session holds; and leg 4, the real rate of pgid reuse on a Mac."
expect_status: completed
