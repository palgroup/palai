id: SEC-102
name: the-existing-sandbox-denial-corpus-runs-as-one-suite-that-reports-no-escape-and-quarantine-works
proof_class: component-real
provider: fake
input: "The sandbox-escape claim is an AGGREGATION, not a new attack (plan §T7): `tests/uat/escape` runs the ALREADY-PROVEN denials as ONE pass with ONE report — SAN-001 (file-tool confinement: traversal, absolute path, escaping symlink), SAN-002/004 (a REAL hardened OCI sandbox: argv form, unprivileged uid, no runtime socket, process-group kill, denied metadata-endpoint dial), SAN-003 (a REAL memory cgroup OOM with bounded termination and recorded usage), SAN-005 (snapshot restore reproduces the create-side checksums byte for byte and no secret enters the archive), SAN-006 (a REAL host kill advances the fence and the stale writer is rejected AT THE DATABASE), SAN-007/008 (reuse leaves zero prior-tenant residue; a failed destroy QUARANTINES the host, denies the next placement and surfaces in the doctor) and SAN-011 (cordon/drain/revoke). The ONE arm this task ADDED is the finding->quarantine behaviour the corpus was missing: an uncertain worker outcome quarantines the JOB, no worker re-claims it, and leaving quarantine takes a deliberate re-dispatch that FENCES the worker whose outcome was uncertain. `no_escape` and `quarantine_works` are COMPUTED from the arms' outcomes, never declared: quarantine_works is false if either quarantine arm is red no matter how green the denials are, and an arm whose `go test` printed no `--- PASS:` line (renamed, filtered out, never compiled) is NOT a pass — TestAnArmThatRanNothingIsNotAPass pins that. A materialized SAN case that no arm discharges fails the suite before any container starts (TestEveryMaterializedSANCaseIsInTheSuite), so the report can never say `no escape` over a corpus it did not run. LOCAL SEAM: the real local OCI sandbox on Docker Desktop plus real PostgreSQL — real containers, real cgroups, real fences, a deterministic fixture engine and a fake provider (E08: the engine opens no tool to a real provider). §6 operator legs: the microVM / managed high-isolation path is MANAGED-SCOPE, NOT CLAIMED (SAN-009 is reserved and unowned here, and the release index marks the §64.15 managed high-isolation line the same way); SAN-010 and SAN-012 are unowned (E10 plan §5); kernel-exploit research is out of scope — this suite proves DENIAL and QUARANTINE MECHANICS on the local OCI seam, not the absence of a kernel escape."
expect_status: completed
proof:
  - tests/uat/escape/suite_test.go:TestSandboxEscapeSuite
  - tests/uat/escape/suite_test.go:TestEveryMaterializedSANCaseIsInTheSuite
  - tests/uat/escape/suite_test.go:TestAnArmThatRanNothingIsNotAPass
  - tests/uat/escape/suite_test.go:TestRedactStripsEveryCredentialShapeTheTiersEmit
  - apps/control-plane/internal/workers/quarantine_component_test.go:TestUncertainOutcomeQuarantineIsNotSilentlyReclaimed
# ceiling: `make uat-escape` is the operator entry point and it is Docker-bound, so it is NOT in `make verify`
# (the release-matrix-smoke precedent). The two Docker-free guards above (coverage + an-arm-that-ran-nothing)
# DO ride make verify, which is what keeps the aggregation honest between runs.
