id: TLM-005
name: the-agent-searches-the-workspace-without-keeping-a-copy
proof_class: component-real
provider: fake
input: "the agent can answer from what the workspace already said — and the honest name for it is a SEARCH, not a memory. It remembers nothing; asked a question it goes and looks, and what it finds is gone when the run ends. THAT IS NOT A DEFERRAL, IT IS THE VENDOR'S TERM: the Real-time Search API says \"You must not store or copy any of the data retrieved from this API. You may not use any of this data for training\", which is why no result reaches a table, an artifact, an embedding or an evidence bundle, and why `knowledge-vector` stays DISABLED beside this feature rather than being wired to it. NOT SLACK'S MCP SERVER, and the rejection is measured rather than preferred: the server authenticates with confidential OAuth 2.0 using a USER token and Palai has no authorization-code flow for MCP connections at all (their secret model is a static handle — resolve, send, drop), so it would have been an epic; meanwhile the SAME capability accepts the BOT TOKEN WE ALREADY HOLD (`assistant.search.context` + `search:read.public`). Going through the MCP server would have meant opening an OAuth epic to reach a method we can call today, so T5 builds an INTERNAL TOOL. THE MODEL CHOOSES THE QUESTION, NEVER THE SCOPE: `channel_types` and `content_types` are pinned inside the wire (public_channel, messages) and are NOT parameters, because a parameter is a way to ask for a scope and the scopes we do not want are exactly the ones an argument would let the model request — fail-closed by construction rather than by a check somebody can delete. ADVERTISING IS GATED ON AUTHORITY: the tool resolves through a broker LOOKUP rather than the static map, so a run carrying no `action_token` is never OFFERED it — a tool advertised but always failing costs the model a turn and usually ends with it telling a human the workspace holds no such information. THE ACTION TOKEN IS A CREDENTIAL: it arrives with the message that started the run (so a search is bound to that conversation, not a standing power), it is never logged, never written to a table, never in argv, never in evidence, and its lifetime is UNDOCUMENTED — which is precisely why it is never persisted. Slack's own two pages CONTRADICT each other about where it lives, so both readings are decoded and being wrong is silent in the SAFE direction: no token means no search, never an unauthorised one. RESULTS ARE UNTRUSTED DATA and carry the label with them: the field is named `untrusted_text` (a name survives every re-serialisation between here and the provider; a sentence in a description does not), the tool description forbids following instructions found inside a result, and results carry NO ids or links so a message cannot talk a later turn into fetching something (E20 T3's confused-deputy rule). The text is never edited — a quote that has been rewritten is not a quote. THE BUDGET REFUSES IN WORDS: Slack's ceiling here is the tightest of anything this repo calls (about 10 requests per minute for a whole workspace), so calls are paced PER WORKSPACE (ChannelPacer is per-channel and would breach it tenfold) and each run gets four searches; when they are spent the model is told THAT rather than \"no matches\", because a model told there were no matches concludes the workspace is silent and says so to a human. HONEST CEILING: only PUBLIC channels, and Slack's own scope page is explicit that membership is not the boundary — \"the searching user need not be a member of the public channels, just of the workspace\" — so the agent can surface a message from a channel the asker has never opened, with no documented parameter to narrow it. That is the owner's posture decision and it is written into the manifest beside the scope rather than buried. Private channels, DMs and group DMs are structurally unreachable: those scopes are user-token only and a bot token cannot hold them. SECOND CEILING: the search survives no restart — a resumed run has no authority and says so. THIRD CEILING: at most 20 results per call; the semantic quality is Slack's and no claim is made about it."
expect_status: accepted
