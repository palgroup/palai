id: TLM-002
name: a-fresh-install-comes-up-wired-without-an-operator-who-already-knew
proof_class: e2e-deterministic
provider: fake
input: "A fresh Palai install reaches a working Slack agent without any step only someone who had done it before could take. THREE MEASURED CLIFFS ARE CLOSED, and none of them was a missing feature. (1) SECRETS WERE NEVER FRAGILE — THE POINTER WAS. Secrets are envelope-encrypted rows in Postgres and identity/secrets.go re-reads the row on every resolve, so there is no cache a restart can lose; what was lost is PALAI_SECRET_MASTER_KEY_FILE, which compose.yaml interpolated from whatever shell invoked it while the only exporter in the tree was `palai up`'s applySlackEnv — and that ran ONLY when .env.local held Slack credentials. A plain `docker compose up -d`, and every `palai up` on a stack with no Slack app, therefore booted a control-plane with dbSecretStore nil, the /v1/secret-refs routes unmounted, and every *_ref handle resolving nowhere; production.yml:47 wrote the path literally and never had the bug. The path is literal in compose.yaml now, and ensureSecretSlots — the ONE funnel every compose bring-up routes through, since `palai local up` calls it directly and `palai up` reaches it through Up() — mints the key it names rather than leaving the slot empty, because a set-but-unparseable key file is a deliberate log.Fatalf. The component-real local proof brings up the real four-service compose distribution with NO Slack credentials in the environment, writes a secret through the public API, force-recreates the control-plane, writes a second secret to prove the store is still mounted, and then AES-256-GCM-opens the first secret's stored ciphertext under the on-disk master key — the same primitives `palai restore verify`'s canary uses — so the assertion is decryption after a restart, not a 2xx. (2) A GREEN INSTALL THAT COULD NOT ANSWER. A missing SLACK_AGENT_REVISION_ID or SLACK_PRINCIPAL_ID skipped the whole workspace registration while `palai up` still exited 0; neither is a Slack value, so the operator was being asked for ids only the running stack could produce. The bring-up resolves them against the running stack over the EXISTING provisioning API — no new route is opened, asserted directly by a fake-provisioning-API test that fails on any path outside /v1/agents and /v1/api-keys — reusing the bootstrap key's own principal rather than minting one (POST /v1/api-keys would also mint a full-scope key whose plaintext is discarded: a live admin credential nobody holds), publishing the agent revision it creates because coordinator's admission verifies published_at before pinning a run, and reusing both on a re-run so a second bring-up cannot move the binding underneath the operator. EXPLICIT CONFIGURATION ALWAYS WINS, per id, and is proven by a test that fails if the fake API is called at all when both are set. A skip that survives is escalated to a WARNING when SLACK_TEAM_ID is set — and deliberately NOT when it is absent, because warning an operator who never asked for Slack on every bring-up is the same crying-wolf this case removes elsewhere. (3) THE ORPHAN SWEEP STOPPED CRYING WOLF. The MCP orphan sweep logged the same standing failure on every tick, once a minute, forever; it is logged once per process (the deterministic local proof is a COUNTER assertion over ten passes against a always-failing fake Docker client, not an eyeball), and startMCPOrphanSweep now runs one synchronous pass at boot which doubles as the reachability probe — reclaiming what an earlier process left behind, and disabling the loop with one line when the daemon cannot be reached, since MCP stdio servers need that same socket and nothing can be orphaned without it. HONEST CEILING: this case does NOT make secrets durable, it makes the pointer durable; the master key is still a FILE on the host and a KMS ceremony remains H-SEC / §6 leg 6. The agent revision the bring-up publishes is TOOL-LESS, so Slack runs stay single-step until a tool set is bound to it — a configuration state, not an engine limit. NO capability tier moves: `slack` stays preview and §6 leg 1 is unchanged, because the real-workspace receipt is still operator work that no local seam can produce."
expect_status: completed
proof:
  - cmd/cli/internal/stack/up_secret_e2e_test.go:TestASecretSurvivesARestartOnAStackWithNoSlackApp
  - cmd/cli/internal/stack/up_operator_test.go:TestMasterKeyPointerIsNotInterpolatedFromTheInvokingShell
  - cmd/cli/internal/stack/up_operator_test.go:TestEveryBringUpLeavesABootableMasterKey
  - cmd/cli/internal/stack/up_operator_test.go:TestMasterKeyIsNoLongerSlackConditional
  - cmd/cli/internal/stack/up_operator_test.go:TestRunTargetIsNoLongerAPrerequisiteForRegistration
  - cmd/cli/internal/stack/up_operator_test.go:TestExplicitRunTargetAlwaysWins
  - cmd/cli/internal/stack/up_operator_test.go:TestMissingRunTargetIsProvisionedAndSaidOutLoud
  - cmd/cli/internal/stack/up_operator_test.go:TestProvisionedRunTargetIsReusedOnASecondBringUp
  - cmd/cli/internal/stack/up_operator_test.go:TestSkipIsReportedAsAWarningNotSwallowed
  - cmd/cli/internal/stack/up_test.go:TestATeamIdAndASigningSecretAreEnoughToRegister
  - deploy/compose/slack_wiring_test.go:TestComposeCanRedeemASecretRefHandle
  - adapters/integrations/mcp/sweep_quiet_test.go:TestSweepPassErrorIsLoggedOncePerProcess
