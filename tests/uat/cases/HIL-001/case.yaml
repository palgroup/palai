id: HIL-001
name: a-side-effecting-tool-cannot-run-without-a-human-and-the-gate-is-declared-at-registration
proof_class: component-real
provider: fake
input: "A tool declared `approval_required` NEVER reaches Execute without a human's decision, and the measurement is a counter at the far end rather than a state read: the fake executor's call count must be ZERO before anybody decides and exactly ONE after — because a gate asserted by reading a row is a gate that a second code path can walk around, while a counter at the executor cannot be. THE GATE IS DECLARED AT REGISTRATION, NOT GUESSED AT THE CALL, and the reason is the vendor's rather than ours: the MCP specification says verbatim that clients \"MUST consider tool annotations to be untrusted unless they come from trusted servers\" (fetched 2026-07-29, plan §3.5 P3), so `destructiveHint` cannot be the declaration and our client does not decode `annotations` at all. The declaration is `tool_revisions.approval_required` (migration 000044 R3) for a registry or MCP tool and a Go field (`toolbroker.Tool.RequiresApproval`) for a built-in — `Unretained`'s sibling, zero storage — and it rides the per-tool publish an operator ALREADY makes, so it is one more question rather than a new ceremony. The gate sits in dispatchTool AFTER the before_tool hook and BEFORE the pre-write: a policy that already refuses this call has refused it, and a human's attention is the scarcest thing this system spends. THE BUTTON IS BOUND TO THE BYTES: `tool_calls.request_hash` is `toolbroker.RequestHash(name, args)`, so a call whose arguments moved between the question and the answer has no approval and refuses LOUDLY rather than politely — and what executes is read back off the approval's OWN ledger row, not off the replaying attempt's frame, which closes the quieter half where the frame agrees but a non-deterministic transform substituted something the human never read. DENY IS AN ANSWER, NOT SILENCE: the model receives the same structured shape a before_tool deny already produces and continues, so no second delivery path was opened. A TOOL THAT DECLARES NOTHING IS BIT-UNCHANGED — asserted, because a gate that quietly caught everything would look identical to this one from the inside. AND AN AMBIGUOUS PIN REFUSES: the grant chain can offer two bindings for one model-visible name, and taking whichever the planner emitted first would let a planner's choice decide whether a human is asked, so both entry points refuse instead. LOCAL SEAM: component-real — the REAL orchestrator over real PostgreSQL, with a fake executor and a fake Atlassian MCP peer; no socket reaches atlassian.com. THE OPERATOR LEG THIS CASE DOES NOT COVER: §6 leg 1 (a captured receipt from a REAL Slack workspace) is untouched and grew again, and §6 leg 3 (whether MCP 2025-11-25 actually defines ToolAnnotations, plan §3.5 P5) is UNCONFIRMED and stays out of the code whatever it answers."
expect_status: completed
proof:
  - apps/control-plane/internal/execution/tool_approval_component_test.go:TestToolApprovalGateNeverReachesExecuteWithoutAHumanDecision
  - apps/control-plane/internal/execution/tool_approval_component_test.go:TestToolApprovalApprovedCallRunsExactlyOnceAndWakesTheRun
  - apps/control-plane/internal/execution/tool_approval_component_test.go:TestToolApprovalDoesNotRunWhenArgumentsChangedAfterTheApproval
  - apps/control-plane/internal/execution/tool_approval_component_test.go:TestToolApprovalDenyIsAnAnswerTheModelContinuesOn
  - apps/control-plane/internal/execution/tool_approval_component_test.go:TestToolWithoutApprovalDeclaredIsBitUnchanged
  - apps/control-plane/internal/execution/mcp_write_approval_component_test.go:TestAGatedMCPWriteToolSendsNoRequestWithoutAHuman
  - apps/control-plane/internal/execution/mcp_write_approval_component_test.go:TestAToolPinnedTwiceRefusesRatherThanCoinFlippingTheGate
