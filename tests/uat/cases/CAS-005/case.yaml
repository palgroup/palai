id: CAS-005
name: the-agent-runs-the-hosts-own-tools-through-a-shell-call-and-the-missing-sandbox-is-declared
proof_class: component-real
provider: fake
input: "THE AGENT'S CAPABILITY IS THE CAPABILITY OF THE MACHINE IT RUNS ON, and this case is that sentence made mechanical (E22 T1/T2, plan §2). It rests on ONE measurement: `GOOS=darwin GOARCH=arm64 go build ./apps/control-plane/cmd/palai-control-plane` succeeds — 25,612,562 bytes, taken 2026-07-28 — and there is not one `//go:build linux` file under apps/control-plane or packages (§3.5 X18). So the shared assumption that a Mac is a machine SEPARATE from the control plane, and therefore needs a transport, was a compose habit rather than a requirement: what goes to the Mac is the STACK, not a protocol, and `xcodebuild`, `simctl` and `axe` are binaries on PATH. That single measurement deleted four planned tasks — a typed xcode-simulator capability, a worker transport, a dispatch tool and a two-account `sudo` measurement — and it is why Palai contains NOT ONE LINE about iOS. WHAT MAKES IT REAL IS A HOST SIBLING OF ONE INTERFACE: toolbroker.ShellRunner is Run(ctx, ShellCommand{Argv, WorkspaceRoot, ReadOnly, Shell}) (ShellResult, error) and the interface contains no container word (X19), so the host executor follows the OCI one's structure — bounded output, redactSecrets, TimedOut classification — and the SAME argv that answers `Xcode 26.6` through the tool ledger on the host answers `sh: xcodebuild: not found` in the runner container. THE ENVIRONMENT IS AN EXPLICIT FIVE-ENTRY ALLOW-LIST (PATH, HOME, TMPDIR, LANG, DEVELOPER_DIR) and everything else is DROPPED, and that is a harder claim natively than it ever was in a container: the container's environment was already empty, while a host process would inherit the OPERATOR'S — so it is proven by sweeping all of os.Environ rather than the names somebody remembered. THE ABSENCE OF THE SANDBOX IS DECLARED, NOT DISCOVERED. `PALAI_SHELL_NATIVE=unsandboxed-host` is the only accepted value — `=1`, `true` and `yes` are REFUSED, because deleting a security boundary must not be reachable by copy-paste and `ps` output has to say what the process is — it is MUTUALLY EXCLUSIVE with `PALAI_SANDBOX_IMAGE` (both set is fatal at boot, since a 'sometimes sandboxed' stack makes it unreadable which call ran where), and the posture cannot pretend to contain a write: a ReadOnly request is REFUSED rather than honoured, because a host executor has no read-only mount to honour it with. THE COST IS WRITTEN DOWN IN THE SAME BREATH AND IT IS THIS EPIC'S LARGEST: in this posture THERE IS NO SANDBOX — the boundary is the uid and nothing else — and `docs/research/macos-isolation-without-accounts.md` measured on this hardware, 23 measurements, that under one uid nothing weaker is a boundary at all: Apple's SUPPORTED App Sandbox was escaped with `simctl spawn`. The egress backstop goes with it (§3.5 X22): in the container the sandbox denied ALL network traffic and ClassifyEgress was merely the audit record, while on the host the finding still fires and a `curl` in an argv really leaves the machine — kept deliberately, so the audit trail does not get shorter when the enforcement does. There is no resource bound either; only wall time, and the kill reaches the whole PROCESS GROUP so a reaped `xcodebuild` leaves no compiler behind. SESSIONS ARE SEPARATE DIRECTORIES AND THAT IS ACCIDENT PREVENTION, NOT A BOUNDARY: every run gets its own HOME and TMPDIR under its allocation, two concurrent runs see disjoint directories and neither sees the other's files, and a run's session state never enters a workspace snapshot. The device-set half is WEAKER STILL and the ceiling is carried in a TEST NAME rather than a comment — `TestSimctlSetIsAdvisoryNotEnforced` — because X20 was measured and the answer was the inconvenient one: HOME does NOT select the CoreSimulator device set (a device created under a scratch HOME landed in the default set and left nothing behind; the set belongs to a launchd-managed per-user XPC service), so the mechanism is `simctl --set`, `--set` is an ARGV FLAG, and argv belongs to the model — the runner can OFFER a per-session set and can never REQUIRE one. The mitigation is an OPERATING RULE and it is the only one there is, printed at boot and stated verbatim in both operator pages: different customers -> different Macs (or different uids); same customer -> one Mac, per-session directories plus `simctl --set`. HONEST CEILINGS, four: (1) `axe` is THIRD-PARTY and rides Apple's PRIVATE accessibility and HID APIs, so an OS update can break it — nothing in Palai depends on it existing, which is why a break surfaces as an honest exit 127 rather than a silent no-op; (2) one Mac serves ONE Xcode, because CoreSimulatorService knows one active version and switching it kills booted simulators; (3) a run's progress cannot be watched — the shell tool returns a single ShellResult and a long build reports nothing until it ends; (4) X21's remaining half — a Mac with NOBODY logged in graphically — was not measured, because both Aqua-less contexts that could have tested it needed `sudo`. The deterministic legs here are the local seam; a REAL simulator driven by real argv and a REAL Xcode project built through the same tool are the credential/hardware-gated live legs (`make test-live-mac`), and §6 legs 2 and 3 — two concurrent driving sessions on one Mac, and the three unmeasured Slack questions — are operator work and are NEVER claimed here."
expect_status: accepted
