id: CON-005
name: a-gated-tool-call-is-decided-from-a-console-screen-and-a-call-whose-arguments-changed-authorizes-nothing
proof_class: e2e-deterministic
provider: fake
input: "A Slack-less deployment decides a gated tool call from a SCREEN, and the screen names what it does not show (E25 T5, CON-005). MEASURED FIRST AS THE ABSENCE OF A SCREEN: ten of this case's eleven browser legs failed on 'no such page' — `/approvals` answered 404 and the list panel never existed — while `GET /v1/approvals` was already returning five parked gated calls. That RED is the whole justification for the task and for its SIZE: E23 T9 had written the backend half (a list route, two decision routes, a new `approve` capability deliberately separate from `provision`, and a mandatory request hash at the edge), and the feature list that sized this work `L` was written four hours before that landed. What was missing was a page. WHAT IS PROVEN, driven by a real browser against the built console on the LOCAL deterministic seam (a loopback fake /v1 upstream) and re-run against a real compose control plane on the real profile: (1) a parked call renders the SERVER's screen and not a second one — the arguments are compared BYTE FOR BYTE against the canonical rendering `slack.DeriveApprovalDisplay` produces (keys sorted at every level by encoding/json, two-space indent, HTML escaping off), so a console that re-parsed and re-serialized would pass a 'contains the summary' assertion and fail this one; a missing operator label renders as `(no operator label)` verbatim and a missing deadline as a sentence rather than as 'Invalid Date'; a `truncated` block carries the server's own admission of the cut and says the hash binds to ALL the bytes and not to the part shown. (2) THE DECISION CARRIES THE HASH THE ROW DISPLAYED, read off the WIRE: the POST body's `request_hash` equals the text of the row's own hash element, an approve body carries that key AND NOTHING ELSE (`ApprovalDecision` decodes with `DisallowUnknownFields` and has no `approver` field — the principal is stamped server-side), no `input[type=hidden]` exists anywhere on the page, and every editable control on the screen is a per-row deny reason, enumerated and matched against the rows that actually rendered rather than against a hardcoded list. (3) A DECISION STRIPPED OF ITS BINDING AUTHORIZES NOTHING AND THE SCREEN SAYS WHICH REFUSAL IT WAS: the console's own POST is rewritten at the browser boundary to remove `request_hash`, the server refuses it at the edge (400), and the screen says the hash was missing and that nothing was authorized. The console deliberately does NOT pre-check an empty hash: a client-side guard would make that refusal unreachable and its rendering untested. (4) AN APPROVAL WHOSE ARGUMENTS CHANGED IS REFUSED, AND THE 409 IS MECHANICAL RATHER THAN CANNED: the fixture's drift row rotates its arguments and its hash on every serve, so whatever binding the page is holding is always the previous call; the refusal therefore comes from the one-shot binding genuinely failing, the row stays parked, and a re-read shows a hash that is not the one that was held. (5) FIVE TYPED REFUSALS GET FIVE DIFFERENT SENTENCES AND NONE IS 'something went wrong' — asserted as distinctness over the actual screen text (three end to end: a 404 whose sentence says unknown and foreign are indistinguishable on purpose, a 403 from the project's approver list, and the 409; the remaining two as a pure-function assertion over the exact `code` strings the API writes, because `insufficient_scope` is NOT drivable from a browser — the console holds one key for the life of its process and the same capability gates reading this queue and deciding on it). THE PLAN SAID THREE REFUSALS: it is five codes across four statuses, because 403 arrives from two independent gates with two stable codes and the operator's fix differs. (6) A DENY TAKES A REASON AND IT REACHES THE API VERBATIM — a colon, a quote and a newline all survive on the wire — and a deny with an EMPTY reason never leaves the browser, which is the console's own rule rather than the API's: this is `HIL-P10` (a Slack approver's typed deny reason reaches nothing and the model is handed a constant sentence) CLOSED on the HTTP surface, and a ceiling closed on one surface is a distinguishing property of that surface. (7) A PUBLICATION APPROVAL IS IN THE QUEUE, WITH THE REMOTE AND THE BRANCH THE WRITE IS GOING TO, AND THIS CLAIM USED TO SAY THE OPPOSITE. Until 2026-08-01 this leg asserted that a parked publication appeared NOWHERE in the queue and that the page said so in words — that it held tool approvals only, that publications were approved inside a live run's stream, and that an empty queue did not mean nothing was waiting. Every sentence of that was rendered, and the last one was TRUE FOR THE WRONG REASON: the queue was empty because GET /v1/approvals read PendingToolApprovals, and the stream the page redirected to could not decide a publication either — the console sent an operator to a screen whose button emitted `command.accepted.v1` and applied nothing, because the only drainer of that queue needs a live attempt and the approval park had just ended one. So the leg proved a signpost pointing at a dead end. The queue now LISTS a parked publication, carrying its remote, branch, base and head SHA so an operator can refuse a write to the wrong repository, and the decision route reaches it: a wrong request hash is refused at the edge with the approval left DECIDABLE rather than burned, and a correct one wakes the parked run to completion. The publication is no longer still parked afterwards, which is the whole point. (8) THE SCREEN SAYS WHOSE KEY THE DECISION IS RECORDED AGAINST — `key:<api_key_id>`, not a person, `HIL-P2` in its product-surface form — and names BOTH gates in front of it plus the fact that both are permissive when unset (`HIL-P11`); E25 changes that posture nowhere and `docs/operations/console.md` §4 writes the recipe for closing both. (9) THE QUEUE POLLS AND SAYS SO: the period is read off the DOM and the sentence is checked against it, so the prose cannot drift from the timer, and a second read of the list is then OBSERVED. (10) MODEL-AUTHORED ARGUMENTS ARE THE ONE PIECE OF UNTRUSTED PROSE ON THIS SCREEN — no MCP `description` is even on the wire here — and they stay TEXT: the fixture's own row carries `<img src=x onerror=…>`, no element is created from it, and the payload never executes on the console's origin. (11) NO CONSOLE SOURCE RENDERS RAW HTML, asserted by TOKENIZING every .tsx under app/ and components/ rather than by grepping: the identifier appears in this tree's own comments promising its absence, so a text scan would fail on the prose — the T4 defeat, arriving for the sixth time in this repo's history of substring comparisons. The scan is proven on synthetic input first (a source that USES the prop is found; one that only mentions it in a comment and a string is not) and every file's bracket balance must come out at zero, because a swallowed region is where an occurrence would hide. EACH ABSENCE WAS SHOWN TO BITE: a planted `dangerouslySetInnerHTML` was NAMED by the token scan and, on the same build, created an img element and set the payload's flag to true; a planted hidden field was counted; a publication-shaped row planted into the tool queue was named by the scope assertion. HONEST CEILINGS, FIRST BECAUSE THEY BOUND EVERY LINE ABOVE: (a) AN APPROVAL IS A KEY, NOT A PERSON — every decision from this console is recorded against the console's own API key, everyone who holds the console password decides as that key, and 'two humans approved' is not expressible on this platform (`HIL-P2`); (b) NO CONSOLE PROFILE CAN SHOW A RUN WAKING UP, and the console claims it nowhere: a tool approval is created only when a gated tool call PARKS, no /v1 route parks one, and a compose run reaches no tool call at all (the fake adapter is hardcoded with no ToolCalls and no env knob), so the release of the parked run is proven against a REAL store at the component tier (`apps/control-plane/internal/execution/http_tool_approval_component_test.go`, nine tests) and the browser's claim ends at the decision reaching the single throat with the row's own binding — recorded as DIV-UI-006 and re-derived by the conformance sweep from a real run on every sweep; (c) FOR THE SAME REASON THE SWEEP'S `itemsCompared` FLOOR DID NOT RISE for this task, and the reason is written at the assertion rather than left as a silent number: the approvals ENVELOPE is compared on both sides ({data, has_more}) but its ITEM shape cannot be, because the real side cannot be seeded; (d) in an unconfigured deployment ANY TENANT KEY CAN APPROVE (`HIL-P11`) and E25 does not change that — changing it is a behaviour change nobody asked for; (e) THERE IS NO PUSH NOTIFICATION: the queue polls, so an approval arriving while the browser is closed is visible when it opens, which is a definite improvement on 'only inside a live stream', and an SSE surface is a separate decision; (f) THE SCREEN INHERITS A SLACK-SHAPED ESCAPE — `<!` and `<@` arrive as `&lt;!` and `&lt;@` because both surfaces share the ONE derivation — and the console shows what it was given rather than repairing it, which is the measured price of 'render the screen the server computed'; (g) the three canned refusals (404 and the two 403 codes) are SYNTHESIS, named as such in the fixture, because the real API keys them to an id and to a principal while the console's key is fixed for the life of its process. NOT COVERED, and it is a §6 operator leg rather than a gap in this case: no DEPLOYED console, no manual screen-reader pass, and no real browser other than Chromium — what is proven is 'axe-clean with the WCAG 2.0+2.1+2.2 tags' and never 'accessible'. No tier advances on this case and `console` stays preview."
expect_status: completed
proof:
  - "apps/web-console/tests/approval-queue.spec.ts:the approval queue shows a parked gated tool call with the server's own arguments, verbatim"
  - "apps/web-console/tests/approval-queue.spec.ts:the decision carries the request hash the row displayed, and nothing on the page asks for one"
  - "apps/web-console/tests/approval-queue.spec.ts:a decision stripped of its request hash authorizes nothing and the screen says the hash was missing"
  - "apps/web-console/tests/approval-queue.spec.ts:an approval whose arguments changed is refused as no-longer-decidable, and the screen says which refusal it was"
  - "apps/web-console/tests/approval-queue.spec.ts:the typed refusals get different sentences and none of them is a generic failure"
  - "apps/web-console/tests/approval-queue.spec.ts:a deny sends the operator's own reason verbatim, and a deny with no reason never leaves the browser"
  - "apps/web-console/tests/approval-queue.spec.ts:a publication approval is IN the queue, with the remote and branch the write is going to"
  - "apps/web-console/tests/approval-queue.spec.ts:the queue names the key a decision is recorded against, and the two gates in front of it"
  - "apps/web-console/tests/approval-queue.spec.ts:the queue renders on both profiles, states its polling period, and re-reads the list on that period"
  - "apps/web-console/tests/approval-queue.spec.ts:the model-authored arguments render as text and the payload never executes"
  - "apps/web-console/tests/approval-queue.spec.ts:no console source renders untrusted bytes as markup — the forbidden prop is in no token stream"
  - "apps/web-console/tests/unit.spec.ts:the approval queue gives every typed refusal its own sentence, and none of them is a generic failure"
  - "apps/web-console/tests/a11y.spec.ts:every route lib/routes.ts declares was actually scanned by axe"
