id: FLC-003
name: a-fleet-screen-that-shows-the-machine-waiting-keeps-two-pointers-unflattened-and-names-the-three-things-it-does-not-cover
proof_class: e2e-deterministic
provider: fake
input: "A MACHINE ENROLLED INTO A STRICT POOL, SAT `pending`, AND NO CONSOLE SCREEN SHOWED IT — THIS CASE IS THAT CLOSED, AND THE HOLE WAS TWO EPICS WIDE (E28 T3, FLC-003). E24 T6 shipped the waiting room's door, `POST /v1/runners/{runner_id}/approve`, correctly gated on `approve` rather than `provision`; E28 T1 then found that the state it decides could not be PRODUCED, because a pool could not be created. T3 is the half where the state can be SEEN. Measured before anything was written: `grep -rc \"runner-pools|/v1/runners|runner_pool\" apps/web-console/{app,lib,components}` answered 0 in every file, and `page.goto(\"/fleet\")` 404'd — fifteen legs failed on `getByTestId(\"panel-runner-pools\")` finding nothing. The reason the surface fell between two epics is recorded rather than guessed: E24's out-of-scope line handed the screens to E25 as free once console auth landed, and E25's plan was written before E24 existed, so neither plan carried the other's row. THE PAGE IS FOUR SECTIONS IN THE ORDER AN OPERATOR ACQUIRES THEM — a pool exists, a key admits machines into it, machines are in it, and one is asking to be let in — and each is driven by a real browser against the built console, under BOTH colour schemes, with the relay's public-API-only posture untouched. A pool is created from the screen with a posture and a waiting room and read back over the public API; an existing pool is switched strict from its own row, which is E28 T1's second route reaching a caller. AN ENROLMENT KEY IS SHOWN ONCE AND IS FINDABLE NOWHERE AFTERWARDS: minted from the screen, its value is asserted absent from the metadata listing the same pool answers and from the whole document after a reload — the browser mirroring `poolKeyView(item, true)`, which the mint route uses and no other call site does. REVOKING THAT KEY COUNTS THE MACHINES IT ALREADY ADMITTED AND NAMES THEM, because `api/runners.go` calls the field `enrolled_runners_still_running` rather than `enrolled_runners`, and an operator shown a bare 'revoked' reads it as 'removed' and believes one call decommissioned a fleet. TWO POINTERS REACH THE SCREEN UNFLATTENED, AND BOTH DECIDE AN ACTION. A pool's `waiting` and a machine's `active_leases` are `*int64` on the wire and the JSON key is ABSENT when the gateway could not be asked; zero means the pool is keeping up and the Mac can be unplugged. The screen renders three distinct answers — a number, a zero, and a sentence saying nobody could ask — and never a zero for the third. A THIRD SHAPE WAS MEASURED ON THE RUNNING STACK AND THE FIXTURE CORRECTED TO IT: `POST /v1/runner-pools` and `PATCH /v1/runner-pools/{pool_id}` answer WITHOUT `waiting`, because only `ListRunnerPools` decorates its items with the live gateway — the renderer is shared, the decorated field is not, so T1's one-projection rule holds for the function and not for the key set. Nothing on the screen depended on it; a fixture that echoed the stored row would have taught a create response the real one does not send. THE ABSENT-KEY STATE IS REACHED BY REWRITING THE RESPONSE AT THE BROWSER BOUNDARY RATHER THAN BY A FIXTURE ROW, and that is a measurement rather than a convenience: `internal/fleet/api.go` sets both pointers in loops guarded by `a.live == nil`, so the live gateway is a DEPLOYMENT-level fact and one pool carrying the key while its sibling does not is a wire neither stack can send. Those are the same bytes a listener-less stack sends, so that leg runs on both profiles. CORDON AND REVOKE TAKE DIFFERENT CONFIRMATIONS AND THE DIFFERENCE IS A PUBLISHED CRITERION. WCAG 2.2 SC 3.3.4 is satisfied by any ONE of three legs; a cordon satisfies Reversible verbatim — resume undoes it — so it stays on `window.confirm`, keeping keyboard operation, screen-reader announcement and a focus trap the browser gives for free, and a spec counts the native dialog so converting it is a red test rather than a review question. A revoke cannot satisfy that leg — 'a revoked runner identity is decommissioned, not paused' — so it takes `ConfirmDestructive`, and the word 'reviewing' inside the Confirmed leg is a REQUIREMENT. THE RED FOR THAT ONE ASSERTS A NETWORK CALL AND NOT A RENDERED SENTENCE, which is the whole point: `ActiveLeases` is on the single read and not on the listing, because it is a live value and 'a page of them would be a page of separate instants presented as one', so a dialog that rendered a plausible number out of the list row would satisfy every text assertion and review nothing. The spec watches for `GET /v1/runners/{runner_id}`, asserts none was made before the click, and asserts the dialog cannot appear without one; the page opens the dialog from the ANSWER, and a failed read opens no dialog and says the machine could not be read. THE WAITING ROOM IS HERE AND NOT ON `/approvals`, AND THE TWO SCREENS NAME EACH OTHER WHILE THE OTHER'S CONDITION IS ACTUALLY PRESENT. The server's own reason is on the screen: a machine enrolment has NO REQUEST HASH TO BIND TO, and the approval decision route requires one. Proven in both directions rather than asserted: a parked gated call's id is read off its own row on `/approvals` — with its request hash, so the absence is measured against something that exists — and the fleet page is then asserted to carry neither; and a machine is on screen `pending` before the approval queue is asserted not to hold it. Each page links to the other. THREE REFUSALS OF AN ADMISSION GET THREE SENTENCES AND NONE IS A GENERIC FAILURE: 403 `insufficient_scope` (the key has no `approve` capability, deliberately not covered by `provision` because a key that could provision could add itself to the list it is about to be checked against), 403 `approver_not_authorized` (the key is not in the project's approver list, with a link to `/policy`), and 404 (no such machine is waiting — and the screen says its three causes are INDISTINGUISHABLE on purpose). The two 403s have different fixes and flattening them costs an afternoon. THERE IS NO HEALTH COLUMN AND THAT IS DELIBERATE: `last_seen_at` records the last time a machine AUTHENTICATED, nothing polls it and nothing expires a row, so a stale stamp means 'has not authenticated since' and NOT 'is down'. The API carries no `healthy` field, the page renders no badge derived from the stamp, and a sweep of the rendered page asserts the words 'healthy', 'online' and 'offline' appear nowhere. THE PAGE WRITES THREE CEILINGS AND A TEST FAILS IF ONE IS DELETED. `FLT-P15` stays open above every panel — a machine runs a run's ENGINE and every tool still runs in the control plane's own process, so a Mac does not run `xcodebuild` unless the control plane is on it — because it bounds what the rest of the screen is worth. `FLT-P4`/`FLT-P12` says that with enrolment open the pool key IS the admission control, since nothing attests what an enrolling host is. And the concurrency ceiling is shown on the machine count with the half it could not check NAMED: `PALAI_DISPATCH_WORKERS` is read by the control-plane process and published on no `/v1` route, so a browser cannot check it and the screen says so rather than implying a measurement nobody took. AND THE CONTRAST SWEEP FOUND `button.danger` FAILING SC 1.4.11 AT 1.55:1, shipped in E28 T2 and never measured because its only caller was inside a dialog the route sweep walks past CLOSED; the fleet screen puts one in a table row and it failed on the first run. It now draws its boundary at a token of its own, measured at 3.82:1 light and 4.82:1 dark with the same formula the sweep uses. HONEST CEILINGS, FOUR. FIRST AND BOUNDING EVERYTHING: this screen does not make the fleet run anything — `FLT-P15` is open and this page writes it rather than closing it. SECOND, AND IT IS A LEDGER ROW THIS TASK WROTE WRONG AND THE SWEEP CORRECTED: the first draft of `DIV-UI-009` said a compose stack enrols NO machines and cannot be made to, reasoning from the runner plane being a separate mTLS listener a host agent dials. It is false on this tree — `deploy/compose/compose.yaml` starts a `runner` SERVICE and `palai local up` mints it a token — and the sweep's own staleness arm refused the row until it was re-derived, at which point the real stack answered ONE machine, `runner-local`, `active`, in `pool_default`. `GET /v1/runners` is therefore COMPARED by the sweep and its item floor rose to sixteen rather than fourteen; the same run also showed that `GET /v1/runner-pools` had been comparable all along, so the enumeration the floor's comment carried was stale by one before this task added anything. What is genuinely unreachable on a real profile is four things and only those four skip: a SECOND machine (compose runs one), a `pending` one (the only pool is not strict when the runner enrols, and taking a pool strict does not re-ask about what is already in it), the two 403 admissions (one key holding every capability against an unconfigured and therefore permissive approver list), and a NON-ZERO live count. Eleven of this file's nineteen legs run on the real profile — including the machine table with a real row, the cordon confirmation, the revoke dialog's single-read NETWORK assertion, and both renderings of each pointer — and the machine ids they act on are read off the rendered list rather than pinned, because a real stack's runner id is a fresh hash. THIRD, `FLC-P3`: the console polls nothing here, so a Mac that boots at 03:00 into a strict pool waits until somebody opens this page. FOURTH, `FLC-P7`: the concurrency notice fires on half of `palai up`'s condition and says which half. NOT COVERED and a §6 operator leg rather than a gap: no DEPLOYED console, no manual screen-reader pass, and no browser other than Chromium — what is proven is 'axe-clean with the WCAG 2.0+2.1+2.2 tags' and never 'accessible'. NO TIER ADVANCES ON THIS CASE and `console` stays preview: a screen that manages a fleet is not evidence about what that fleet can execute."
expect_status: completed
proof:
  - "apps/web-console/tests/fleet.spec.ts:a machine waiting in a strict pool is on this page and is admitted from it"
  - "apps/web-console/tests/fleet.spec.ts:a pool is created from the console with the posture it was given"
  - "apps/web-console/tests/fleet.spec.ts:an existing pool's waiting room is switched on from the console"
  - "apps/web-console/tests/fleet.spec.ts:a pool's queue depth is rendered as the number it is, and zero is one of the numbers"
  - "apps/web-console/tests/fleet.spec.ts:a pool with runs queued renders the count the gateway gave it"
  - "apps/web-console/tests/fleet.spec.ts:a deployment whose gateway could not be asked renders no queue depth rather than a zero"
  - "apps/web-console/tests/fleet.spec.ts:a pool key is shown once, and nothing reads it back"
  - "apps/web-console/tests/fleet.spec.ts:revoking a pool key shows the machines it already admitted and does not stop"
  - "apps/web-console/tests/fleet.spec.ts:last_seen_at says what it means, and no machine carries a health badge"
  - "apps/web-console/tests/fleet.spec.ts:cordon goes through the native confirmation and revoke does not"
  - "apps/web-console/tests/fleet.spec.ts:the revoke dialog cannot open without the single read that carries the lease count"
  - "apps/web-console/tests/fleet.spec.ts:the review names the machine's label and the count the gateway gave for it"
  - "apps/web-console/tests/fleet.spec.ts:a machine whose lease count could not be read says so rather than showing a zero"
  - "apps/web-console/tests/fleet.spec.ts:a machine serving nothing says zero, which is a different answer from 'nobody asked'"
  - "apps/web-console/tests/fleet.spec.ts:a parked tool call is not on /fleet, and /fleet says which queue holds it"
  - "apps/web-console/tests/fleet.spec.ts:a pending machine is not on /approvals, and /approvals says which screen holds it"
  - "apps/web-console/tests/fleet.spec.ts:the three refusals of an admission get three sentences and none of them is a generic failure"
  - "apps/web-console/tests/fleet.spec.ts:the page writes the three things a fleet screen must not let an operator assume"
  - "apps/web-console/tests/fleet.spec.ts:the concurrency ceiling appears on the machine count and names the half it cannot check"
  - "apps/web-console/tests/contrast.spec.ts:every interactive control carries a 3:1 boundary against the surface behind it (SC 1.4.11)"
  - "apps/web-console/tests/rendered-copy.spec.ts:no rendered sentence has a space the JSX transform ate"
  - "apps/web-console/tests/a11y.spec.ts:every route lib/routes.ts declares was actually scanned by axe"
