id: BGT-001
name: a-process-belongs-to-the-run-not-to-the-call-that-started-it-and-a-pgid-we-cannot-prove-is-ours-is-never-signalled
proof_class: component-real
provider: fake
input: "PARKING WAS NEVER THE HARD PART; PROCESS OWNERSHIP WAS, AND UNTIL THIS CASE A BACKGROUND TASK WAS NOT A MISSING FEATURE BUT A CONTRADICTION. Ownership was bound to the `ShellRunner.Run` CALL in both postures and for two entirely different reasons, and both were measured before a line was written. The OCI driver force-removes its container on a `defer` — `ContainerRemove(Force:true, RemoveVolumes:true)`, unconditional, on the error path too — so a container's life is the life of the call; `TestTodayAShellContainerIsGoneWhenTheCallReturns` starts a real container through the shipped driver, watches the daemon list it while `Run` is executing, and finds it REMOVED the moment `Run` returns. The host executor uses `exec.CommandContext` with `Cancel = kill(-pgid, SIGKILL)` and `WaitDelay = 2s`, so the attempt's context owns the whole process GROUP; `TestTodayAHostProcessGroupDiesWithTheAttempt` starts a real shell, reads the pgid the shell itself wrote, confirms `kill(-pgid, 0)` succeeds mid-run, cancels the context, and finds the group gone. And a parked attempt LEAVES that call — which is why 'park the run and keep the build going' could not be built on top of it, in either posture, for either reason. BOTH MEASUREMENTS STAY IN THE SUITE, because the synchronous posture must keep doing exactly what they describe. WHAT CHANGED IS ONE LINE PER POSTURE AND NOTHING ELSE. On the host: `exec.CommandContext` becomes `exec.Command`, `Setpgid` stays, the log file becomes stdout and stderr, and a watcher goroutine calls `Wait` so no zombie is left — but THE WATCHER IS NOT THE AUTHORITY, the probe is, because a watcher does not survive the restart that the process and the row both do. In the container: a THIRD entry point, `StartDetached`, beside the batch and interactive ones, with no deferred removal and an `io.palai.bg=<task_id>` label. It is a separate method rather than a flag on `Run` because a conditional version of that defer is a lifetime somebody gets backwards exactly once, and `dockerDriver.Run` therefore does not change BY ONE BYTE — pinned by the sha256 of its exact source bytes against a committed word, because a guard that recomputes its own baseline passes over the regression it exists to catch. THE HARDENING IS PROVEN IDENTICAL STRUCTURALLY RATHER THAN BY READING IT: a go/ast guard asserts that `StartDetached` hands `ContainerCreate` the result of `createOptions(spec, false)` and constructs nothing of its own, and that it contains no `defer` at all — so the unprivileged uid, the denied network, the read-only rootfs, the dropped capabilities, no-new-privileges and the cgroup bounds cannot DIVERGE, which is a stronger claim than their currently matching. The container writes its own log through `sh -c 'exec \"$@\" >\"$0\" 2>&1' <logpath> <argv...>`, which passes the command as POSITIONAL PARAMETERS: a semicolon, a redirect, a `$(...)` and an `&&` inside one argument all arrive as characters in that argument, and the test that proves it also proves no marker file was created. `docker logs` is deliberately NOT a second read path — Docker's own documentation says the default driver caches logs as unrotated JSON, and two read paths would mean two redaction paths of which only one gets maintained. THE OUTPUT GOES WHERE THE TREE ALREADY EXCLUDES IT: `.palai-session/bg/<task_id>.log`, a subtree `Snapshot` skips whole, created at spawn in BOTH postures because nothing else creates it — `workspace.Prepare` makes repo/scratch/artifacts and the host executor makes home/tmp/simulators. THE SHARPEST ASSERTION HERE IS AN ABSENCE. PID numbers are reused, so a row that survived a restart names a pgid that may now belong to anything on the machine, and the only evidence that it is still ours is the start time recorded beside it. When that evidence does not match, the handle is `lost` and `Kill` sends NO SIGNAL AT ALL — not a best-effort one, not a SIGTERM instead of a SIGKILL — and the measurement is a REAL process started outside this program, a fabricated start time, and that process still running afterwards. The container posture enforces the identical rule with the evidence it has: a container carrying no `io.palai.bg` label is `lost`, is refused, and is found still running afterwards. HONEST CEILING, AND IT IS ALSO THE DESIGN RULE: PID reuse cannot be fully solved in the host posture. The start-time comparison has one-second resolution and is best-effort; two processes born in the same second at the same pid would compare equal. That leaves us the ORPHAN — a process of ours that finishes its work with nobody to reap it — and that trade is deliberate, because not killing a stranger's process matters more than reaping our own. Migration 000047 is the epic's ONLY migration and one task owns it, so 'two parallel tasks both took the next number' cannot happen here; `exit_code` is NULL until known and never a sentinel, `posture` carries a CHECK because the probe looks at a different operating-system object per posture, and `deadline_at` is a column rather than a `context` because a context does not survive the restart a background process is built to survive. WHAT IS NOT CLAIMED: no tool exposes any of this yet (T2), no run parks on it (T3), nothing wakes on an exit (T4), and no reaper reads `deadline_at` (T5) — so a control-plane restart today leaves running background tasks with nobody probing them. NO TIER ADVANCES, and the reason is a rule: making a tool asynchronous is not evidence about the plane that tool runs on. EVERY PROOF HERE IS component-real ON THIS MACHINE: a real Docker daemon, real host processes, and liveness read from the KERNEL (kill(-pgid, 0) against a pgid the process itself wrote down) rather than from anything we returned. §6 OPERATOR LEGS THIS CASE DOES NOT COVER: leg 1, a real xcodebuild backgrounded on a real Mac with its duration written down as a number; and leg 4, whether pgid reuse actually occurs fast enough on a Mac for the start-time comparison to matter in practice — the ceiling above is reasoned from the mechanism, and only an operator can measure the rate."
