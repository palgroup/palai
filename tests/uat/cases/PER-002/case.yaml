id: PER-002
name: cold-and-warm-sandbox-phase-budgets-are-measured-on-the-real-allocation-chain-and-a-slow-engine-fixture-fails-the-gate
proof_class: component-real
provider: fake
input: "PER-002 measures the §54.3 assignment-to-engine-ready chain PHASE BY PHASE with nothing simulated: workspace_create (coordinator.CreateWorkspace, the E09 §29.7 logical row), workspace_allocate (physical allocation + fencing token), lease_acquire (the §29.8 single-writer lease), engine_ready (runner.StreamSupervisor against a REAL OCI container with the REAL §25.6 handshake, timestamped when engine.ready reaches the sink) and assign_to_ready, their sum. Warm and cold are recorded as SEPARATE metrics because §54.3 budgets them separately (warm p95 < 10s, cold < 90s). THE GATE MECHANIC IS THE DELIVERABLE and it is RED-proven: the same chain with a deliberately slow engine fixture FAILS the phase budget (TestPER002SlowEngineFixtureFailsThePhaseBudget), so a green run means the budget held rather than that the gate was asleep. Percentiles come from raw samples.jsonl by the documented nearest-rank method and the mandatory profile stamp gates the whole run — no profile, no artifact. LOCAL SEAM: real PostgreSQL, the real OCI driver on Docker Desktop, and the DETERMINISTIC fixture engine (E08 rule: no tools to a real provider), so this measures allocation + container start + handshake and never model work. HONEST NAMING, STATED IN THE ARTIFACT ITSELF: 'COLD' HERE IS A POSITION, NOT A TEMPERATURE — it is the first attempt in this process, and nothing around it is cold (the fixture image was just built locally, Postgres is already migrated, and the OCI driver is constructed before attempt 1). On this profile the 'cold' attempt is routinely the FASTEST of the run, its p95 is a SINGLE observation, and §54.3's cold-start budget is therefore NOT established here. The number also excludes image pull, which is §54.3's own carve-out and is said out loud rather than implied. Attempts run one at a time, so NO capacity or saturation behaviour is measured or claimed. §6 operator legs: a real cold-host / cold-daemon measurement and any published number on reference hardware are E18 §6 operator leg 3; nothing in this case carries an SLO (`no_slo_claim` and `reference_hardware: false` are stamped into the summary)."
expect_status: completed
proof:
  - tests/performance/per002_sandbox_test.go:TestPER002ColdWarmSandboxPhases
  - tests/performance/per002_sandbox_test.go:TestPER002SlowEngineFixtureFailsThePhaseBudget
  - tests/performance/harness_test.go:TestHarnessWritesNothingWithoutAProfile
  - tests/performance/harness_test.go:TestHarnessPercentilesRecomputeFromTheRawSamples
# ceiling: run with `make test-performance TEST=sandbox`. Docker-bound, so NOT in `make verify`.
