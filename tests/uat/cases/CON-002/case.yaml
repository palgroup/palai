id: CON-002
name: list-truncation-is-visible-every-page-is-scanned-and-five-ledger-rows-were-wrong
proof_class: e2e-deterministic
provider: fake
input: "List truncation is visible, every declared page is scanned, and five ledger rows the console's own evidence rested on were false (E25 T2, CON-002). MEASURED FIRST, AS THE DEFECT: components/Panel.tsx read `body.data` with `has_more` ABSENT FROM ITS TYPE while apps/control-plane/api/pagination.go's defaultPageLimit is 20, so every list this console renders — organizations, projects, api-keys, model connections, model routes, secret refs, knowledge bases, agents, and after E23 T9 the tool-approval queue — showed at most twenty rows and said nothing about the rest. Driven on the LOCAL seam of the built console by a real browser against a deterministic /v1 upstream serving a TWENTY-ONE row collection, the pre-fix run rendered twenty rows and no truncation notice anywhere on the page: the twenty-first row did not appear to exist. WHAT IS PROVEN NOW: (1) the same collection renders twenty rows, states the truncation IN TEXT rather than in a colour or a disabled arrow, and a continuation control fetches the twenty-first using the SERVER's own cursor — asserted on the wire as exactly one `?after=` request carrying the cursor the upstream minted, because a real cursor is an HMAC'd keyset position bound to the tenant and a client-computed offset is refused as foreign; (2) NO list renders a backward control and no request ever carries `?before=`, on both profiles, because beginList answers `?before=` with a 400 and renderPage never populates `previous_cursor` — an absence asserted rather than assumed; (3) the routes axe scans are DERIVED from apps/web-console/lib/routes.ts, which is also what app/layout.tsx builds its navigation from: one scan is generated per declared route, so adding a route raises this suite's test count, and a coverage assertion declared last fails naming any declared route that went unscanned — demonstrated by shortening the generating loop and observing the named failure. An unscanned page is structurally impossible rather than a review question, which matters because E25 adds seven pages and Playwright's automatic collection covers new SPECS, never new PAGES; (4) the axe tag set now carries wcag21a/wcag21aa/wcag22aa alongside wcag2a/wcag2aa at every scan site — and the widening's EFFECT is measured rather than claimed: it adds exactly three axe rules (autocomplete-valid, avoid-inline-spacing, target-size) and `wcag21a` adds NONE, because no axe-core 4.12 rule carries that tag, so a tag that silently selects nothing cannot masquerade as coverage; (5) the widened scan found ZERO violations on the admin surface, the live-run surface after a completed run and the login form, which was NOT the expected outcome and is reported as measured; (6) form discipline exists once, in components/ResourceForm.tsx — programmatic label, role=alert error region, status in text, every control keyboard-reachable — and its first caller is the login form, so the specs that already proved those four properties are what verify it. FIVE DIVERGENCE-LEDGER ROWS WERE REPAIRED RATHER THAN DELETED: DIV-SHP-004 and DIV-SHP-005 measured the envelope difference correctly but concluded too much — renderPage genuinely mints `next_cursor` when `has_more` is true, and only `previous_cursor` is structurally absent; DIV-RTE-001 claimed compose configures no secret master key, which deploy/compose/compose.yaml:116 does; DIV-RTE-002 and DIV-RTE-003 claimed compose never passes PALAI_S3_ENDPOINT, which compose.yaml:77-78 does. DIV-UI-003's stale second reason was removed and the row stands on its first. HONEST CEILING: what is proven is `axe-clean with the WCAG 2.0+2.1+2.2 tags`, NEVER `accessible` — axe's own published figure is 57% of WCAG issues on average, no scanner judges whether an error message MEANS anything, and a manual screen-reader pass over a DEPLOYED console remains §6 operator leg 1. SECOND CEILING: the five repaired rows are NOT repaired until re-measured against a real stack, which needs RUN_CONSOLE_REAL=1 and a compose control plane (§6 leg 2) — the same measurement whose absence let two of them sit false for months; the three route rows are EXPECTED to close there, and the sweep's staleness arm is what will say so. THIRD CEILING: a collection larger than one page is fixture-only (DIV-UI-005) because a bootstrap stack holds no such collection, and the sweep re-derives that rather than taking the skip's word for it. No tier advances on this case."
expect_status: completed
proof:
  - "apps/web-console/tests/pagination.spec.ts:a collection larger than one page shows 20 rows, SAYS more exist, and continues with ?after="
  - "apps/web-console/tests/pagination.spec.ts:no list renders a 'previous' control — backward pagination is refused by the API, so it is not offered"
  - "apps/web-console/tests/a11y.spec.ts:every route lib/routes.ts declares was actually scanned by axe"
  - "apps/web-console/tests/a11y.spec.ts:the WCAG 2.1/2.2 tags genuinely select rules the 2.0 tags do not"
  - "apps/web-console/tests/a11y.spec.ts:axe-core reports zero violations on the admin surface"
  - "apps/web-console/tests/a11y.spec.ts:axe-core reports zero violations on the live-run surface after a completed run"
  - "apps/web-console/tests/a11y.spec.ts:keyboard navigation: skip link is the first stop and the run→approve flow works with no mouse"
  - "apps/web-console/tests/auth.spec.ts:the login page is axe-clean and operable with the keyboard alone"
