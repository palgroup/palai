id: CON-002
name: list-truncation-is-visible-every-page-is-scanned-and-five-ledger-rows-were-wrong
proof_class: e2e-deterministic
provider: fake
input: "List truncation is visible, every declared page is scanned, and five ledger rows the console's own evidence rested on were false — three of them CLOSED, measured against a real stack (E25 T2, CON-002). MEASURED FIRST, AS THE DEFECT: components/Panel.tsx read `body.data` with `has_more` ABSENT FROM ITS TYPE while apps/control-plane/api/pagination.go's defaultPageLimit is 20, so every list this console renders — organizations, projects, api-keys, model connections, model routes, secret refs, knowledge bases, agents, and after E23 T9 the tool-approval queue — showed at most twenty rows and said nothing about the rest. Driven on the LOCAL seam of the built console by a real browser against a deterministic /v1 upstream serving a TWENTY-ONE row collection, the pre-fix run rendered twenty rows and no truncation notice anywhere on the page: the twenty-first row did not appear to exist. WHAT IS PROVEN NOW: (1) the same collection renders twenty rows, states the truncation IN TEXT rather than in a colour or a disabled arrow, and a continuation control fetches the twenty-first using the SERVER's own cursor — asserted on the wire as exactly one `?after=` request carrying the cursor the upstream minted, because a real cursor is an HMAC'd keyset position bound to the tenant and a client-computed offset is refused as foreign; (2) NO list renders a backward control and no request ever carries `?before=`, on both profiles, because beginList answers `?before=` with a 400 and renderPage never populates `previous_cursor` — an absence asserted rather than assumed; (3) the routes axe scans are DERIVED from apps/web-console/lib/routes.ts, which is also what app/layout.tsx builds its navigation from: one scan is generated per declared route, so adding a route raises this suite's test count, and a coverage assertion declared last fails naming any declared route that went unscanned — demonstrated by shortening the generating loop and observing the named failure. An unscanned page is structurally impossible rather than a review question, which matters because E25 adds seven pages and Playwright's automatic collection covers new SPECS, never new PAGES; (4) the axe tag set now carries wcag21a/wcag21aa/wcag22aa alongside wcag2a/wcag2aa at every scan site — and the widening's EFFECT is measured rather than claimed: it adds exactly three axe rules (autocomplete-valid, avoid-inline-spacing, target-size) and `wcag21a` adds NONE, because no axe-core 4.12 rule carries that tag, so a tag that silently selects nothing cannot masquerade as coverage; (5) the widened scan found ZERO violations on the admin surface, the live-run surface after a completed run and the login form, which was NOT the expected outcome and is reported as measured; (6) form discipline exists once, in components/ResourceForm.tsx — programmatic label, role=alert error region, status in text, every control keyboard-reachable — and its first caller is the login form, so the specs that already proved those four properties are what verify it. FIVE DIVERGENCE-LEDGER ROWS WERE WRONG, AND THE DISPOSITION OF EACH WAS MEASURED RATHER THAN REASONED. TWO WERE REPAIRED: DIV-SHP-004 and DIV-SHP-005 measured the envelope difference correctly but concluded too much — renderPage genuinely mints `next_cursor` when `has_more` is true, and only `previous_cursor` is structurally absent, which is why the console pages forward and offers no backward control. THREE WERE CLOSED, ON A RUNNING COMPOSE STACK: DIV-RTE-001 claimed compose configures no secret master key (compose.yaml:116 passes it) and DIV-RTE-002/003 claimed compose never passes PALAI_S3_ENDPOINT (compose.yaml:77-78 pass it and the bucket). Rather than delete three measurements on the strength of reading a compose file, a real four-service stack was brought up from the packaged CLI with no image build and probed exactly the way the conformance sweep's route arm probes: OPTIONS /v1/secret-refs answered 405 with `Allow: GET, HEAD, POST`, and both artifact routes answered 405 with `Allow: GET, HEAD` — an Allow header means the PATTERN is registered, where an unregistered pattern answers a bare 404. The sweep's staleness arm then named those three rows and no others, so the divergence is closed and this ledger's own rule for a closed row is to delete it; the CONDITIONAL mounting they recorded is preserved in the ledger's route section, because a deployment that configures neither key nor object store still serves neither family. The whole sweep is green against that stack (10/10), which is also what proves the seeded item-shape floor of four and the corrected knowledge-base fixture row. DIV-UI-003's stale second reason — that the artifact route is not even mounted — was measured false and removed; the row stands on its first reason, which always blocked on its own. TWO STALE COMMENTS carrying the same false claim were repaired in tests/public-api-only.spec.ts and tests/artifact-download-hardening.spec.ts, and the first now asserts what a real stack ACTUALLY shows: the secret-refs panel's honest EMPTY state, which is the surface T4's secret form writes into. HONEST CEILING: what is proven is `axe-clean with the WCAG 2.0+2.1+2.2 tags`, NEVER `accessible` — axe's own published figure is 57% of WCAG issues on average, no scanner judges whether an error message MEANS anything, and a manual screen-reader pass over a DEPLOYED console remains §6 operator leg 1. SECOND CEILING, AND IT MOVED: the ledger repair WAS re-measured — the sweep and the console's REAL-upstream profile both ran against a running compose control plane in this task, which is the §6 leg 2 measurement whose absence let two rows sit false for months. What that leg still does not cover: the stack was brought up from LOCALLY BUILT images (no Palai image has ever been published), it is compose rather than a DEPLOYMENT, and the sweep is still not run by any routine gate — so the rows can rot again between now and the next run. THIRD CEILING: a collection larger than one page is fixture-only (DIV-UI-005) because a bootstrap stack holds no such collection, and the sweep re-derives that rather than taking the skip's word for it. E25 T8 EXTENDS THIS CASE RATHER THAN OPENING AN ID, because the observability half is a READ surface and this case is already the home of `every declared page is scanned` and `a list never misrepresents what it holds`. Three routes were declared — /history, /usage and /capabilities — carrying six screens (feature list §7 O1/O2/O4/O5/O6/O9), and the axe half needed NO new proof reference, which is the T2 design working: the scan loop and the coverage assertion are generated from apps/web-console/lib/routes.ts, so three new rows produced three new scans and a coverage assertion over ten routes without a line of test code being written or a proof leg being retyped. What DID need a new leg is the read-surface counterpart of visible truncation: a Panel holding zero rows must state that in a SENTENCE rather than render a blank region, which is asserted over four metering panels (GET /v1/usage, /v1/usage/ledger, /v1/budgets, /v1/quotas) on BOTH profiles, with each panel required to be in exactly one of its two legitimate states and its loading state asserted absent first — a spinner is neither state and would let the assertion pass over a panel that had rendered nothing. The empty arm is PINNED rather than left to whichever branch a profile happened to take: budgets and quotas are empty on both, because nothing on a bootstrap stack creates either and there is no CLI verb for either, so if a deployment ever does hold a limit this fails loudly instead of quietly exercising only the populated arm. MEASURED ON A RUNNING COMPOSE STACK: the real profile rendered usage-meters with one row, the ledger with five, and budgets and quotas as sentences; the fake profile rendered three, two, and the same two sentences. TWO THINGS WERE MEASURED WRONG AND REPAIRED. The fixture's GET /v1/responses/{id}/artifacts row served `filename` and `byte_size`, and the real projection (artifacts/reader.go) has NEITHER — it writes run_id, size_bytes, checksum, media_type, logical_type, malware_scan_status and created_at, and no filename at all; nothing had caught it because the only consumer read `a.id`, and the artifact browser is the first screen that would have rendered those columns blank against the real API. And `pnpm sweep` had been RED since E25 T7 landed, in seedBothStacks rather than in an arm: T7 added a seed that creates a tool and a revision through POST /v1/tools and POST /v1/tools/{tool_id}/revisions, and the fixture served neither route, so the seed asserted on a 404 and NOT ONE of the sweep's eleven arms ran. The sweep's own route arm could not have caught it — it checks only that every route the FIXTURE serves is registered by the real router, never the other direction — so the seed was the one thing that would notice and the seed is what never ran. With the fixture given both routes (their shapes measured against the running real router, where creating a revision answers a NARROWER projection than listing one), the sweep is green 11/11 and its item-shape floor rises from an aspirational eleven to a measured THIRTEEN: T8's single run seed makes GET /v1/responses and GET /v1/usage/ledger comparable at once, because a run settles `run.admitted` inside the admission transaction. No tier advances on this case."
expect_status: completed
proof:
  - "apps/web-console/tests/pagination.spec.ts:a collection larger than one page shows 20 rows, SAYS more exist, and continues with ?after="
  - "apps/web-console/tests/pagination.spec.ts:no list renders a 'previous' control — backward pagination is refused by the API, so it is not offered"
  - "apps/web-console/tests/a11y.spec.ts:every route lib/routes.ts declares was actually scanned by axe"
  - "apps/web-console/tests/a11y.spec.ts:the WCAG 2.1/2.2 tags genuinely select rules the 2.0 tags do not"
  - "apps/web-console/tests/a11y.spec.ts:axe-core reports zero violations on the admin surface"
  - "apps/web-console/tests/a11y.spec.ts:axe-core reports zero violations on the live-run surface after a completed run"
  - "apps/web-console/tests/a11y.spec.ts:keyboard navigation: skip link is the first stop and the run→approve flow works with no mouse"
  - "apps/web-console/tests/auth.spec.ts:the login page is axe-clean and operable with the keyboard alone"
  - "apps/web-console/tests/observability.spec.ts:the metering screens state what they hold — and an empty one is a SENTENCE, never a blank region"
