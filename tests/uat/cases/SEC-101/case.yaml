id: SEC-101
name: one-byte-tamper-in-image-sdk-sbom-provenance-signature-or-index-denies-promotion-and-execution
proof_class: unit
provider: fake
input: "A release is verified OFFLINE as a WHOLE (§51.2/§51.3, plan §T4): scripts/release/release-verify.sh recomputes every artifact digest from the artifact's own bytes, recomputes each image's identity from the sha256 of its config blob (never from the informational `ref`), re-derives the §51.3 vulnerability decision from the raw findings, re-checks every byproduct the attestation DECLARES, verifies the openssl P-256 signature over the signed sha256sums root through the E14 T5 verifier VERBATIM, binds the in-toto/SLSA-SHAPED attestation to the index's artifact set, recomputes the materials from the source tree, and verifies the SDK package family against its own signed root. Nothing is resolved from inside the release: neither the trust root nor the verifying code (fail-closed, the E16 T7 e4aeb6f pattern) — the same fix this task applied to deploy/airgap/verify.sh, whose bundled-verifier fallback let a swapped payload pass with a neutered signer. TAMPER MATRIX — SIX arms, one byte each, every arm re-signed with the real key so it lands on the leg that RECOMPUTES rather than dying at a shared fence: image tar (the config blob → the tar does not carry the image the release names), SDK package (its own signed root's digest chain), SBOM (the index's SBOM digest no longer matches the bytes), provenance (one character in the vuln-decision byproduct's name → the §51.3 decision is no longer DECLARED), signature (the whole release re-signed with the attacker's own P-256 key → only the out-of-band trust root separates it from the real one), index (one hex character in an artifact digest → the index digest is not the file's bytes). BOTH halves are denied. PROMOTION: with the artifact directory NAMED (PALAI_RELEASE_DIR), release-verify FAILs and scripts/release/promote.sh refuses before the evidence gate is ever reached. With it UNSET the wrapper verifies no artifacts at all and the tag is blessed on the evidence gate alone — deliberate, because a fence there would run BEFORE the evidence gate and shadow the E15 T6 operator-leg refusal that scripts/uat/sh2 and scripts/uat/sdk-parity both grep for (TestPromoteReachesTheEvidenceGate pins that ordering). Recorded as SUP-3 in the RC triage: whether a release FAMILY must ALWAYS carry a verified artifact set is E18 T10's SupplyChainProof rule, not this wrapper's, and T10 takes it. EXECUTION: an image's identity IS the sha256 of its config blob, so a tampered tar has a different id and the release's pinned id names nothing in it; the runner admits a lease.offer ONLY when the image is an immutable sha256 digest (packages/runner ErrMutableLeaseImage), so the mutable reference an attacker would need to reach unpinned bytes is refused outright. PROOF SEAM: the real shipping scripts over a real scripts/release/build.sh output, with T2's committed scanner fixtures rolled up by the real sbom-tool.py and a docker-save-SHAPED image tar (a Docker-free run has no runnable image; the real six-image matrix is `make release-matrix-smoke`). §6 operator legs: out-of-band delivery of the trust root is operator ceremony (the E14 T5 model, not automated here); the revocation list is a SHAPE defined in release-index.json and matched from an OUT-OF-BAND file — the advisory flow that produces one is the T9 process doc; the signature is openssl, so NO transparency-log entry, NO identity service and NO SLSA level is claimed, and the vulnerability verdict is only as fresh as the pinned DB snapshot."
expect_status: completed
proof:
  - scripts/release/release_verify_test.go:TestReleaseVerifyAcceptsACleanRelease
  - scripts/release/release_verify_test.go:TestReleaseVerifyTamperMatrix
  - scripts/release/release_verify_test.go:TestTamperedImageIsUnreachableUnderItsPinnedDigest
  - scripts/release/release_verify_test.go:TestReleaseVerifyResolutionIsFailClosed
  - scripts/release/release_verify_test.go:TestReleaseVerifyRefusesAnUnscannedRelease
  - scripts/release/release_verify_test.go:TestReleaseVerifyMatchesAnOutOfBandRevocationList
  - scripts/release/release_verify_test.go:TestReleaseVerifyOfflineNetworkNone
  - scripts/release/release_verify_test.go:TestPromoteReachesTheEvidenceGate
  - deploy/airgap/airgap_test.go:TestVerifierSwapFailsClosed
  - deploy/airgap/airgap_test.go:TestVerifierResolutionRefusesWithNoOutOfBandSigner
# ceiling: proof_class is `unit` on the OPS-004 precedent — the same untagged deploy/airgap/airgap_test.go
# tier, which is what these proofs actually are: real shipping scripts and real openssl over real bytes,
# running in `make verify` with no Docker. The Docker-bound halves are separate operator targets and are NOT
# in this class: `make release-matrix-smoke` (the six-image matrix), `make provenance-offline-verify`, and
# the --network none leg, which is operator-gated on an already-loaded openssl+python3 tool image
# (PALAI_RELEASE_TOOL_IMAGE) — without it the offline claim is UNPROVEN in that run and the test says so
# rather than skipping quietly. E18 T10 CORRECTED two things here: the class (it declared component-real
# while every referenced proof is untagged) and a proof reference that did not resolve
# (TestPromoteRefusesAnUnnamedReleaseBeyondRC was never written, and the behaviour it named is the
# OPPOSITE of what promote.sh does — see SUP-3 above).
