id: TLM-001
name: a-long-thread-no-longer-explodes-and-a-reset-does-not-close-it
proof_class: component-real
provider: fake
input: "a session that has accumulated turns no longer assembles an unbounded prompt, and a person who wants to start over in the SAME thread can. MEASURED BEFORE (E21 T1, at ed44544): historyMessages returned every prior verbatim, SessionHistory's SQL had no LIMIT, no budget was consulted anywhere, and 400 question/answer turns of ~1 KB — a busy channel for a week — assembled 833,781 bytes of run.start messages; no test in the tree measured it and no string of the context_length_exceeded class appeared anywhere in the repo, so an overflow reached the provider as a raw upstream error, burned the whole retry ladder re-sending the same too-large history, and projected the same 'Internal error' a crashed engine does. NOW: the oldest turns are DROPPED and replaced by one visible marker naming how many went (the same 400-turn history assembles 119,073 bytes under a 120,000-byte budget), the newest turns pass through byte-identical, and a history that already fits is assembled bit-for-bit as before. THE FOLD IS A WINDOW, NOT A SUMMARY, and it is named that in the code: it is computed from the history's own marshalled sizes with no clock, no randomness and NO MODEL CALL, because history.go's standing contract is that a resumed attempt re-derives the same run.start — a model-written summariser breaks that and takes E10's replay claim with it. Folding the same history twice yields the same bytes. RESET: on Slack a NEW THREAD IS ALREADY A CLEAR (correlation is (team, channel, thread_ts), so a new thread is a new session and carries nothing) — the `clear` command kind is only for the person who wants to stay in THIS thread, and it needs no migration because commands.kind has no CHECK constraint. It reuses responses.retracted_at, whose meaning was already 'the row survives, SessionHistory stops carrying it', so a clear DESTROYS NOTHING and an operator asking what was said still has every word; it retracts SETTLED turns only, leaving a run still in flight untouched. HONEST CEILINGS, stated rather than implied: (1) this is a WINDOWER — the dropped turns fall to a marker, no model preserves their meaning, so INFORMATION IS LOST and the loss is deliberately visible; (2) the budget is a BYTE estimate, not the provider's tokenizer, so a margin case can still overflow, which is why the typed error still exists; (3) the typed error classifies on the provider's stable error CODE alone, because both adapters' sanitizeError deliberately discards the provider's free text (it can echo a credential prefix) — and on provider-two a prompt over the CONTEXT WINDOW is a plain 400 invalid_request_error, the same documented type as a malformed tool block, so it is deliberately NOT classified and the byte budget is the whole defence there; (4) the budget is one documented constant rather than a per-model window, because nothing in this tree stores a context window — not model_routes, not the broker, not either adapter — so there is nothing to resolve, and an unknown budget folds rather than not folding. Tier: UNCHANGED. WHAT PRODUCED THIS EVIDENCE: a deterministic local seam — the fold is computed from the history's own marshalled sizes with no clock, no randomness and no model call, and the E21 T7 exit journey re-measures it over rows a real PostgreSQL holds, read back through the shipped SessionHistory query. §6 OPERATOR LEG: none of this covers leg 1 — no real Slack thread has been driven past the budget, so what is proven is that the ASSEMBLY stays inside it, never that a real provider accepted the result."
expect_status: completed
