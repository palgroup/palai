id: CAS-002
name: an-approved-push-and-a-draft-pull-request-to-the-bindings-base
proof_class: component-real
provider: fake
input: "An agent that can WRITE code (CAS-001) can now ASK to publish it, and the asking is all the tool does (E22 T4, plan §2 'no side effect without approval'). `palai.publish.push` and `palai.publish.pull_request` enter the Slack tool list under the SAME condition the coding tools entered under — a repository is bound — in a LIST OF THEIR OWN, so granting a workspace and granting a publication stay two decisions a reader can tell apart; without a binding neither name appears, because RunPublicationTarget would answer 'the run prepared no repository' and an advertised tool that can only fail is worse than an absent one. NEITHER TOOL ACTS: each records a PENDING publication and returns pending_approval, and the RED half is asserted in the order the danger runs — the tool is called and the approval pump is driven while nothing has been decided, and the publisher must not have been touched, because every other failure in this chain announces itself (a refused click answers, a failed push warns, an unwired publisher logs) while an unapproved push is simply a branch appearing on somebody's remote. THE APPROVAL SURFACE IS NOT NEW AND E22 OPENED NOTHING (plan §3.6 D9): ApprovalMessage has minted Approve/Deny since E19 T2, only ids in SLACK_APPROVER_IDS may press them, and blocks_test.go's AST sweep still pins interactions.go as the SOLE minter — what was missing was a publication for those buttons to decide. The click runs the shipped chain end to end against real PostgreSQL — thread↔session correlation, the connection's allow-list (an unmapped clicker enqueues NOTHING and the publisher is still untouched), the one-shot request hash, AcceptCommand, ApplyApprovalDecision — and only then does the boundary pump publish, exactly once, to exactly the approved destination, with a re-driven boundary publishing nothing a second time. DENY PREVENTS THE SIDE EFFECT rather than recording a verdict about it: after a deny the publication leaves the publishable set, the pump is driven again, the run is CANCELLED and the pump is driven once more, and the publisher is never asked for anything at all. `dev` IS A BINDING VALUE, NEVER A CODE CONSTANT (X17): the base is rb.default_branch resolved server-side by RunPublicationTarget, which is what §0.2's PALAI_GIT_BASE_BRANCH becomes, and the schema guard refuses base/head/remote/branch/ref/url — by substring, because target_branch and head_ref are the same field with different spellings — from either tool's InputSchema, shown to FAIL on a `base` property before being trusted, since a base the model can choose is a base the approver did not approve. WHAT THE HUMAN READS IS NOT THE MODEL'S PROSE: publicationDisplay is untouched by E22 and builds 'open draft pull request <branch> -> <base> on <remote>' from the resolved destination, while the model's proposed title and body are RECORDED on the publication's args for a later policy-filtered pass and appear on no surface a human decides from — asserted by JSON-DECODING the minted message rather than by substring, because encoding/json escapes `<` and a raw-substring sweep over marshalled Block Kit can never fail (E20 T4's lesson). THE SILENCE AROUND THE PUBLISHER IS REMOVED, and it was the most expensive silence in the tree: repositoryPublisherFromEnv returns nil when any of its three variables is missing, which made the pump a no-op indistinguishable from success — pending_approval, an Approve click, a repaired 'Approved: push agent/…' message, an approved row, and a branch that is never pushed. compose now passes the App through, `palai up` warns when a bound repository has no App and when one is HALF configured, the control-plane says so at boot, and the PRIVATE KEY IS A HANDLE: its bytes go to a 0600 file secret and what the environment carries is a container PATH — proven by sweeping all of os.Environ, not the four names somebody remembered. THE TWO CEILINGS E22 MEASURED HERE ARE CLOSED BY E23 T3, and this paragraph is the edit those assertions demanded rather than a claim that they were always fine. (1) E22 recorded that NOTHING IN THIS TREE POSTED AN APPROVAL MESSAGE — ApprovalMessage had no production caller, exactly as E19 T2 wrote down in slack_decision.go — so the chain was complete while a human's path to the button was not. It has one now: coordinator.RequestPublication writes a slack_approval_deliveries order INSIDE the transaction that opens the approval (000041's shape, 000044 R4), a single-winner pump posts ApprovalMessage into the correlated thread, and the ceiling sentence in slack_decision.go is DELETED because it became false. What lands is asserted DECODED: the resolved destination publicationDisplay built, the channel and thread_ts the run was born in, and buttons whose value is the pending approval's one-shot hash — with a second pump tick posting nothing, because UNIQUE (approval_id) and a claim that IS the update make one question one message. (2) E22 recorded that a run did NOT park on its own pending approval, so it answered and reached `completed` before any human looked, and the click that arrived afterwards did not merely refuse — ApplyApprovalDecision runs under guardRunActive, so Decide returned an ERROR the interactivity route answered 503, the human saw Slack report a failure, and the publication stayed pending forever. The run PARKS now, through the same path a gated tool call parks on: running -> waiting, no tool.result, nothing for the model to continue on — and the click that used to 503 lands, the publication moves to approved, the wake drives waiting -> running with the response.run job enqueued in the SAME transaction as the decision, and the boundary publishes once. The park is decided by a pending approvals row THIS RUN owns, never by a tool answering a `pending_approval` status — a string an MCP server can write, and tool output is untrusted data — so the fix is one read in the dispatcher rather than a rule per publication tool. A DENY releases the run too, because a gate that refuses the operation and leaves the run waiting forever has replaced one failure with a worse one. AND THE APPROVAL NOW HAS A DEADLINE: 000013 declared expires_at in 2023 and nothing ever wrote a value into it, which was harmless while nothing waited and a run parked forever the moment something does — so the sweep that expires the question also releases the run parked on it, proven against a workspace that REFUSES the message (SLK-006: a delivery failure costs a human the button and never the approval, its deadline, or the run). WHAT SURVIVES OF THE SECOND CEILING, asserted on its own rather than dropped: guardRunActive still refuses a decision on a genuinely terminal run and the route still answers 503 — the ordinary flow no longer walks into it, but a run cancelled or timed out while a question was open still does, and that window is left open deliberately because a decision applied to a dead run would publish from a workspace nobody holds. INHERITED AND UNCHANGED: only the session's OLDEST pending approval is decidable, from Slack or from the native command surface alike, so two concurrent questions mean the second waits its turn; and the question goes to the THREAD — there is no routing to a DM or to a separate approval channel. The other four: the GitHub App is PER DEPLOYMENT (GAP-3), the pull request opens with a DETERMINISTIC title/body while the model's proposal is only recorded, and there is NO merge, NO review request and NO CI wait. The publisher in the component tier is a recorder; a REAL push to a REAL remote and a pull request GitHub itself reports as a DRAFT — the one claim no fake can answer, since every deterministic tier can only echo our own `in.Draft = true` back — is the credential-gated live leg in tests/live/repository and is NEVER claimed here. THE OPERATOR LEG THIS CASE DOES NOT COVER, named rather than left implicit: §6 leg 5 — a REAL GitHub App (`PALAI_GITHUB_APP_*`) pushing to a REAL remote and opening a pull request GitHub itself reports as a draft — is opened by E22 and stays OPEN, and §6 leg 1 (a captured receipt from a REAL Slack workspace) is untouched and grew again."
expect_status: accepted
