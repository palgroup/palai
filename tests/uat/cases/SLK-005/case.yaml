id: SLK-005
name: edit-is-correction-delete-is-tombstone-file-is-scoped
proof_class: component-real
provider: fake
input: "a message edit maps to a correction (it supersedes, not a new turn), a delete maps to a tombstone (the prior content is retracted), and a shared image is FETCHED and put in front of the model. LOCAL proof (T1): the (type, subtype) classification unit test. WIRED (E19 T1): an edit and a delete now reach ADMISSION as their own kind through the shipped route against real PostgreSQL, rather than only being classified in the pure mapping. THE FILE LEG IS NOW BUILT (E20), which retires the ceiling this case used to declare: the bot fetches the file with its own token through the E09 artifact seam, the run's input names the artifact as an `image_ref` content item (content.json already defined it), and the control plane joins the BYTES to the provider request — never the engine, whose frame ceiling is 1 MiB. Scope of the fetch: signature verified, connection resolved, allowed_channels passed and the run-birth rule satisfied BEFORE a byte moves, so a file id in a payload is never an arbitrary read (the bot holds files:read). The token rides one Authorization header to Slack's own file hosts only. Bytes are SNIFFED, not trusted: a shell script called screenshot.png is refused. Size is bounded twice and the count at 3 per message, and every refusal is COUNTED INTO THE PROMPT rather than dropped silently. §6 leg 1: a REAL Slack workspace external receipt is operator work and is NEVER claimed here — the local seam is the FAKE Slack peer, so `slack` closes PREVIEW, not stable. The MODEL-SEES-IT half is not claimed from a fake either: it is settled by a real gpt-4o-mini round trip that reads generated text out of a real PNG (make test-live-provider CASE=vision-reads-image). STILL DEFERRED, and named rather than implied: malware scanning (artifacts carry malware_scan_status='not_scanned', no scanner is wired anywhere in the tree), and prompt injection through text rendered INSIDE an image, which this leg cannot solve — what it guarantees is that an image cannot change a run's authority."
expect_status: completed
