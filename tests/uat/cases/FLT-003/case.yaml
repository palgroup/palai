id: FLT-003
name: the-key-only-enrols-is-locked-to-its-pool-is-hashed-shown-once-its-revocation-stops-no-running-machine-and-strict-enrolment-holds-a-machine-for-a-human
proof_class: component-real
provider: fake
input: "A RUNNER POOL ENROLMENT KEY ADMITS A MACHINE INTO ONE POOL AND DOES NOTHING ELSE, AND THE TASK'S OWN PREMISE WAS INVERTED BEFORE A LINE WAS WRITTEN. The plan asked for a reusable enrolment credential because the existing one was 'one-use, which does not scale to a fleet'; the tree had ALREADY moved to a reusable credential and denied it in ten places — `FileEnrollmentTokens`' own heading reads 'WHY THIS IS NOT ONE-USE, AND WHAT REPLACED THAT', because renewal authenticates with the certificate that is expiring and a machine that missed its window can only recover by re-presenting the bootstrap credential. So what this adds is NOT reusability: it is SCOPE, HASH, EXPIRY, REVOCATION and a RECORD. SCOPE, RED FIRST: a key minted for the Mac pool admits a machine into the Mac pool and REFUSES one that declares the Linux pool, and the refusal is JOURNALLED with both the pool declared and the pool the key admits into — the proof is two-sided because a credential that refused everything would satisfy the refusal half on its own, so the SAME key is shown enrolling into the pool it names in the same test. The declaration is what catches the realistic operator mistake — pasting the wrong pool's key onto a machine — which posture comparison (T2) cannot catch when two pools share a posture; the key is authoritative and a declaration never widens it. REVOCATION HAS THREE HALVES AND TWO OF THEM ARE A REGRESSION FENCE, NOT A FEATURE: after a key is revoked a NEW enrolment is refused and journalled, the machine that enrolled WITH that key renews TWICE afterwards over its existing mTLS identity, and that machine's IN-FLIGHT LEASE still relays frames both ways. The last two are true today and staying true is this epic's promise — the structural reason is that `handleRenew` authenticates with the certificate the machine already holds and the credential chain is not on that path at all, so a key revocation cannot become a back door into SAN-011's hard stop, which is a MACHINE-level decision and T5's. THE OPERATOR IS SHOWN WHAT THEY DID NOT STOP: a revoke answers with the machines the key already admitted, under a field named `enrolled_runners_still_running`, because an operator who is not shown them reads 'revoked' as 'removed' and believes one call decommissioned a fleet. That list is only possible because `runners.enrolled_via_key_id` now records WHICH key minted which certificate — the one missing fact §3.6 D5 named, measured RED on a machine that could already enrol: both that column and the journal's `key_id` were empty, so revocation could only ever be all-or-nothing. THE KEY IS NOT AN API KEY, and it is proved by PAIRING rather than by assertion: the same value on `GET /v1/runners` is a 401 that resolved no scope at all, while a real API key on the SAME route and the SAME server is a 200, and the key's digest is in no `api_keys` row — so `Scope.HasScope`'s empty-scope-means-every-capability rule cannot be reached with one. HASHED, CONSTANT-TIME, SHOWN ONCE: `sha256` at rest with an 8-character published prefix for listings only, compared with `crypto/subtle.ConstantTimeCompare`, and the value returned by exactly one response. The file token's comparison was `strings.TrimSpace(string(raw)) != token` and is now constant-time too; a STRUCTURAL guard parses both files and requires the subtle call while refusing any `==`/`!=` that mentions the presented credential — shown to go red when the old expression is put back. THE CHAIN IS POOL KEY -> FILE TOKEN -> REFUSE and only 'not mine' falls through: a revoked, expired or wrong-pool key is a RECOGNISED credential that was refused, and re-asking a different credential about it would turn the chain into a way to shop for an issuer; a store that cannot answer is a 503 and never a silent demotion to the default pool. THE FILE TOKEN IS NOT DELETED: it is the only credential that can mint an identity for a machine whose certificate has ALREADY expired. THE VALUE REACHES NO ROW, JOURNAL OR LOG, swept by DECODING every JSONB document rather than grepping bytes — and the sweep was mutation-proved BOTH ways: with the value planted JSON-escaped inside a nested document the decoding walk found it while the raw-byte scan over the same rows PASSED, which is the mistake this repository shipped once. HONEST CEILINGS, both filed: whoever holds a key can enrol a machine of their own into that pool and be offered real work, because nothing attests what a machine IS and strict enrolment is T6's and OFF by default — the defences are key secrecy and revocation speed and there are exactly two (`FLT-P4`); and the number of concurrent identities one key can mint is NOT capped and the pool key is deliberately NOT rate-limited, because `minInterval` exists for a credential ONE runner holds and the same rule would make a ten-Mac pool unenrollable — a correction to the plan (`FLT-P5`). AND THE SURFACE IS PROVED TO BE REACHABLE FROM THE SHIPPED BINARY, because this tree has twice built a security surface that no production path constructed — `CreateSlackConnection` (E19 T9) and `DecideToolApproval` (E23 T2) were both fully tested and reachable from nothing. Three call sites are fenced by name: the store is constructed, the gateway is handed it, and the router is handed it; the fence was shown to go red when the gateway's line is removed. THIS TASK ADDS NO MIGRATION: `runner_pool_keys` is T1's 000045 R2, and 000045 is the epic's only one. AND STRICT ENROLMENT IS THE CONTROL THAT CLOSES THAT CEILING AND IS OFF BY DEFAULT (E24 T6), WHICH IS WHY THIS CASE CARRIES IT RATHER THAN A NEW ONE: the risk above is a property of the KEY, and the waiting room is the answer to it, so a reader who meets one has to meet the other. RED (1): a machine enrolling into a pool with `strict_enrollment=true` is recorded `pending`, RECEIVES ITS CERTIFICATE, and is UNREACHABLE FROM A DIAL — measured verbatim as `runners.state = \"active\" after enrolling into a pool with strict_enrollment=true, want pending`, and then, with the state written and the waiting room neutered, as `Dial into a pool whose only machine is PENDING = <nil>, want ErrPoolHasNoRunner`. The certificate is issued deliberately: `renew` authenticates with the certificate the machine already holds, so a waiting machine with none could not survive one certificate lifetime of waiting and the human's approval would land on a row nothing could reach. What keeps it out of work is that it NEVER JOINS ITS POOL'S RENDEZVOUS — T5's structural choice for a cordon and T2's for the pool, taken here for the same reason, so no later change can soften the waiting room into a preference. The answer to a Dial is `ErrPoolHasNoRunner` AND NOT A TIMEOUT, because a pool whose only machine is waiting for a human has no capacity: the run PARKS through T4's path and is re-entered by the same wake every connect performs when the human admits it, rather than spending the retry ladder to a dead letter in ~2.5 minutes while the approver is asleep. `pending` IS A THIRD LIFECYCLE FLAG AND NOT A REUSE OF `cordoned`, and that is the reason: a cordoned machine is a MEMBER of its pool (capacity present, all of it busy, so a run rides the ladder) while a pending machine is ABSENT capacity. RED (2), BIT-UNCHANGEDNESS: with `strict_enrollment=false` — the default, the value migration 000045's ALTER TABLE gave every pool that already existed, and the value `InsertDefaultRunnerPool` writes for every new organization — the machine's life is exactly T3's and T5's: it enrols `active`, nothing is asked about it, it takes a lease with no human in the path, and its journal carries NO `approved` entry. It was shown RED by a build that sent every enrolment to the waiting room, which is the regression the fence exists for. `resume` WOULD HAVE BEEN THE BYPASS AND WAS MEASURED, not reasoned about: `SetRunnerState`'s predicate admitted anything not already revoked, so `palai admin runner resume` — a `provision` verb with no approver check on it — moved a `pending` machine straight to `active`; a `cordon` would have been worse, ERASING the fact that nobody had admitted the machine so that the resume after it looked legitimate. One clause refuses both and deliberately still permits a REVOKE, because refusing an enrolment is exactly what an operator does with a machine they did not order. THE APPROVAL SURFACE IS NOT E23'S THROAT AND THE REASON IS WRITTEN WHERE A READER MEETS IT: `ApplyApprovalDecision`'s subject is a tool call or a publication, keyed by a tool-call id and bound to a `request_hash` so the arguments a human approved are the arguments that run — and a machine enrolment has no arguments, no parked call and NO HASH TO BIND TO, since the certificate was issued before anybody was asked. A separate PATH is correct; what is NOT separate is the POLICY, because who may decide is still `config_policy.approvers` evaluated by `ConfigPolicy.ApproverAllowed`, and the tree's own `TestApproverAllowedHasExactlyOneProductionCallSite` guard went RED on the new call site and now names both paths with that argument in its header. E23 T2's asymmetry carries unchanged: no list configured admits any principal (bit-unchanged for every project alive today), a list denies by default, and an unresolved principal decides nothing. The list is the RUNNER'S OWN PROJECT'S, read from the row and not from the caller's scope — an org-scoped key carries no project, so a scope-keyed read would have found no project row, decoded an empty policy, and an empty list permits everything: the approver list bypassed by holding a wider key. THE ROUTE IS GATED ON `approve` AND NOT `provision`, which is api/approvals.go's argument verbatim: `PATCH /v1/projects/{id}` writes `config_policy`, it is `provision`-gated, and `approvers` lives there — so a provision key could add ITSELF to the list it is about to be checked against, and a `provision` key is asserted to be REFUSED on this route while an `approve` key is admitted. The approval is IDEMPOTENT and journalled exactly ONCE: a repeat is a 200 rather than a 404 an operator would read as a wrong id, and the retry is also what reaches a session whose connect raced the row write. THE COMPOSITION ROOT IS FENCED BY NAME on the AST and the fence was shown to go RED — the mounted route AND its path string, the CLI verb, and `awaitApproval`'s call site in the connect handler, which is the one whose absence would leave every surface an operator can read still saying `pending` while the machine took work. TWO CEILINGS FILED: strict mode is OFF by default so `FLT-P4` above is the posture 1.0 ships (`FLT-P12`), and an approval admits an ENROLMENT and not a MACHINE — the same Mac re-enrolling asks again, which is the correct subject and also means a human per re-enrolment (`FLT-P13`). T6 ADDS NO MIGRATION EITHER: `runner_pools.strict_enrollment` and the `pending` state are both T1's 000045."
expect_status: completed
