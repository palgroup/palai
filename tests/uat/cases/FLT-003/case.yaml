id: FLT-003
name: the-key-only-enrols-is-locked-to-its-pool-is-hashed-shown-once-and-its-revocation-stops-no-running-machine
proof_class: component-real
provider: fake
input: "A RUNNER POOL ENROLMENT KEY ADMITS A MACHINE INTO ONE POOL AND DOES NOTHING ELSE, AND THE TASK'S OWN PREMISE WAS INVERTED BEFORE A LINE WAS WRITTEN. The plan asked for a reusable enrolment credential because the existing one was 'one-use, which does not scale to a fleet'; the tree had ALREADY moved to a reusable credential and denied it in ten places — `FileEnrollmentTokens`' own heading reads 'WHY THIS IS NOT ONE-USE, AND WHAT REPLACED THAT', because renewal authenticates with the certificate that is expiring and a machine that missed its window can only recover by re-presenting the bootstrap credential. So what this adds is NOT reusability: it is SCOPE, HASH, EXPIRY, REVOCATION and a RECORD. SCOPE, RED FIRST: a key minted for the Mac pool admits a machine into the Mac pool and REFUSES one that declares the Linux pool, and the refusal is JOURNALLED with both the pool declared and the pool the key admits into — the proof is two-sided because a credential that refused everything would satisfy the refusal half on its own, so the SAME key is shown enrolling into the pool it names in the same test. The declaration is what catches the realistic operator mistake — pasting the wrong pool's key onto a machine — which posture comparison (T2) cannot catch when two pools share a posture; the key is authoritative and a declaration never widens it. REVOCATION HAS THREE HALVES AND TWO OF THEM ARE A REGRESSION FENCE, NOT A FEATURE: after a key is revoked a NEW enrolment is refused and journalled, the machine that enrolled WITH that key renews TWICE afterwards over its existing mTLS identity, and that machine's IN-FLIGHT LEASE still relays frames both ways. The last two are true today and staying true is this epic's promise — the structural reason is that `handleRenew` authenticates with the certificate the machine already holds and the credential chain is not on that path at all, so a key revocation cannot become a back door into SAN-011's hard stop, which is a MACHINE-level decision and T5's. THE OPERATOR IS SHOWN WHAT THEY DID NOT STOP: a revoke answers with the machines the key already admitted, under a field named `enrolled_runners_still_running`, because an operator who is not shown them reads 'revoked' as 'removed' and believes one call decommissioned a fleet. That list is only possible because `runners.enrolled_via_key_id` now records WHICH key minted which certificate — the one missing fact §3.6 D5 named, measured RED on a machine that could already enrol: both that column and the journal's `key_id` were empty, so revocation could only ever be all-or-nothing. THE KEY IS NOT AN API KEY, and it is proved by PAIRING rather than by assertion: the same value on `GET /v1/runners` is a 401 that resolved no scope at all, while a real API key on the SAME route and the SAME server is a 200, and the key's digest is in no `api_keys` row — so `Scope.HasScope`'s empty-scope-means-every-capability rule cannot be reached with one. HASHED, CONSTANT-TIME, SHOWN ONCE: `sha256` at rest with an 8-character published prefix for listings only, compared with `crypto/subtle.ConstantTimeCompare`, and the value returned by exactly one response. The file token's comparison was `strings.TrimSpace(string(raw)) != token` and is now constant-time too; a STRUCTURAL guard parses both files and requires the subtle call while refusing any `==`/`!=` that mentions the presented credential — shown to go red when the old expression is put back. THE CHAIN IS POOL KEY -> FILE TOKEN -> REFUSE and only 'not mine' falls through: a revoked, expired or wrong-pool key is a RECOGNISED credential that was refused, and re-asking a different credential about it would turn the chain into a way to shop for an issuer; a store that cannot answer is a 503 and never a silent demotion to the default pool. THE FILE TOKEN IS NOT DELETED: it is the only credential that can mint an identity for a machine whose certificate has ALREADY expired. THE VALUE REACHES NO ROW, JOURNAL OR LOG, swept by DECODING every JSONB document rather than grepping bytes — and the sweep was mutation-proved BOTH ways: with the value planted JSON-escaped inside a nested document the decoding walk found it while the raw-byte scan over the same rows PASSED, which is the mistake this repository shipped once. HONEST CEILINGS, both filed: whoever holds a key can enrol a machine of their own into that pool and be offered real work, because nothing attests what a machine IS and strict enrolment is T6's and OFF by default — the defences are key secrecy and revocation speed and there are exactly two (`FLT-P4`); and the number of concurrent identities one key can mint is NOT capped and the pool key is deliberately NOT rate-limited, because `minInterval` exists for a credential ONE runner holds and the same rule would make a ten-Mac pool unenrollable — a correction to the plan (`FLT-P5`). THIS TASK ADDS NO MIGRATION: `runner_pool_keys` is T1's 000045 R2, and 000045 is the epic's only one."
expect_status: completed
