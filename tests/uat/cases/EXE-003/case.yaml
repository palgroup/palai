id: EXE-003
name: background-start-probe-and-kill-are-addressed-to-the-attempts-machine-and-an-unreachable-one-is-lost-rather-than-exited
proof_class: component-real
provider: fake
input: "A HALF-MOVED BACKGROUND IS WORSE THAN AN UNMOVED ONE, and this case is the whole of it moving. `background_tasks` carried thirteen columns and none of them said WHERE the process was: liveness was a pgid probe plus a start time, and both are readings of ONE machine's kernel — unique inside a machine and meaningless across machines. With execution moving off the control plane, a plane probing its own kernel for a task another machine started cannot tell `never mine` from `exited`, and `exited` tells a model its build finished while it is still compiling. WHAT IS PROVED, over a REAL gateway on a local seam — one box, two processes, and no second computer is claimed anywhere: migration 000064 puts `machine_id` on the row; all three verbs — `bg.start`, `bg.probe`, `bg.kill` — are addressed to the attempt's machine over a `bg.*` wire family that is the SIBLING of `exec.*` rather than a subtype, correlated by `bg_id` rather than `exec_id` so a stray `exec.result` can never satisfy a background wait; and a control plane can address a machine that holds NO LEASE at all, which is the case the reconciler actually needs since it sweeps tasks long after the attempt ended. Building that half required making the runner's park a LOOP: it used to be a single `Read` awaiting a `lease.offer`, so a `bg.probe` sent to a parked machine would have been consumed as a malformed offer and KILLED THE PARK — shipping the gateway half alone could have dropped every parked runner in a fleet. THE LIFECYCLE ANSWERS ARE TESTS AND NOT COMMENTS, because a lifecycle rule written as prose is the evidence a reader accepts instead of reading the caller: a CORDONED machine still answers (cordon stops new placement, not running work, and a cordoned machine that went silent would orphan the tasks cordon exists to drain), a REVOKED one is unreachable, and an UNKNOWN one is unreachable rather than a silent wait. AN UNREACHABLE MACHINE IS `lost` AND IS NEVER SIGNALLED — a pgid is a small integer and this reaper spans tenants, so a signal on a handle we cannot prove is ours need not have landed on a Palai process. TWO UNKNOWNS ARE NOT A MATCH: a row naming no machine is unreachable even when this plane is also unnamed, because resolving the rows with the LEAST evidence to a local probe is the exact wrong answer this seam exists to stop. And a foreign machine's TAIL is not read: that file is on that machine, and on a shared filesystem the same relative path is another run's output. HONEST CEILINGS. `os.Hostname()` is the machine identity and is NOT unique — two Macs can both be MacBook-Pro.local. Rows predating the column settle as `lost` on the first sweep even if their process runs. The park now reads non-lease traffic with no rate limit. The doc comment above `probeOnMachine` still documents a deleted symbol and asserts the absence of the very protocol beneath it. §6 operator legs are untouched, and nothing here was driven through a RUN."
expect_status: completed
