id: HIL-002
name: the-approval-screen-is-computed-complete-and-verbatim-and-no-field-of-it-is-written-by-the-model-or-the-server
proof_class: component-real
provider: fake
input: "WHAT A HUMAN READS BEFORE AUTHORIZING A TOOL CALL IS COMPUTED, NOT NARRATED, and it has exactly three parts whose provenance is fixed by construction: (1) the IDENTITY, resolved through the SAME lookup that will EXECUTE the call — never a name off the model's frame, or the human would be authorizing whatever the model chose to call it; (2) the OPERATOR'S LABEL, one sentence written at registration, rendering as the literal `(no operator label)` when nobody wrote one, because a blank line reads as \"there is nothing more to say\" and the honest reading is \"nobody wrote one\"; (3) the ARGUMENTS IN FULL — the ledger row's committed bytes, decoded, every string neutralized, re-encoded key-sorted by encoding/json's own ordering, so two renderings of one row are byte-identical and a diff between them is a real difference. THE DISPLAY IS DERIVED AND NEVER STORED, and that is a guarantee rather than a saving: a stored display is a second copy of the truth and a second copy can drift — an argument patched after the row was written, a tool re-registered under another binding — while a derived one has nothing to drift from. WHAT IS NOT ON THE SCREEN IS THE POINT: the MCP server's `description` is not there and neither is its `title`, although the vendor documents both as the human-readable display fields — because the same page says clients \"MUST consider tool annotations to be untrusted unless they come from trusted servers\" (fetched 2026-07-29, plan §3.5 P3/P4), so the two fields recommended FOR display are the two whose author has an interest in the answer. The model's prose is not there either; the one thing it authored that IS there is the CONTENTS of the arguments, because those are what it asked for and hiding them would defeat the gate. THE SWEEP DECODES BEFORE IT SEARCHES, because encoding/json escapes `<`, `>` and `&` and a raw-substring assertion over marshalled Block Kit can never fire (E20 T4 paid that lesson twice). TRUNCATION IS VISIBLE: past the render budget the argument block is CUT and the cut is STATED in an `alert` block, and the button stays bound to the FULL bytes on the tool call rather than to what was shown. TWO SURFACES, ONE RENDERING: the channel message and the modal opened from it are built from the same row through the same function, so they cannot disagree by construction rather than by discipline — and the modal performs NO database write, because `views.open` must be called inside the interactivity ack budget while `trigger_id` \"will expire 3 seconds after it's sent to your app\" (plan §3.5 P10). A refused modal opens nothing and tells the clicker nothing. LOCAL SEAM: unit for the derivation and the two renderers, component-real for the ledger-row read and the route's ack budget; the fake Slack peer is a loopback server and no socket reaches slack.com. THE OPERATOR LEG THIS CASE DOES NOT COVER: how any of it LOOKS in a real workspace is §6 leg 1, which is untouched; and §6 leg 2 (whether `interactivity_pointer` shares trigger_id's three seconds, plan §3.5 P17) is UNCONFIRMED, which is why that field is never used."
