  - apps/control-plane/internal/execution/remote_workspace_test.go:TestAMachineRefusalKeepsItsSentinelAcrossTheWire
  - apps/control-plane/internal/execution/remote_workspace_test.go:TestTheMachineRefusesAnAllocationOutsideItsManagedRoot
  - packages/runner/workspace_open_test.go:TestTheMachineCreatesAnAllocationTheControlPlaneNamedUnderItsRoot
  - packages/runner/workspace_open_test.go:TestTheMachineWillNotCreateAnAllocationThroughASymlink
  - packages/runner/workspace_open_test.go:TestTheMachineWillNotCreateAnAllocationOutsideItsRoot
  - packages/runner/workspace_open_test.go:TestAnUnsafeLocalBindIsHonouredWithoutBeingCreated
  - packages/runner/workspace_open_test.go:TestAWorkspacelessLeaseOpensNothing
