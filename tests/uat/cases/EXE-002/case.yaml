id: EXE-002
name: the-six-coding-tools-act-on-the-machine-and-a-workspace-tool-refuses-rather-than-falling-back-to-this-hosts-disk
proof_class: component-real
provider: fake
input: "A SHELL ON THE MACHINE AND FILES ON THE CONTROL PLANE WOULD HAVE BEEN WORSE THAN NEITHER, and that is why this case exists beside EXE-001. A command that runs on the machine while `palai.workspace.file` writes to the control plane's disk produces a run whose build cannot see its own edits — the two halves have to move together or the tree is split across two hosts with nothing saying so. WHAT IS PROVED, over a REAL gateway, a REAL mTLS lease and the REAL packages/runner router — a local seam on ONE box, with only the machine's shell executor and two registries faked, neither of them on the path this case touches: all six coding tools act on the machine that holds the lease, through a new `ws.*` verb family — `file` writing, `file` reading, `commit`, `push`, `pull_request` and `show_media` — and the ALLOCATION and the CLONE are opened there too. The directory is laid out by the machine as it accepts the lease, and the path comes from the control plane, which makes it a §30.13 boundary: so it is walked COMPONENT BY COMPONENT with `Lstat` and a symlinked component is REFUSED, because `MkdirAll` would follow `<root>/link` to `/etc` in silence and then mount it into the engine. The credential stays the control plane's: binding resolution, broker selection, the MINT and the revoke on every return path are all control-plane side, and what crosses the wire is a five-minute single-audience read token; the machine deletes its own staging area under `defer`, which is the half nobody comes back for. THE NEGATIVE HALF IS WHAT MAKES THE POSITIVE ONE MEAN ANYTHING, and it is asserted per tool rather than in aggregate: with the machine's answer withheld, each of the six REFUSES instead of falling back to this host's disk, and the machine's refusal keeps its SENTINEL across the wire so `refused` does not degrade to `failed`. Each was shown red by a perturbation that reddened its own line — eight of them, listed by line number in the release bundle. One perturbation stayed GREEN and the perturbation was the guilty party rather than the test: a fallback added to `file.go` was never on the branch the test drove, and the honest perturbation was to make `RemoteWorkspace.Write` reach the local disk, which was red. HONEST CEILINGS. There is NO workspace affinity: `grep -c runner_id storage/queries/workspaces.sql` answers 0, so a two-machine pool's second run does not see the first's tree — loud rather than silent, and harmless only because today's single-machine pool is the only shipped shape. The repositories seal grew by one target, named and TTL'd, because git reads its credential from a helper FILE beside the clone. Approval push, changeset, finalize and snapshot are still on the control plane's disk and are carried in this release's placement ledger rather than omitted. §6 operator legs are untouched: no rented Mac, no second host, and nothing here was driven through a RUN."
expect_status: completed
