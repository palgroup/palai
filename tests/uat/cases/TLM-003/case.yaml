id: TLM-003
name: agent-mentions-the-requester-and-only-the-requester
# ‼️ DOWNGRADED FROM `component-real` ON 2026-08-07, AND THE GUARD IS WHAT FORCED IT INTO THE OPEN.
# This case had two component-tier legs and has lost both: the first was withdrawn on 2026-08-05 with the
# control plane's in-process Slack bridge, and the second — TestMigration43SlackRequester — went with the
# tables it pinned in 000009_drop_slack_cutover_tables. What is left is six adapters/integrations/slack
# unit tests, all of which still pass and still prove the RENDERER half: our token is minted from an id the
# model never supplies, and the model's own prose is neutralised first.
#
# WHAT IS NO LONGER PROVEN AT THIS TIER IS THE DURABLE HALF — that the requester identity survives a
# restart on a real database — because the column it lived in is not this control plane's any more, and
# apps/slack-bot has no requester test at all (measured: zero matches under apps/slack-bot/**_test.go).
# Writing `unit` is the true statement; leaving `component-real` would have been the case claiming a tier
# no proof in the tree carries, which is the overclaim TestToolsMemoryCatalogMaterialized exists to catch.
# The case TEXT above is shipped and is left byte-for-byte: it describes what E21 built and verified when
# it shipped, not what this repository proves today.
proof_class: unit
provider: fake
input: "the agent can ask the person who asked it — and the defence E20 T1 built is EXTENDED rather than pierced. The rule is not \"the model may not address a human\"; it is \"text the MODEL WROTE may not address a human\". The model declares a TYPED INTENT ({\"type\":\"mention\",\"who\":\"requester\"}) and our renderer mints the <@U…> token from an id the model never supplies: `who` is a CLOSED ENUM whose only value is `requester`, so a fixture writing a user id into it mints NOTHING and falls to inert text, and a raw <@U…> in the model's own prose is still escaped by NeutralizeBroadcasts (untouched). THE ORDER IS THE PROPERTY: the model's words are defused FIRST, our token is added SECOND — reversed, our own mention would be escaped; merged, a model's would survive. The identity is DURABLE because it has to be: slack.Event.UserID lived only in memory, in none of the three Slack tables (§3.6 D4), while the thing that sends the mention is the reply pump — a retrying worker reading a row across restarts. Migration 000043 writes requester_user_id at admission (next to the turn handle) and FREEZES it onto the delivery row at enqueue, exactly as channel_id/thread_ts are frozen. FAIL-CLOSED: an empty id (every pre-000043 row, DEFAULT '') sends the words with NO mention — never an invented id, never a fallback to <!here>. The id never enters the prompt; slack_admit.go's rationale stands, and the one sentence in it that was FALSE (\"an operator who needs to know who wrote still has it\" — the reservation names an event, the correlation names a thread, neither is a person) is corrected in the same commit. §3.6 D6 closes here too: the two outbound paths outside the broadcast defence — assistant.threads.setStatus and chat.update — now neutralize what they carry, and a branch literally named <!channel> (a valid git ref, reaching Slack through the publication display chat.update interpolates) is defused while the decider's ping WE mint survives. HONEST CEILING: the only reachable identity is the person who asked. A channel (<#C…>), a user group (<!subteam^S…>), @here/@channel and an arbitrary workspace member are STRUCTURALLY out of reach — the renderer holds exactly one id and takes none from the model; a second identity costs a durable column, an enum constant, and a RED test proving WE and not the model choose it. SECOND CEILING: a mention is a NOTIFICATION, not a question-and-answer channel — the agent asks, the human writes in the thread, and that is a new turn; no pending-question state exists and this epic does not open one. THIRD CEILING, and it is the §6 one: every counterparty here is the documented FAKE Slack peer. A real workspace has never seen this mention — leg 1 (a captured real-workspace receipt) is operator work and nothing in this case closes it."
expect_status: accepted
proof:
  - adapters/integrations/slack/mention_test.go:TestAMentionTheModelWroteIsStillNeutralized
  - adapters/integrations/slack/mention_test.go:TestMentionMintsExactlyOneIDAndItIsTheDeliveryRows
  - adapters/integrations/slack/mention_test.go:TestTheModelCannotChooseWhoIsMentioned
  - adapters/integrations/slack/mention_test.go:TestAnEmptyRequesterSkipsTheMentionAndKeepsTheWords
  - adapters/integrations/slack/mention_test.go:TestAPublicationDisplayCannotBroadcast
  - adapters/integrations/slack/mention_test.go:TestAMentionRendersAsAnOrdinarySection
  - adapters/integrations/slack/blocks_test.go:TestNoFileButInteractionsMintsAnActionableElement
