input: "The console's approval UI shows the AUTHORITATIVE, model-independent detail the canonical approval.requested.v1 event ACTUALLY carries (§47.2, UI-002, packages/coordinator/publication.go): operation, branch, and request_hash — each surfaced from the event, not the model's prose. There is NO publications/approvals READ endpoint (apps/control-plane/api/router.go), so the event payload is all a real client receives. The proposal-supplied `display` string is rendered in a SEPARATE, explicitly non-authoritative region and NEVER substitutes for it: a soothing 'everything looks fine, safe to approve' does not stand in for the operation/branch the operator is authorizing. Approve drives a durable approve command through the /v1 relay and the run proceeds through recovery to completed; deny BLOCKS the side effect (the run terminates canceled, the push tool-completed frame never arrives). PROOF SEAM — E19 T7 MEASURED THE CEILING INSTEAD OF ASSERTING IT: the approval journey is proven ONLY over the FAKE upstream, and that is now a finding about the control plane rather than a choice about the tests. A run on a REAL compose stack cannot reach approval.requested.v1 at all, for FOUR independent verified reasons: (1) compose sets no PALAI_WORKSPACE_ROOT and mounts no shared workspace volume, so no repository is prepared and RunPublicationTarget finds nothing to publish; (2) the compose fake adapter is hardcoded with no ToolCalls and has no env knob, while a fresh project's config_policy is NULL, so NO tool is ever advertised and the model can never propose palai.publish.push; (3) THIS RATIONALE WAS TRUE WHEN E19 T7 MEASURED IT AND IS NOT TRUE NOW, and it is corrected here rather than left standing (E23 T7, D12): PendingBoundaryCommands filtered `kind IN (send_message, change_config)`, so an HTTP approve was accepted, sat queued and was expired at run terminal — command_pump.go's applyBoundaryApproval branch was UNREACHABLE from the public API and Slack was the only surface that could apply an approval. The query reads `kind IN ('send_message', 'change_config', 'approve', 'deny')` today (storage/queries/commands.sql) and the HTTP approve path is LIVE, which is also what makes HIL-004's project approver list load-bearing on that surface rather than theoretical. The other three reasons on this list are unaffected and still hold, so the ceiling this case states — a run on a REAL compose stack cannot reach approval.requested.v1 — is unchanged; (4) publishApproved runs only inside a live attempt's boundary pump. MEASURED, not inferred: POST /v1/sessions/{id}/commands {kind:approve} against the real stack returns 202 with status `rejected` and result.code `no_pending_approval`. WHAT THE REAL PROFILE DID NARROW: the console renders a REAL run end to end — a real /v1/responses create carrying the Idempotency-Key the real router requires and the fixture does not, a real SSE stream read off the real journal, and the real terminal Response projection — and the public-API-only crown now scans for a LIVE bootstrap credential rather than a sentinel. FIXTURE DRIFT IS NOW MECHANICAL (plan D15): apps/web-console/tests/conformance.test.mjs diffs the fixture's own route table and scripted event stream against the surface gathered from the RUNNING real router (405+Allow probing, real response shapes, a real run's journal); every difference must sit in an enforced ledger, and a ledger row that STOPS being a difference fails too. It found the E17 T10 invented-approval-event class is SIX instances, not one: five event types the fixture scripts (response.queued.v1, model_step.delta.v1, tool_call.proposed.v1, artifact.created.v1, usage.updated.v1) are journaled by no production code at all, and three routes the fixture serves are not registered by the real router. PUBLIC-API GAP (the E13-T10 modelRoutes-gap pattern, filed in the console README): richer approval detail — action/args/diff/destination/risk/expiry, or a publications read endpoint — is NOT carried by the event today; the console renders it when the API emits it. This is E19 T8 disposition input, not a console defect. HONEST CEILING: a DEPLOYED console is NOT claimed — COMPOSE IS NOT A DEPLOYMENT — and the manual VoiceOver/screen-reader pass is untouched. `console` stays preview and §6 operator leg 8 keeps both halves."
