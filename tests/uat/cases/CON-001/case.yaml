id: CON-001
name: console-requires-an-operator-identity-and-does-not-open-without-a-password
proof_class: e2e-deterministic
provider: fake
input: "The admin console asks for an identity, and does not serve without a password (E25 T1, CON-001). MEASURED FIRST, AS THE ATTACK: before this task the console had NO authentication of any kind — no middleware.ts, no proxy.ts, no login, no cookie — and the same spec passed in reverse. An anonymous client with no cookie jar read the organization list (200, real rows), started a run (202 with a session id), landed an approval command on that run (202), and had its PATCH, DELETE and TOOL-APPROVAL DECISION relayed to the control plane under the console's own server-side Bearer: ten authenticated upstream requests, zero unauthenticated, none of them from anyone. The key behind the relay is unlimited — `Scope.HasScope` (apps/control-plane/api/middleware/auth.go:31-34) returns true for every capability when the scope set is empty, and E23 T9's `approve` is held implicitly by exactly that key (apps/control-plane/api/approvals.go:32-34) — so an open origin meant every tool approval was decidable by any visitor. WHAT IS PROVEN NOW, on the LOCAL seam of the built console driven by a real browser against a deterministic /v1 upstream: (1) every exported relay method answers 401 authentication_required to an unauthenticated client — the four /v1 catch-all methods, the run-starting stream relay, the artifact byte download, and the approval decision route — and the upstream's own introspection shows ZERO additional /v1 requests while they are refused, so the door refuses rather than the upstream; (2) the gate lives INSIDE THE RELAY and a token-level audit of TypeScript's own scanner counts every exported HTTP method under app/api against the number that open with requireSession, requiring the two to be EQUAL — an ungated export FAILS, verified by adding one and again by the subtler defeat of a gate that is called but whose refusal is discarded; (3) the session cookie is httpOnly + Secure + SameSite=Strict + signed, carries only an expiry and a signature, is unreadable by the page's own scripts, and rides ZERO upstream requests; (4) a write with a foreign Origin — or with none — is refused 403 even WITH a valid session, while the same write from the console's own origin is not, so the refusal is about Origin; (5) a console process with NO PALAI_CONSOLE_PASSWORD_HASH serves nothing: every relay method 503 console_not_configured, no password opens it, zero upstream contact — asserted against a REAL second process that differs only in that variable; (6) a wrong password is refused in constant time with one message that names neither a field nor a state, and the login page is axe-clean under WCAG 2 A/AA with a role=alert refusal and current-password autofill. HONEST CEILING, and it bounds every line above: this is a SINGLE-OPERATOR DOOR, NOT AN IDENTITY SYSTEM — no users, no roles, no audit trail, no session revocation list, no sign-in rate limit, and the password hash lives in an environment variable rather than a KMS. The KEY BEHIND THE DOOR IS STILL UNLIMITED: docs/operations/console.md writes the `--scope provision --scope approve` recipe but the console is NOT proven to run under a narrow key, and HIL-P11 measured that an unconfigured config_policy.approvers permits every principal. An unconfigured console still serves its static shell 200, because the gate is in the relay by design and not in the layout. NOT CLAIMED: a DEPLOYED console, a manual screen-reader pass over this form, or any measurement against a real control plane — every proof here ran against the fake /v1 upstream. Those are §6 operator legs 1 and 4 and `console` stays preview; no tier advances on this case."
expect_status: completed
proof:
  - "apps/web-console/tests/auth.spec.ts:an unauthenticated client gets 401 from EVERY relay method — including the approval decision surface"
  - "apps/web-console/tests/auth.spec.ts:the correct password opens a session; the wrong one is refused in constant time and says nothing about which half"
  - "apps/web-console/tests/auth.spec.ts:the session cookie is httpOnly, Secure, SameSite=Strict — and invisible to the page's own scripts"
  - "apps/web-console/tests/auth.spec.ts:a write carrying a foreign Origin is refused 403 even WITH a valid session — the CSRF second layer"
  - "apps/web-console/tests/auth.spec.ts:FAIL-CLOSED: a console with no PALAI_CONSOLE_PASSWORD_HASH serves nothing — not a read, not a write, not a sign-in"
  - "apps/web-console/tests/auth.spec.ts:the login page is axe-clean and operable with the keyboard alone"
  - "apps/web-console/tests/relay-gate.spec.ts:every exported relay method passes through requireSession — an ungated export is a FAIL"
  - "apps/web-console/tests/public-api-only.spec.ts:every console request rides the /v1 relay — no privileged backchannel, no direct upstream/DB"
