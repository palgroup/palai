  - "apps/control-plane/internal/execution/jira_runbook_component_test.go:TestAForeignTenantsToolRevisionIsNotFound"
  - "apps/control-plane/internal/execution/jira_runbook_component_test.go:TestTheToolRevisionReadRoutesRequireTheProvisionCapability"
  - "apps/web-console/tests/mcp-tools.spec.ts:the tools screen says which decision it is, and offers nowhere to type a credential"
  - "apps/web-console/tests/mcp-tools.spec.ts:both pickers refuse to exist when there is nothing to choose, and say what to do instead"
  - "apps/web-console/tests/mcp-tools.spec.ts:an MCP connection is registered, discovered, approved with a gate, and pinned into a published set"
  - "apps/web-console/tests/mcp-tools.spec.ts:a tool description written by the upstream server is inert — no element, no navigation, no execution"
  - "apps/web-console/tests/mcp-tools.spec.ts:the approval gate defaults ON, and un-gating a tool is a deliberate click the screen then states"
