id: CON-007
name: an-mcp-connection-is-registered-discovered-and-its-tools-approved-from-a-screen
proof_class: e2e-deterministic
provider: fake
input: "An admin registers an upstream MCP server, discovers its tools, reads the untrusted description each one would put in front of a model, approves the ones they want with a human gate, pins them into a set and publishes it — from a screen, and over routes an operator could not previously reach (E25 T7, CON-007). MEASURED FIRST AS A SHIPPED DOCUMENT THAT COULD NOT BE FOLLOWED: docs/operations/jira-mcp-connection.md §3 has said since 2026-07-27 03:28 (684076e8) 'Approve the tools you want. Find the ids with GET /v1/tools, then publish each revision' — and GET /v1/tools has never returned a revision id (its projection is {id, object, canonical_name, model_visible_name}, and so is GET /v1/tools/{id}'s). The $REV_ID the next line put in a URL could be obtained only by reading the database, so THREE of the runbook's calls rested on one nobody could make. A component test that walks §3 with an HTTP client and a bearer token and nothing else (apps/control-plane/internal/execution/jira_runbook_component_test.go, component-real, against the SHIPPED router and a real Postgres) failed at that step with 405 — not 404, because the path was already mounted for POST: the tree could WRITE a revision at exactly the address it refused to READ one from. The instruction stood 3 days 13 hours 33 minutes and the file was edited three times in between; the third of those edits (E23 T5) made it WORSE by hanging approval_required and approval_label on the same unobtainable id, so the step that could not be performed became the step that also decided whether a human is asked. WHAT IS PROVEN NOW, on the LOCAL deterministic seam (a loopback fake /v1 upstream driven by a real browser against the built console) plus a component-real Go leg over the same public HTTP routes: (1) the runbook runs end to end on the PUBLIC API ALONE — register a connection with a credential HANDLE, discover, read the revision ids WITH the description and input_schema being approved, publish a read tool bodyless and a write tool with the gate and the operator's label, pin both into a set, publish it, read the set's PINS back, and grant the set and the connection to an agent revision that reads both fields back; (2) A FOREIGN TENANT'S TOOL REVISION AND SET REVISION ARE 404 for ids that exist, an unknown id is the same 404 (no existence oracle), and a set revision is NOT readable under another set's name; (3) both new routes are provision-gated while the shipped ungated GET /v1/tools is NOT retro-gated, and one test pins both halves of that asymmetry; (4) THE UNTRUSTED DESCRIPTION IS INERT, asserted by ATTACK rather than by claim: a fixture description carrying a <script> and an <a href> is driven onto the screen through the discovery path a real server's text would take, the payload is asserted PRESENT as characters, and then no script/anchor/img element exists in the cell, no anchor anywhere names the attacker's host, no navigation to it occurred, and the window flag the payload would set is undefined — with the token scan of every .tsx in the console (approval-queue.spec.ts) forbidding dangerouslySetInnerHTML outright; (5) THE GATE DEFAULTS ON FOR EVERY TOOL and un-gating is a deliberate click that the screen then STATES ('NOT required — this tool runs with no human in the loop'), which is HIL-P5 made visible rather than closed; (6) a refused publish is the server's own sentence in a role=alert region and NOTHING was published by the attempt — reachable because the operator label is capped at 300 characters; (7) the set's CONTENTS are read from the console through the second new route, which is the only place the public API says WHICH revisions a set grants (the list carries a digest, and a digest says two sets differ without saying how). FOUR MEASUREMENTS THIS TASK MADE THAT ITS OWN GUARDS FOUND, each a live defect rather than a tidy-up: agent_revisions listed mcp_connections (the CEILING, since E22 T6) and NOT tool_sets (the GRANT), so the runbook's own §4 warning that both fields are required had one of them readable — found at step (e) of the runbook test; T6's absence note on /agents blamed 'the two read routes that would list a tool revision and a tool set's contents' for two missing controls, but GET /v1/tool-sets and GET /v1/mcp-connections have been mounted since E13 T4 and only the revision list was genuinely missing, so half the sentence was wrong and it is repaired rather than deleted; config-journey.spec.ts asserted the ABSENCE of `revision-tool-sets-select` and `revision-mcp-connections-select`, two testids that have never existed in this tree in any epic, so that guard could not have failed and would have kept passing after the controls arrived; and the conformance sweep's seed map was flat while `{revision_id}` is the ONE overloaded wildcard in the fixture's route table — it handed GET /v1/tool-sets/{set}/revisions/{revision_id} an AGENT revision id, which the real route correctly 404s, which makes the item arm `continue` past it IN SILENCE. Seed keys are now pattern-scoped and the sweep's item floor rises 8 → 11 (tools, tool-revisions and tool-sets seeded on both sides through the MANUAL registry path, no MCP server involved). RevisePublish was MOUNTED, not duplicated: it gained publishPath-takes-the-revision (a set revision's publish path names its set — and the publish HANDLER ignores that segment, so closing over one set's name would have silently published another set's draft), an optional per-row publishBody (E23 T5's declaration rides the publish), and createPath==='' meaning 'list and publish, no create form'; it also now CLEARS while it loads, because switching lineages left the previous tool's rows under the new tool's heading with a publish button rendered against the wrong lineage. HONEST CEILINGS, FIRST BECAUSE THEY BOUND EVERY LINE ABOVE: (a) TWO READ ROUTES ARE NOT AN APPROVAL FLOW — who published a revision is recorded NOWHERE, so the decision is immutable and readable and not attributed; (b) `discover` reaches a REAL MCP server and a compose stack has none and must not acquire one, so every discovery leg runs on the fixture (DIV-UI-008, re-derived by the sweep from the real connection collection being empty) while the page, both empty states, both pickers and the absence of any credential field run on BOTH profiles; (c) there is NO DELETE and NO PATCH for an MCP connection — this console registers and reads, it does not correct; (d) HIL-P5 STANDS UNCHANGED — publishing a write tool without approval_required still silently skips the gate, and the console cannot classify write tools because the MCP specification says a server's own annotations are untrusted and our client does not decode them, which is why the default is ON for EVERYTHING rather than for writes (the plan asked for the latter and it is not implementable); (e) the console offers ONE set and ONE connection per agent revision while the API accepts several. NOT COVERED, and it is a §6 operator leg rather than a gap in this case: no real MCP server was ever dialled from a console (§6 leg 3), no DEPLOYED console, no manual screen-reader pass and no browser other than Chromium — what is proven is 'axe-clean with the WCAG 2.0+2.1+2.2 tags' and never 'accessible'. No tier advances on this case: there is no `mcp` capability and E25 opens none, and `console` stays preview."
expect_status: completed
