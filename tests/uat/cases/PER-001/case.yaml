id: PER-001
name: single-shot-and-sse-load-percentiles-and-error-rate-are-derived-from-raw-samples-behind-a-mandatory-profile
proof_class: component-real
provider: fake
input: "PER-001 measures three §54.3 latency objectives against the RUNNING control-plane binary over real HTTP — API metadata read (GET /v1/responses/{id}, target p95 < 300ms), accepted mutation (POST /v1/responses returning 202, target p95 < 500ms) and time to the FIRST SSE event (GET /v1/sessions/{id}/events, target p95 < 1s) — plus a run-wide error-rate ceiling of zero. The DELIVERABLE IS THE GATE MECHANISM, NOT THE NUMBERS (the E17 T6 eval-gate discipline): each §54.3 target is the default threshold and PALAI_PERF_MAX_<METRIC> overrides it, with the override recorded in the summary so a loosened run says so in its own evidence. THREE RULES ARE MECHANICAL. (1) NO NUMBER WITHOUT A PROFILE: a run that cannot stamp machine/cores/memory/OS/Docker-version/load-shape produces NO artifact at all — not even the raw samples — because a number with no machine behind it cannot be compared to anything (harness.ErrNoProfile; a whitespace stamp is refused too). (2) RECOMPUTE-OVER-COPY: raw observations go to samples.jsonl and every percentile in summary.json is DERIVED from those bytes by one documented method (nearest-rank, stated verbatim in every summary), with the samples digest carried alongside so E18 T10's PerformanceProfileProof re-derives them instead of trusting the copy. (3) A GATE THAT MEASURED NOTHING IS NOT A PASS: a threshold configured for a metric that produced no samples is recorded as a FAILING zero-count stat, so a vacuous gate cannot re-derive to green from the same artifacts. Failed attempts are recorded as samples with ok=false rather than dropped — dropping them is how a load test lies about its error rate. LOCAL SEAM: one control-plane process plus one PostgreSQL container on macOS + Docker Desktop, with DISPATCH DISABLED (E08 rule: the engine opens no tool to a real provider), so these are API + journal spine latencies — admission, read-back and stream start — and never model or engine time. §6 operator legs: these numbers carry NO SLO and NO reference-hardware claim (`no_slo_claim` and `reference_hardware: false` are stamped into every summary); §54.3's targets are PRODUCT GOALS whose real measurement on reference hardware, and the region/tier/environment segmentation §54.3 also requires, are E18 §6 operator leg 3. The load shape is a CONFIGURED concurrency, not a saturation search: 'under target load' means the shape stamped in profile.json and nothing beyond it. CARRIED AS `PER-1` IN THE RC TRIAGE: the profile stamps the machine but NOT co-tenant load, so two runs measured 100x apart look equally well-stamped — which is the second reason no number here carries an SLO, and why the thresholds are configurable."
expect_status: completed
proof:
  - tests/performance/per001_load_test.go:TestPER001SingleShotAndSSELoad
  - tests/performance/harness_test.go:TestHarnessWritesNothingWithoutAProfile
  - tests/performance/harness_test.go:TestHarnessRefusesAWhitespaceProfile
  - tests/performance/harness_test.go:TestHarnessPercentilesRecomputeFromTheRawSamples
  - tests/performance/harness_test.go:TestHarnessVacuousGateSurvivesIntoTheArtifact
  - tests/performance/harness_test.go:TestHarnessThresholdOverrideIsRecorded
# ceiling: run with `make test-performance TEST=service`. Docker-bound, so NOT in `make verify`.
