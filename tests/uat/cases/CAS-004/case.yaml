id: CAS-004
name: run-artifacts-reach-the-slack-thread-as-real-files
proof_class: component-real
provider: fake
input: "an artifact a run PRODUCED — a screenshot, a QuickTime screen recording, a build log — reaches the Slack thread as a real FILE rather than as a link to bytes nobody can open (E22 T5, plan §2). E20 T4 wrote this half down and refused it in as many words: 'FILE UPLOAD IS NOT BUILT (S14) … files:write is a new standing write access, and the iOS scenario does not exist yet'; E22 IS that scenario, so the scope is granted for the first time and the manifest says in plain words what a WRITE scope grants and what it does not. THE DELIVERY CHANGES, THE RENDER DOES NOT (X13): the file_ref block is byte-identical — same link, same URL validation, same inert-text fallback — and what is new is that the bytes now also arrive. The wire is the three DOCUMENTED steps in the documented order: files.getUploadURLExternal (filename + length, both required, so there is no streaming upload and an artifact must be sized before it is sent — X10) → a raw POST to the URL that call returned, carrying NO credential because that URL already is one → files.completeUploadExternal naming ONE channel and the thread's PARENT ts, which is the value slack_reply_deliveries already froze at enqueue, so NO NEW COLUMN was added (X11, verified before anything was added). `blocks` IS NOT SENT: no published page says this method's blocks array accepts a `markdown` block, and a vendor's silence is not a design freedom (X23) — the same fail-closed reading E21 T6 held for chat.stopStream. THE MODEL'S WORDS TRAVEL IN EXACTLY ONE FIELD, `initial_comment`, defused through the SAME NeutralizeBroadcasts the block and text paths use, and the sweep proving it JSON-DECODES first because encoding/json escapes `<` and a raw-substring assertion over marshalled bytes could never fail (E20 T4 paid for that lesson). THE EXTENSION IS A FACT ABOUT THE BYTES, never the name the model supplied: `simctl io recordVideo --codec=h264` still writes a QuickTime container (MEASURED on this machine 2026-07-28 — file(1) answers 'ISO Media, Apple QuickTime movie'), net/http cannot see it because the WHATWG mp4 signature matches only a brand beginning 'mp4', so the stdlib does the families it knows and an `ftyp`/`qt  ` check adds the one it structurally cannot — a model calling its recording demo.mp4 publishes nothing, the filename is the artifact id plus the sniffed extension. THE MODEL'S URL IS A NAME, NOT A FETCH TARGET: nothing dials it, the reference is scanned for an artifact id BY SHAPE (a near-miss — one hex short, one long, upper case, a longer token — resolves to nothing) and that id is read from our own object store under three keys the model does not hold: the tenant, the RUN (tenant scope alone would let this run publish a screenshot taken for somebody else's conversation in the same project), and the size, checked on the ROW before a byte is read. THE CEILING IS OURS, NOT THE VENDOR'S (X23: neither reference page prints a maximum, and that absence is recorded as UNCONFIRMED rather than papered over): 8 MiB, a constant with its reasoning, checked before the first call so an over-size artifact costs zero requests — and it is LINKED AND SAID, never silently dropped, which is why the resolution runs BEFORE the answer is posted so the refusal is a sentence a human reads. THE CANONICAL ANSWER IS NEVER AT RISK (SLK-006): the uploads happen after the reply lands and the delivery row is settled, so a workspace that never granted files:write, a refused upload and a Slack that is down all leave the run's answer exactly where it is — which also makes 'this method can only be called once' free, because a delivered row is never re-claimed. task_card.sources is filled with the pull request and the Jira ticket (X14b), and a URL source element is a LINK rather than an interaction — shown not by a comment but by the E20 sweep, the one that finds ApprovalMessage's two real buttons, running over a card carrying them and still finding nothing. HONEST CEILINGS, all three named: a file CANNOT be a video block (X12, structural — that needs a public, iframe-embeddable URL on one of the app's unfurl domains, which a Slack-hosted file is not), `files:read` is unchanged and no new read is taken, and the upload happens at RUN TERMINAL rather than during the run, so a long iOS build cannot be watched live. Every counterparty is the FAKE Slack peer built from the published references; §6 leg 1 — a REAL workspace receipt, and with it the three UNCONFIRMED questions (the bot token's true maximum upload size, whether `blocks` accepts a markdown block, whether a QuickTime recording plays inline) — is operator work and is NEVER claimed here."
expect_status: accepted
