id: SLK-009
name: one-run-is-one-visible-message-while-it-works
proof_class: unit
provider: fake
input: "a run becomes VISIBLE while it works and still produces exactly ONE message when it is done (E20 T1). A mention sets a working status through assistant.threads.setStatus — which needs `chat:write` and NO new scope (§3.5 S3), so it is the one gain an already-installed app gets with no reinstall — then the first journal step OPENS a stream with chat.startStream carrying BOTH recipient ids the published reference requires when streaming to a channel (S9; absent either, the call is not made and the answer falls back to a plain post), progress APPENDS ride chat.appendStream, and the terminal transaction CLOSES that same message rather than posting beside it: chat.postMessage is called ZERO times for a streamed run. EXACTLY-ONCE comes from admission, not from de-duplication in the follower: the follower starts only when the idempotency reservation reported Replayed==false, so Slack's documented three-attempt redelivery of one event_id opens exactly one stream. Over the concurrency cap the stream is SKIPPED and never the answer — the capped-out run still delivers one plain message. S11 is closed as a boundary rather than a feature: `stopped_by_user` stops the STREAM, the RUN KEEPS RUNNING, the thread is told so plainly, and the negative is enforced structurally by a source scan that fails if the follower so much as names AcceptCommand — a Slack UI affordance carries no authenticated actor and is therefore not run control. A failed run streams an HONEST terminal derived from the journal's own terminal event; a run that produced no output opens no stream at all. S12 is taken CONSERVATIVELY where two Slack pages contradict each other: blocks travel on chat.stopStream only. LOCAL seam: component-real against REAL PostgreSQL, the real coordinator and the real journal, with a FAKE Slack peer answering the envelopes the published references document. HONEST CEILING, and it is the most important sentence here: this is NOT token streaming — the journal has no delta event and E08 opens no tools to a real provider, so a REAL run is single-step and has exactly ONE thing to stream; every multi-append cadence proven here is driven by a FAKE ENGINE's journal events. A control-plane restart loses the stream's ts and the terminal lands as a NEW message. §6 leg 1: a REAL Slack workspace external receipt is operator work and is NEVER claimed here — `slack` closes PREVIEW, not stable."
expect_status: completed
proof:
  - adapters/integrations/slack/stream_test.go:TestStartStreamRefusesWithoutARecipient
  - adapters/integrations/slack/stream_test.go:TestStartStreamCarriesTheDocumentedArguments
  # S12 RE-POINTED 2026-08-05 — the blocks-mode pair (TestOnlyStopStreamCarriesBlocks,
  # TestAppendStreamSurfacesStoppedByUser) went with AppendStream/StopStream in `dfceb769`, which deleted
  # them as dead exports: every stream this relay opens sets TaskDisplayMode and is chunk-mode for life. The
  # chunk-mode pair asserts the SAME split at the same two calls — the closing call carries the content, the
  # append carries no body text — so "blocks travel on chat.stopStream only" is unmoved as a claim.
  - adapters/integrations/slack/stream_test.go:TestStopStreamChunksClosesAChunkStream
  - adapters/integrations/slack/stream_test.go:TestAppendStreamChunksSendsNoBodyText
  # S11 RE-POINTED 2026-08-05 — `stopped_by_user` is enforced in apps/slack-bot now, and proven there more
  # strongly than it was in the adapter: the notice is said exactly ONCE, the answer survives a stop
  # discovered mid-stream and one discovered at the close, and the code is proven to DISCRIMINATE (a
  # neighbouring Slack error is not read as a stop). The run keeping running is what all three assert.
  - apps/slack-bot/internal/relay/stopped_test.go:TestAStoppedStreamTellsTheThreadTheRunContinuesAndSaysItOnce
  - apps/slack-bot/internal/relay/stopped_test.go:TestAStoppedStreamStillDeliversTheAnswer
  - apps/slack-bot/internal/relay/stopped_test.go:TestTheStoppedCodeIsTheOnlyOneThatChangesThePath
  - adapters/integrations/slack/stream_test.go:TestStreamTextIsTruncatedVisibly
  # S3 WITHDRAWN 2026-08-05, and this one is a LOSS rather than a move — the only one in this case.
  #   - adapters/integrations/slack/agent_test.go:TestSetStatusCarriesTheDocumentedArguments
  #   - adapters/integrations/slack/agent_test.go:TestSetStatusCapsLoadingMessagesAtTen
  # `dfceb769` deleted slack.SetStatus itself, with agent.go and agent_test.go, because Socket Mode replaced
  # the HTTP bridge and nothing in production called it any more. Nothing in this tree calls
  # assistant.threads.setStatus today; the working indicator is the chat.startStream container headline
  # (apps/slack-bot/internal/relay/relay.go's setHeadline / PlanUpdateChunk). So the clause above — "A
  # mention sets a working status through assistant.threads.setStatus ... the one gain an already-installed
  # app gets with no reinstall" — is FALSE. The case text is shipped and left byte-for-byte; the clause is
  # recorded in evidence/superseded/slk-009-setstatus-2026-08-05.json, which also carries the live leg's
  # name (deliberately nowhere else, so that record's absence sweep can still measure it).
  # WITHDRAWN 2026-08-05 — the Slack cutover. The proofs below named files that were deleted with the
  # control plane's in-process Slack bridge (extensions/slack_*, api/slack*, the store's slack_*
  # component suites). Slack is served by apps/slack-bot now, a separate process that reaches this
  # control plane over `/v1`, so the mechanisms these lines proved are either gone or live in a
