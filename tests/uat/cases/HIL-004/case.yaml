id: HIL-004
name: approver-list-refuses-both-surfaces-in-one-function-and-is-absent-by-default
proof_class: component-real
provider: fake
input: "A project approver list refuses an unlisted Slack user AND an unlisted API key in the SAME function (ApplyApprovalDecision), admits a listed principal on either surface, reaches approvals already in flight when narrowed, and leaves a project with no list bit-unchanged. THE TASK CAME FROM A MEASUREMENT: `approvals.allowed_approver` has existed since migration 000013, exactly one line ever wrote it, no line in the tree ever READ it, and on the HTTP surface the concept of an approver did not exist at all — any tenant-scoped API key could carry an approve through. THE LIST IS A PROJECT POLICY, NOT A SLACK LIST: it lives in `config_policy.approvers`, which needs no migration because the JSONB column and its write path are shipped, and each surface maps its own identity onto ONE canonical principal — `slack:<team_id>:<user_id>` and `key:<api_key_id>` — in a single function, because a Slack user id is unique only inside its own workspace. THE CHECK IS IN THE ONE THROAT BOTH SURFACES PASS THROUGH, never in each caller: per-caller is how the next caller forgets it. The principal is stamped SERVER-SIDE from the verified identity at accept, so a request body naming its own approver names nothing. LIST PRESENT ⇒ DENY BY DEFAULT; LIST ABSENT ⇒ BIT-UNCHANGED, and the second half is non-negotiable and asserted rather than assumed: every deployment that has not configured this must behave exactly as it did, and an empty list is NOT the same value as no list. THE LIST IS READ LIVE, NEVER FROZEN AT ENQUEUE, and the reason is the tree's own: narrowing an allow-list is what containing an incident looks like, so a narrowing must take the buttons ALREADY POSTED with it — a removed approver's pending approval stops being decidable the moment the list changes. SLACK'S OWN `allowed_users` STAYS AND RUNS FIRST: it carries CHANNEL scope, which a platform-wide list cannot express, so there are two gates and both must be passed. A refusal RECORDS NO DECIDER and tells the clicker nothing (E19's rule: a readable refusal is a signal an unmapped user can probe). `palai up` says out loud when no list is configured, naming what is open — \"the HTTP approve surface is gated only by tenant-scoped key possession\" — because a silent skip is how a security default becomes a surprise. LOCAL SEAM: component-real — the REAL HTTP command adapter driving a scope from a REAL VerifyAPIKey into the REAL pump against real PostgreSQL, and the Slack half through the real decision bridge against a fake Slack peer; the two halves are asserted to refuse in the SAME function rather than in two. THE OPERATOR LEG THIS CASE DOES NOT COVER: §6 leg 1 — a REAL workspace where an unlisted human clicks Approve and is told nothing — is untouched and grew again. HONEST CEILING: PALAI HAS NO USER IDENTITY. A principal is a Slack id or an API key, not a person, and nothing links the same human's two identities across the two surfaces (`TEN-004` end-user token exchange is post-1.0). AND ONE APPROVAL IS ONE PERSON: two-person approval, which E18 T5's release ApprovalGate computes from CODEOWNERS, does not exist on this path."
expect_status: completed
