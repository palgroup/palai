id: A2A-003
name: input-required-maps-to-waiting-cancel-reports-uncertain-side-effect-push-config-crud-and-delivery
proof_class: e2e-deterministic
provider: fake
input: "The A2A task lifecycle maps onto canonical run states: a run awaiting input projects to A2A input-required (waiting_for_input). cancel issues a canonical cancel Command (monotonic, retry-safe) AND reports any non-cancelable uncertain side-effect honestly rather than claiming a clean cancel (§38.3). pushNotificationConfigs expose the CONFIG CRUD (set/get/list/delete) — the bearer token is stored and redacted on every read (never echoed back) under RLS, NOT a secret_ref handle — AND, since E19 T4, a real DELIVERY: a shipped Pusher POSTs an A2A StreamResponse (task | message | statusUpdate | artifactUpdate, never a bare Task) over the SAME signed egress-safe outbound sender the §21.6 webhook pump uses, inheriting its retry/dead-letter discipline. The client-supplied webhook URL is vetted through packages/egress plus a normalized whole-host allowlist, redirects are REVALIDATED per hop rather than blanket-denied, and every delivery carries a timestamp and a single-use notification id — plus, WHEN THE CONFIG CARRIES A TOKEN, an HMAC over the exact delivered bytes that the receiver verifies (tamper and cross-id replay both fail it). A config with no token gets the replay metadata and NO authenticity at all; that is the client's choice and it is never silently upgraded. The CRUD is mounted ONLY when a Pusher is wired, the same condition the Agent Card reads, so 'card says no push but CRUD returns 200 and nothing fires' is structurally impossible. A dead-lettered push never rewrites the canonical task. HONEST CEILING: the token HEADER IS OUR CHOICE — the A2A specification defines the token FIELD but names NO header for it — so this is an A2A StreamResponse payload with an application-specific token header, NOT 'spec-compliant push'; a foreign peer is not claimed to understand it. D12 names THREE mitigations and only two are implemented: the host allowlist and the egress firewall. OWNERSHIP VERIFICATION IS NOT IMPLEMENTED — nothing proves the client registering a target actually controls it, so a deployment open to untrusted registrants MUST set AllowedHosts; with the allowlist empty, any public https host a client names will be POSTed to. Delivery fires on the state-producing operations the server serves (send / stream / subscribe / cancel); there is NO asynchronous observer of run terminality, which would need durable per-target delivery state and therefore a migration. The pending set is in-process: a crash between accept and delivery drops the notification. LOCAL proof: a generic loopback HTTP client drives the input-required mapping, the cancel-with-uncertain-side-effect report, and the full push CRUD + a REAL delivery to a loopback HTTPS sink with SSRF/allowlist/redirect/tamper negatives, loss-less retry across a downed sink, and a dead-letter. §6 operator leg 2 (unchanged): a real delivery to a FOREIGN receiver + foreign-peer interop — loopback != interop, a2a stays preview."
expect_status: completed
