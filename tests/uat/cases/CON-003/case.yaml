id: CON-003
name: an-environment-reaches-the-agents-shell-and-no-human-surface-returns-its-value
proof_class: component-real
provider: fake
input: "An operator-authored environment reaches an agent's shell command, and no human-facing surface returns the value it carried (E25 T3, CON-003). MEASURED FIRST, AS AN ABSENCE, BECAUSE THE PIPE DID NOT EXIST: `EngineRequest.Env` (packages/runner/supervisor.go:87) has an allow-list, `^PALAI_[A-Z0-9_]+$`, whose ONLY non-test constructor never fills the field (packages/runner/serve.go:326) — so the allow-list had zero users — and what an agent's shell commands actually see came from two CLOSED lists whose comments read, verbatim, 'these are the COMPLETE environment' (adapters/sandboxes/host/exec.go) and 'no host inheritance, no credential' (adapters/sandboxes/oci/workspace/exec.go). The measurement: `printenv MY_KEY` through the production broker over the production host executor, with MY_KEY set in the CONTROL PLANE's own environment, printed NOTHING and exited 1. So an environment is a SHELL TOOL feature and not an engine feature, and `EngineRequest.Env` STAYS DEAD — nothing in this task touches it, which is written down so the next reader does not think the allow-list acquired a user. WHAT IS PROVEN NOW, on a component-real seam (a real PostgreSQL spine with real row-level security, the real AES-256-GCM secret store, the real tool broker, the real host executor running real processes on this machine; no fake anywhere between the write and the process): (1) an environment is created, two keys are written through the real store, an agent revision names it and is published, a run pins that revision, and a real `printenv` inside `palai.workspace.shell` sees BOTH keys — the value's whole journey is one write, one derived secret name, one decrypt, one process; (2) the derived name is `env:<environment_id>:<key>` and it is built in exactly one place (the SQL), asserted by resolving the value the Go store wrote through the name the SQL derived — a bare key name resolves nothing, so two environments each holding JIRA_TOKEN never share one credential; (3) the CLAIM is the capability-worker secret-handle pattern applied to a RUN: at attempt start the orchestrator takes only key NAMES from the PINNED revision, and the values are resolved ONE STATEMENT before the exec call — after the durable consult and after the approval park — so a run waiting for a human holds no credential in memory, and the map is handed to Execute and dropped; scope and expiry ARE the attempt, so there is no handle to redeem and no deadline to check; (4) an environment value enters NO durable row: the tool's committed result is read back out of the real tool_calls row and holds `***` where the value was, and the journaled config.revised payload carries neither the value nor the environment id, because an environment deliberately has no path into ConfigSnapshot at all (config.go's promise that a credential value never enters the snapshot is kept by construction rather than by redaction); (5) a key named PATH is refused at EXEC TIME by both sandbox adaptors, before any process starts, and the sandbox's own PATH is bit-unchanged after the refusal — the write route refuses it too, but the exec-time check is the load-bearing one because a route can change and this cannot be reached around; (6) a FOREIGN tenant cannot read, list, write into, or unbind another organization's environment, and cannot resolve its derived secret name even knowing it verbatim; (7) the no-value-comes-back property is tracked in three independent layers, each of which fails on a different mistake: a sweep pinning every query that touches `ciphertext` to exactly {InsertSecretRef, ResolveSecretRef} (shown failing by adding a plausible reveal query, which it named), an EXACT-SET field pin over three view projections (shown failing on a `Value` field — an absence-of-the-word check would have passed for Plaintext, Cleartext, Bytes and V), and the console byte scan which is T4's. A REAL HOLE WAS FOUND BY THE GUARD RATHER THAN BY REVIEW AND IS REPORTED AS MEASURED: the collision check first derived the reserved set from the environment the executor had BUILT, and the host executor builds its entries with os.LookupEnv — so on a Mac exporting no DEVELOPER_DIR, an environment key named DEVELOPER_DIR was ACCEPTED and would have chosen which Xcode the agent's `xcrun` resolved against. 'Not populated' is not 'not claimed'; the executor now declares its reserved names from the same two slices it builds from. HONEST CEILING, AND IT IS THE FIRST ONE BECAUSE IT BOUNDS EVERY LINE ABOVE: GIVING AN AGENT A SECRET IS THE AGENT HAVING THAT SECRET. What is proven is that no HUMAN surface returns a value and that the platform's own paths do not journal it. It is NOT proven, NOT claimed and NOT achievable that the agent cannot disclose it — the value-based redaction is a literal substring match, defeated completely by an agent that base64-encodes, splits or reverses it, and its own doc comment says so: real against accidental leakage (a build log echoing its environment, a curl printing its Authorization header), not against a hostile agent. SECOND CEILING (OWASP Secrets Management §2.6 Auditing, §3.5 N18(c)): WHEN a value was resolved and BY WHICH RUN is written nowhere — secret_refs keeps no read audit and no /v1 route exposes one — filed as CON-P3 and not closed. THIRD CEILING: the master key is still ONE key held in the process (PALAI_SECRET_MASTER_KEY_FILE), the H-SEC/SEC-001 class, unchanged. FOURTH CEILING: an environment is ORG-scoped, matching secret_refs, so two projects in one organization see the same environments — a product fact, stated on the screen T4 builds. FIFTH: an environment row can never be DELETED (no grant) and a key's removal removes the BINDING and not the bytes; the sealed versions are retained and unreachable, which the API says in words. `make generate` produced zero diff and that is a plan correction, not a skipped step — the canonical OpenAPI covers the LP-0 surface only and names neither secret-refs nor approvals nor runners. NOT COVERED: no browser touched any of this (T4 is the console half), and the proof ran against a component-real spine rather than a DEPLOYED stack — §6 operator legs 2 and 4. No tier advances on this case and no `environments` capability is opened: adding a member to CapabilityTierOrder would move CapabilityClaimsDigest and redden every case checksum in the committed release bundles."
