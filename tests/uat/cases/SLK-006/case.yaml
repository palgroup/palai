id: SLK-006
name: rate-limit-repairs-the-visible-message-once-canonical-survives
proof_class: unit
provider: fake
input: "a rate-limited outbound post is repaired by honoring Retry-After for a BOUNDED budget (default one repair) with the value clamped, then retrying the SAME body — the visible message is repaired once, not duplicated; a persistent 429 past the budget is a DELIVERY failure that leaves the canonical run result untouched (a Slack failure never erases the canonical result). LOCAL proof: the fake Slack peer 429->200 repair unit tests. WIRED (E19 T2): the repair now runs on the SHIPPED decision path against a local stand-in for slack.com/api over real HTTP — the visible message is repaired exactly once under a 429, a permanently rate-limited Slack leaves the canonical result intact, and coalesced updates are PACED PER CHANNEL (the D10 Special Tier requirement, roughly one message per channel per second, which the adapter alone never had). EXTENDED (E20 T1): the same single retry owner now carries the run STREAM's cadence too — chat.startStream/appendStream/stopStream ride the SAME bounded 429 repair and the SAME per-channel pacer rather than opening a second retry stack, so one throttled append costs exactly one repair and no more. HONEST CEILING: the single terminal summary per delivery remains the T11 journey's, and the stream is NOT token streaming — the journal has no delta event, so a real (single-step) run appends nothing beyond its opener; the multi-append cadence proven here is driven by journal events a FAKE engine produces. §6 leg 1: a REAL Slack workspace external receipt is operator work and is NEVER claimed here — the local seam is the FAKE Slack peer, so `slack` closes PREVIEW, not stable."
expect_status: completed
