id: BGT-004
name: an-exit-calls-the-model-back-exactly-once-and-a-run-that-never-stopped-is-not-interrupted
proof_class: component-real
provider: fake
input: "THE THIRD PROPERTY OF THE REPLICATED SEMANTICS IS THE ONE WITH THREE ANSWERS, NOT ONE, AND THE TWO THAT ARE NOT THE HEADLINE ARE WHERE THIS GOES WRONG. The headline is easy to state: a run parked because it left a build running re-enters when that build exits, and the turn the model sees carries the task id, the exit code, the output path and the last 2 KiB of that output — enough to decide WITHOUT a read call, which is what a notification is for. THE WAKE IS NOT WRITTEN, IT IS CALLED: wakeParkedRunTx is the same function an approve, a deny and the approval reaper all end in, so this is E23 T1's choreography's THIRD user and not a fourth copy of it — waiting to running plus an EnqueueJob, in the transaction that justified it, and a no-op on a run that is not waiting. THE SECOND ANSWER IS A RUN THAT NEVER PARKED, because the model is still working, and interrupting it would be a SECOND ATTEMPT OF ONE RUN. So the command is enqueued EITHER WAY and the wake happens only if the run is `waiting`, both in ONE transaction: the proof resumes the run through the shipped transition before its task exits, then asserts the run is still `running`, that NOT ONE additional response.run job was enqueued, that the notice is nevertheless queued, and that the next boundary of the attempt already running folds it in — three assertions in one function because any two of them alone are satisfied by a broken build. THE THIRD ANSWER IS A RUN THAT IS ALREADY TERMINAL, and it is reached the production way rather than by writing a row: a `failed` terminal does NOT park (T3), so the run ends while its task keeps compiling. There is no model turn left for the notification to fold into, and it is NEITHER queued NOR dropped — queued, it would sit until the terminal sweep expired it unread; dropped, it would be the silent loss every line of known-gaps refuses. The row is stamped (state `exited`, exit code 7, notified_at set, so no tick retries it forever) and the session journal takes a warning.raised.v1 with code `background_notice_orphaned` carrying the task id, the exit code and the output path — the same event type this tree already uses for a queued message that will not be delivered the way its sender expected. EXACTLY ONCE IS A ROW AND NOT A MUTEX, and the proof is built so a mutex could not pass it: two reconciler ticks, TWO CONTROL PLANES (a second store handle, orchestrator and host executor over the same database, swept CONCURRENTLY from four goroutines) and a CRASH-RESTART (a plane constructed afterwards, which never saw the spawn) produce ONE background_notice command and ONE response.run job. The key is a single-winner UPDATE on background_tasks.notified_at, and its load-bearingness is a measurement rather than a claim: removing `notified_at IS NULL` from that statement produces FOUR notifications. Two more guards were mutated and both reddened — deleting the terminal-run branch queues a notice against a run that cannot read it, and making the enqueue conditional on `waiting` loses the notification for a run that never stopped. AND A FOURTH MUTATION PINS THE TRAP THIS TREE HAS ALREADY FALLEN INTO ONCE: dropping `background_notice` from PendingBoundaryCommands' kind list delivers ZERO frames while every other assertion still passes, which is exactly how approve/deny were accepted, sat queued and expired unread until somebody noticed. THE ENGINE DOES NOT CHANGE, and the honest ceiling that follows is written where a reader meets it: the notification folds in with a USER TURN ROLE (commands.py's queue_delivery appends role user), so the model cannot tell it from something a person typed. The text starts with a fixed `[palai:background]` prefix and that is A CONVENTION A PROMPT CAN BE WRITTEN AGAINST, NOT A CONTRACT THE PROTOCOL ENFORCES; the upgrade path has a name — a role/source field on message.deliver — and it is a protocol version, not this epic. THE SWEEP IS THE ONLY PATH AND THAT IS A DECLARATION: on a stack with PALAI_DISPATCH_WORKERS=0 the reconciler is never built (main.go returns above it) and NO notification ever lands. The shipped deploy/compose/compose.yaml defaults that variable to 0. Three facts are pinned together — production's own reading of the variable, the compose file's value read from the file, and the runbook's FIRST paragraph — so that if any one moves the test says which. Everything above is driven end to end through the shipped path: the task is started BY TOOL NAME through the production dispatcher, it finishes by exiting 7 on its own when a sentinel file it polls for appears, liveness is `kill(-pgid, 0)` and never our own bookkeeping, the sweep is Reconciler.Sweep beside the other five with the same non-fatal discipline and no sixth loop, and the delivery is pumpCommands at a real boundary. NO TIER ADVANCES, for the reason T1 gave and T2 and T3 repeated: making a tool asynchronous is not evidence about the plane that tool runs on."
expect_status: completed
