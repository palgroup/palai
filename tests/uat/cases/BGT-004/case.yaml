  - apps/control-plane/internal/execution/background_wake_component_test.go:TestARunningRunIsNotInterruptedAndTheNoticeFoldsAtTheNextBoundary
  - apps/control-plane/internal/execution/background_wake_component_test.go:TestATerminalRunsBackgroundNoticeIsStampedRatherThanDropped
  - apps/control-plane/internal/execution/background_wake_component_test.go:TestWithoutTheReconcilerSweepNoBackgroundNoticeEverLands
