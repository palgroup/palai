id: FLC-001
name: a-pool-can-be-created-a-posture-chosen-and-strict-mode-switched-on-and-before-this-none-of-the-three-could-be-done
proof_class: component-real
provider: fake
input: "E24 SHIPPED EIGHT TASKS OVER A FLEET WHOSE POOLS COULD NOT BE CREATED, AND THIS CASE IS THAT HOLE CLOSED. The measurement first, because the feature is uninteresting beside it: `POST /v1/runner-pools` was not in the route table (`api/router.go:359-392` mounted four reads and four writes and no create); `grep -rn \"UPDATE runner_pools\" storage/ apps/ cmd/ packages/ | grep -v _test | wc -l` answered 0; and the ONE statement that wrote a pool row, `InsertDefaultRunnerPool`, wrote `'default'`, `'sandboxed-linux'` and `false` as LITERALS. THE CONSEQUENCE IS THREE-LAYERED. A second pool could not exist — every tenant got exactly one at birth. An `unsandboxed-host` pool could not exist, so the rented Mac the posture column was added FOR was unreachable: `000045` declares `CHECK (posture IN ('sandboxed-linux','unsandboxed-host'))` and no code path could ever write the second value. And `strict_enrollment` could not be switched on, which means E24 T6's `POST /v1/runners/{runner_id}/approve` — correctly written, correctly gated on `approve` rather than `provision`, with a correct argument in its own comment for why a `provision` key must not decide — WAS THE DECIDER OF A STATE NO OPERATOR COULD PRODUCE. `FLT-P12` said *the waiting room exists and nothing is in it unless an operator asks*; the operator could not ask, and the two places that turned the switch on were two TEST FILES issuing raw `UPDATE runner_pools`, which is this repository's own rule — a test that builds its own configuration never sees the configuration production builds — in its purest form. TWO CODE COMMENTS HANDED THE WORK AWAY AND NEITHER OWNER TOOK IT: `api/router.go:363` and `storage/queries/runners.sql:186` both said *creating and deleting a pool is T5/T6's*, T5 shipped the machine lifecycle, T6 shipped the waiting room, and pool creation was in no task's acceptance. Both sentences are corrected here and the new ones name NO owner, because a comment can state what is true and cannot schedule work. WHAT IS PROVED, and every step of it through the PUBLIC API with a bearer token over the shipped mux: a pool is created with posture `unsandboxed-host` and `strict_enrollment` on; the ROW is read back, not just the response, because a projection that reported a posture the database did not hold would place runs by one value and answer an operator with another; an enrolment key is minted through the public route; a real machine enrols over a real mTLS wire against a real PostgreSQL and lands `pending`; it INHERITS the pool's posture, which is what makes a pool's posture mean anything; a Dial into that pool answers `ErrPoolHasNoRunner` and the machine is offered nothing, so the waiting room is structural rather than a comparison; `POST /v1/runners/{id}/approve` moves it to `active` — THE FIRST TIME IN THIS TREE THAT ROUTE HAS BEEN REACHED OVER HTTP WITH A MACHINE AN OPERATOR'S OWN POOL PRODUCED — and the same machine then relays a run's engine frame through the lease it is given. THE PROJECTION IS ONE SHAPE: create, patch and list render through a single function, so a create cannot answer in a shape the read will not repeat. THE REFUSALS ARE NAMED: a duplicate name is a 409 built from `000045`'s UNIQUE index rather than a 500 telling an operator their control plane is broken, a posture outside the two is a 400 from the ROUTE (the database's CHECK is the last defence, not the first), an unknown field is refused rather than ignored, and a run-only key gets 403 on both writes. `posture` IS NOT PATCHABLE AND THAT IS A CORRECTNESS REQUIREMENT RATHER THAN A LIMITATION: `internal/fleet/store.go` makes an enrolling machine INHERIT the pool's posture, so moving a populated pool's posture would retroactively change what the machines already in it ARE. AND `FLT-P14` CLOSES AS A RIDER: `RunnerGateway.Waiting(poolID)` counted the attempts queued for a pool with no free machine from E24 onward and NOTHING READ IT — the fifth surface this repository shipped with no production caller — so the question it was written to answer, why is nothing running in my Mac pool, still had no answer. It is now a `*int64` on the AUTHENTICATED pool read, which is the placement the gap row named itself and not `/healthz/runner` where its unauthenticated sibling lives, because pool ids are tenant-scoped names. A POINTER, `ActiveLeases`'s pattern verbatim: could-not-ask and nothing-waiting are different answers. The assertion is a NUMBER and not a field — it was shown red against a constant zero — and the reachability sweep's NAMED exception is DELETED, which that sweep makes unskippable by failing when a listed symbol gains reach. HONEST CEILINGS, four, and the last is the largest. CREATING A POOL DOES NOT PROVE A MACHINE IS IN IT: this admits a fake runner built from the shipped enrolment package, not a rented Mac, and §6 leg 1 is open. `FLT-P2` STANDS: a declared posture is COMPARED, not verified, so an `unsandboxed-host` pool does not stop a Linux container calling itself one — there is no attestation, and strict mode asks WHO enrolled a machine, never WHAT it is. `FLT-P13` STANDS: an approval admits an ENROLMENT rather than a MACHINE, so a strict pool asks again after every reboot. AND `FLT-P15` STANDS, which bounds what all of this is worth: a `lease.offer` carries the ENGINE, every TOOL still runs in the control plane's own process, so THIS TASK MAKES A MAC POOL CREATABLE AND THAT POOL STILL DOES NOT RUN `xcodebuild` ON A MAC. The final assertion here is an engine frame and not a shell call for exactly that reason — asserting a shell call over this lease would assert a relay this tree has not built."
expect_status: completed
