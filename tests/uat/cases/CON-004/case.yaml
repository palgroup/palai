id: CON-004
name: a-value-typed-into-the-console-comes-back-in-no-dom-node-no-response-body-and-no-source-map
proof_class: e2e-deterministic
provider: fake
input: "A configuration surface takes a secret VALUE from a browser and returns it nowhere — proven as an ABSENCE, three ways, and the third way caught a leak the first two passed over (E25 T4, CON-004). THIS IS THE SCREEN THIS PLAN'S OWN ANCESTOR REFUSED, and the refusal's own measurement is what permits it (§3.6 D1): phase-23 counted four extra exposures a value-taking form adds — the browser process, the DOM, autofill, and verbatim 'the real issue — an origin that today has no identity' — and concluded the console must never take a value. Three of the four are now NAMED by a published vendor token and the fourth is what E25 T1's login closed; and what that plan never measured is that the un-readability is TRACEABLE IN THE TREE (exactly two queries touch `ciphertext`, the one that decrypts is reachable from no /v1 route, and the database carries `REVOKE UPDATE, DELETE` on secret_refs). A form that round-trips a value and a field that never renders back are different designs. MEASURED FIRST, AS THE ABSENCE OF A SCREEN: a spec that writes an environment value through the console and then hunts for it was RED four times over on 'no such page' before T4 existed, so its greenness is the proof and not a description of one. WHAT IS PROVEN NOW, driven by a real browser against the built console on the LOCAL deterministic seam (a loopback fake /v1 upstream) and re-run against a real compose control plane on the real profile: (1) an environment is created, a key is written, the key is ROTATED and then UNBOUND, all from the browser, all through the same relay, with the API key never leaving the server; (2) the value appears in NO DOM NODE — the scan reads the whole serialized document PLUS every input's live `.value` property, because `outerHTML` does not carry what an operator just typed and a scan that missed exactly that field would have been the vacuous one; (3) the value appears in NO RESPONSE BODY the browser received, counted (fifteen bodies retained and scanned, and a run that retained none FAILS rather than passing); (4) the value appears in NO BROWSER-SERVED ASSET, enumerated by walking `.next/static` recursively — every file there is fetchable at /_next/static/... — which on this build is twenty-five assets of which TEN are source maps, and the presence of source maps is itself asserted because `productionBrowserSourceMaps` could be switched off and leave this arm scanning nothing. EACH OF THE THREE ARMS WAS SHOWN TO BITE, AND THE THIRD BIT ALONE: a `<button data-testid=\"reveal-value\">Show value</button>` added to the page was NAMED by the absence assertion (it printed the offending control's text and test id); the value echoed into the form's own status message was caught in the DOM; and a sentinel planted in a source COMMENT — stripped from the minified chunk, carried verbatim in the map's `sourcesContent`, and never fetched by any browser — was caught by the source-map arm while the DOM and response-body arms both passed, naming the exact `.js.map`. That is the arm's entire reason to exist and it is now a measurement. (5) THERE IS NO REVEAL CONTROL, and the absence is ASSERTED rather than eyeballed: every button, link, role=button and summary on the page is enumerated and matched — label AND test id — against reveal/unmask/show-value/view-value/copy-value/plaintext, six controls found and zero offending, and the enumeration FAILS if it finds no controls at all. The absence is also STATED on screen in words, because an operator who cannot read a value back must be told before they lose it. (6) ROTATE IS THE SAME ROUTE AS CREATE, asserted on the WIRE and not on a label: two writes, one path, one method, and the version moves 1 -> 2 — which is the only observable difference between the two operations, `secret_refs` being append-only (§3.6 D13). (7) UNBINDING REMOVES THE BINDING AND SAYS SO: the confirmation dialog names the key and says 'not the stored value' in those words, the key drops from the list, and the console then reports the SERVER's own sentence about what was removed rather than authoring its own claim about whether a credential still exists. (8) THE ENVIRONMENT PICKER NEVER DEGRADES TO A FREE-TEXT BOX. With environments present it is a `<select>` whose options are asserted EQUAL to the set the API's own list returned, so the console cannot offer an id the control plane has never heard of; with none, the control does not exist at all — a refusal with a link to the create form, no label pointing at nothing, and the value form's text inputs enumerated to prove no hand-rolled id box took its place. The empty half is its own test with the list response stubbed at the browser boundary, DELIBERATELY, because branching on 'whatever the upstream happens to hold' would have been a skip in disguise: a fixture this suite has written to is never empty again and a real stack's contents are unknowable. (9) THE FIELD ITSELF is `type=\"password\"` with `autocomplete=\"new-password\"` read off the LIVE field, it is UNCONTROLLED (no `value` attribute, so the secret is a DOM node and not React state, and there is no render closure holding it), it CLEARS on submit — success or refusal, because a secret left in a form after a 400 on a screen the operator walks away from is the leak this design exists to avoid — and it BLOCKS NEITHER PASTE NOR COPY, asserted over the component's actual PROPS after the first draft of that check scanned the source TEXT for 'onPaste' and failed on the component's own comment saying it has none, which is this tree's substring-comparison defeat arriving as a false positive for once. (10) every page the console declares is still axe-clean under the WCAG 2.0+2.1+2.2 tags, three of three, because adding a route to lib/routes.ts generates its scan (E25 T2). HONEST CEILING, FIRST BECAUSE IT BOUNDS EVERY LINE ABOVE: THE VALUE PASSES THROUGH THE CONSOLE'S NODE PROCESS, ONCE, IN MEMORY. The relay is a pass-through and there is no way to type a credential into a browser and have it reach a control plane without crossing the process serving that browser; the mitigations are TLS, `Cache-Control: no-store` on every environment response, and a relay that logs no request body anywhere — all three written down in docs/operations/environments.md rather than implied. SECOND CEILING (§3.5 N19, filed as CON-P5): WHETHER A PASSWORD MANAGER OFFERS TO SAVE THE VALUE WAS NOT MEASURED and is claimed in no test, no doc sentence and no bundle field. MDN documents `new-password`'s effect on FILLING and its sentence about save offers is scoped to 'a site's login form', which this is not; no browser publishes its heuristics. A vendor silence is not a design freedom, for the fifth time in this tree. `off` was not chosen and would have been worse — browsers ignore it on password fields and MDN reserves it for CAPTCHA and one-time-token fields — and a test fails if the component ever carries it. THIRD CEILING: an environment is ORG-scoped (§3.6 D12), so two projects in one organization see the same environments and any key that can provision can read every key NAME and write every value; the screen says so. FOURTH CEILING: giving an agent a secret is the agent having that secret — this case proves no HUMAN surface returns a value, never that an agent cannot disclose one. FIFTH CEILING: when a value was resolved and by which run is written nowhere (CON-P3, open). NOT COVERED, and it is a §6 operator leg rather than a gap in this case: no DEPLOYED console, no manual screen-reader pass, and no real browser other than Chromium — what is proven is 'axe-clean with the WCAG 2.0+2.1+2.2 tags' and never 'accessible'. No tier advances on this case and `console` stays preview."
expect_status: completed
proof:
  - "apps/web-console/tests/secret-never-returns.spec.ts:a value written through the console appears in no DOM node, no response body and no source map"
  - "apps/web-console/tests/secret-never-returns.spec.ts:no control on the environment screen offers to reveal a value, and the screen says why"
  - "apps/web-console/tests/secret-never-returns.spec.ts:rotate is the same route as create and it moves the version; unbinding drops the key from the list"
  - "apps/web-console/tests/secret-never-returns.spec.ts:the environment picker is a select over the ids the list returned, never a free-text box"
  - "apps/web-console/tests/secret-never-returns.spec.ts:with no environments the picker does not exist at all — a refusal with a link, not a text box"
  - "apps/web-console/tests/secret-never-returns.spec.ts:the value field is a new-password password field and is uncontrolled"
  - "apps/web-console/tests/unit.spec.ts:SecretField does not block paste or copy, and asks for new-password rather than off"
  - "apps/web-console/tests/a11y.spec.ts:every route lib/routes.ts declares was actually scanned by axe"
