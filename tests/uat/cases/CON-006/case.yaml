id: CON-006
name: a-stranger-registers-a-repository-and-an-agent-from-the-console-and-runs-it
proof_class: e2e-deterministic
provider: fake
input: "A stranger stands up a repository binding and an agent from a screen, binds the agent to an environment, publishes it, and RUNS it — and the run's shell receives the environment's keys (E25 T6, CON-006). MEASURED FIRST AS THE ABSENCE OF TWO PAGES: six of this case's seven browser legs failed on `getByTestId('panel-agent-profiles')` / `panel-repository-bindings` finding no element, because `/agents` and `/repositories` answered 404 — while POST /v1/repository-bindings has existed since E09 T10, POST /v1/agents and the revision/publish routes since E11 T1, and all three read halves since E13 T4. What `palai up` leaves behind without a Slack credential is ZERO repository bindings and ZERO agents, so until these pages existed the only way to get either was `curl`; and since Palai's promise is an agent that writes code, a deployment with no binding has no coding run at all. WHAT IS PROVEN, driven by a real browser against the built console on the LOCAL deterministic seam (a loopback fake /v1 upstream) and re-run against a real compose control plane on the real profile: (1) a repository binding is registered from the form with the FULL body — provider, repository_identity, clone_url, default_branch, connection_ref, allowed_operations, policy, data_classification, region_constraint — and READS BACK on the list, so this is not a write-and-pray form; (2) `connection_ref` IS A HANDLE AND CANNOT BE TYPED: the binding form's free-text fields are ENUMERATED and matched against an exact set, so a connection-ref or credential box anywhere in it fails, the form carries no password field at all, and the ref is chosen from GET /v1/secret-refs whose read projection is {name, object, version, updated_at} with no value and no parameter that would ask for one — asserted STATE-INDEPENDENTLY, because a bootstrap compose stack's secret_refs collection is EMPTY while the fixture's is not, and a spec that required options would have been a skip in disguise; (3) an agent lineage, a DRAFT revision naming an environment CHOSEN FROM A DROPDOWN, and a publish — all three from the screen; the revision reads back with its model, its environment id and its state, and the publish control is GONE from a published row because publishing is irreversible and a second publish is not a thing to offer; (4) THE ENVIRONMENT PICKER NEVER DEGRADES TO FREE TEXT: with the list stubbed EMPTY at the relay boundary — the state a real organization is in on its first day and can never return to — the control does not exist at all (not disabled, not empty: absent), a note with a link to /environments stands in its place, and the revision form's free-text fields are enumerated so a hand-rolled 'environment id' box would fail; (5) A RUN STARTED WITH A PUBLISHED REVISION CARRIES THAT REVISION'S MODEL IN ITS TERMINAL PROJECTION, compared against the model the API itself reports for that revision rather than against what was typed; (6) A RUN STARTED WITH AN UNPUBLISHED REVISION IS REFUSED HONESTLY AND NOTHING FALLS BACK: the draft is OFFERED AND LABELLED rather than hidden (hiding it would make the refusal unreachable from the console, and an operator who cannot see their draft cannot tell why their agent will not run), the server's own 409 sentence appears in a role=alert region, the console adds that no run and no session were created and that no default configuration was substituted, and NO 'Terminal result' panel is rendered for a run that has no terminal; (7) THE PIN IS OPTIONAL AND THAT IS ASSERTED ON THE WIRE: with no revision chosen the stream relay's request body is exactly {prompt} and the upstream body exactly {input} — an outcome assertion would have passed even if the console had begun sending an empty string — which is why tests/journey.spec.ts needed NO EDIT and its four tests stayed green untouched. AND THE LOOP T3 OPENED IS CLOSED, over the SAME HTTP ROUTES these screens call and with no SQL below the tenant seed (apps/control-plane/internal/execution/console_environment_run_component_test.go, component-real): an environment, two values, a repository binding, an agent, a revision naming that environment and a run pinned to it are ALL created by public HTTP calls, and then a real `printenv` inside `palai.workspace.shell` over the production host executor sees BOTH keys — masked, because value-based redaction masks any value, and the exit code is what proves they arrived. That test also counts what a refused draft pin left behind: zero runs. THREE MEASUREMENTS THIS TASK MADE THAT ITS OWN GUARDS FOUND, reported because each was a live defect rather than a tidy-up: the fixture APPENDED a created agent to a twenty-one-row collection while ListAgentProfiles orders `created_at DESC` — so a newly created agent landed behind defaultPageLimit and the console's own picker could not offer the agent an operator had just made (ORDER is not a shape, so the conformance sweep could never have found it); the fixture's agent-revision row said `published: true` where the real projection says `status: \"published\"` and carried none of agent_id/revision_number/mcp_connections/environment/instructions, hidden because DIV-SHP-005 recorded an envelope difference on that route and an envelope difference SUBSUMES the item comparison — closing that row is what made the shape checkable and is part of raising the sweep's item floor from six to nine; and tests/pagination.spec.ts asserted three fixture CONSTANTS (`agt_20`, `agt_21`, `?after=cur_20`) that held only while nothing could create an agent, so its greenness was a property of which file ran first — the same file-order trap E25 T4 already paid for once — and it now asserts the cut is 20 whatever the collection holds, that the second page is DISJOINT from the first, and that every continuation carried a cursor a RESPONSE actually offered. HONEST CEILINGS, FIRST BECAUSE THEY BOUND EVERY LINE ABOVE: (a) REGISTERING A REPOSITORY BINDING DOES NOT PROVE THE REPOSITORY IS REACHABLE — nothing is cloned on that screen, no credential is exercised and no permission is checked; the first thing that exercises a binding is a run, and the screen says so; (b) the revision's `tool_sets` and `mcp_connections` are LEFT EMPTY until E25 T7 and NO CONTROL FOR THEM IS RENDERED, because the two read routes that would list a tool revision or a tool set's contents do not exist — an empty dropdown is a control that cannot be satisfied, and the absence is a sentence on the page and an asserted absence in the spec; (c) THERE IS NO DELETE AND NO PATCH on either surface (api/router.go mounts one POST and two GETs for bindings, and no PATCH for agents), so this console creates and reads, it does not correct — stated on screen, because an operator who believes a wrong binding can be fixed will not register a replacement; (d) THE PINNED MODEL CANNOT BE OBSERVED ON A COMPOSE STACK and the crown leg therefore runs on the fixture profile only: main.go's modelBrokerFromEnv builds fake.Adapter{Script:{Model:'fake'}} and the adapter returns Script.Model verbatim whatever it was asked for, so a pinned run reports the same model an unpinned one does — recorded as DIV-UI-007 and RE-DERIVED by the conformance sweep from a real revision-pinned run on every sweep, together with the half that DOES hold there (the 409 for a draft, which can only come from the server having resolved the id); (e) neither console profile can show the environment reaching a shell, because no console profile reaches a tool call at all — the fake upstream scripts its events and the compose adapter has no ToolCalls (DIV-UNX-001) — so that half is the component-real test above and the browser's claim ends at the writes; (f) the pickers read page ONE of each collection and say so in words when more exist, rather than offering a continuation nobody would use to pin an old revision. NOT COVERED, and it is a §6 operator leg rather than a gap in this case: no DEPLOYED console, no manual screen-reader pass, no browser other than Chromium — what is proven is 'axe-clean with the WCAG 2.0+2.1+2.2 tags' and never 'accessible' — and no real repository was ever cloned, which is §6 leg 5's neighbour: a real provider, a real credential and a real clone remain the owner's leg. No tier advances on this case and `console` stays preview."
expect_status: completed
proof:
  - "apps/web-console/tests/config-journey.spec.ts:a repository binding is registered from the console and reads back on the list"
  - "apps/web-console/tests/config-journey.spec.ts:the connection ref is a HANDLE chosen from the secret-ref list, never a typed value"
  - "apps/web-console/tests/config-journey.spec.ts:an agent, a revision bound to an environment, and a publish — all from the console"
  - "apps/web-console/tests/config-journey.spec.ts:the environment picker on the revision form does not degrade to free text when there is nothing to pick"
  - "apps/web-console/tests/config-journey.spec.ts:a run started with a PUBLISHED revision carries that revision's model in its terminal projection"
  - "apps/web-console/tests/config-journey.spec.ts:a run started with an UNPUBLISHED revision is refused honestly and falls back to no default"
  - "apps/web-console/tests/config-journey.spec.ts:a run with NO revision behaves exactly as it did before — the pin is optional"
  - "apps/control-plane/internal/execution/console_environment_run_component_test.go:TestAConsoleWrittenEnvironmentReachesTheShellOfARunItPinned"
  - "apps/web-console/tests/pagination.spec.ts:a collection larger than one page shows 20 rows, SAYS more exist, and continues with ?after="
  - "apps/web-console/tests/a11y.spec.ts:every route lib/routes.ts declares was actually scanned by axe"
