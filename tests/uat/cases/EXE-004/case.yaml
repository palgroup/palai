id: EXE-004
name: the-runner-runs-natively-on-the-mac-and-the-container-runner-is-refused-from-two-independent-directions
proof_class: component-real
provider: fake
input: "MOVING EXECUTION TO THE MACHINE MADE THE SHIPPED MAC DEPLOYMENT WORSE BEFORE IT MADE IT BETTER, and this case is the repair. `palai up --native` made the CONTROL PLANE a native process and left postgres, the object store AND THE RUNNER in Docker. That was harmless while the control plane executed every tool — a Mac was a Mac because the control plane was on it, which is exactly what E24's published bundle says. The moment execution moved to the lease-holding machine, `palai.workspace.shell` on the one shipped Mac deployment started running inside a LINUX CONTAINER, where there is no Xcode. WHAT IS PROVED, on a local seam and by driving the shipped bring-up's own derivation rather than a probe written for the test: the runner starts NATIVELY on the Mac, last in the bring-up order and stopped first on teardown; it carries the shell posture and the workspace root; it has its own pid and log files, because two pids in one file blind the reuse guard; and the container runner is refused from TWO INDEPENDENT DIRECTIONS — the CLI's canonical service list does not contain `runner`, and the overlay puts the compose service behind a `container-runner` profile — so changing either one reddens the other. THE DIAL ADDRESS AND THE VERIFIED IDENTITY ARE SEPARATE FIELDS, which is what makes this work without editing `/etc/hosts`: the certificate carries exactly one SAN (`control-plane`) and the runner demands exactly that name, so the runner dials `https://127.0.0.1:<port>` while verifying `control-plane` as the TLS ServerName. READINESS IS THE CONTROL PLANE AND NOT THE PROCESS TABLE: `cmd/runner` calls `log.Fatalf` on a failed enrolment, so `the pid is alive` means only `it has not fallen over yet`; the gauge that counts sessions the gateway HOLDS is what is scraped, and the scraper skips `# HELP`/`# TYPE` because parsing the word `gauge` as a session count would report a runner that never connected as up. AND ONE MEASUREMENT CORRECTED A RECORDED BELIEF THAT WOULD HAVE BLOCKED THIS CASE: orphaning does NOT lose the bootstrap namespace — a child reparented to pid 1 keeps the namespace of whoever started it, so the constraint is on the CALLER (`palai up --native` must be run from a live user session), not on the spawn. That is why `whoami` resolving to a NAME rather than a numeric uid is a separate test from `uname`: `uname` succeeds under a broken namespace, and `getpwuid()` failing is the same fault that drops `confstr(DARWIN_USER_CACHE_DIR)` and aborts Xcode's DVT layer. HONEST CEILINGS. A native runner STILL needs Docker — it supervises the engine in an OCI sandbox once it holds a lease, so `native` removes tool execution from Docker and not Docker itself. The bring-up was NOT driven live on this host, because another agent's stack occupied it. `xcodebuild` was never run. §6 leg 1 (a real rented Mac) and leg 2 (`linux/amd64`) are both open and neither is claimed here."
expect_status: completed
