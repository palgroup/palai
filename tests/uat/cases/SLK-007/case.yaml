id: SLK-007
name: exact-approval-only-from-a-minted-hash-bearing-button
proof_class: component-real
provider: fake
input: "a high-risk approval is authorized ONLY by a signed interactive action from a minted button carrying the EXACT request_hash — the coordinator.ApplyApprovalDecision one-shot binding (a stale/mismatched hash authorizes nothing there). Message text ('yes', 'approve') is an ordinary event, never an interaction, and can never approve; a bare/foreign button, a missing hash, a shortcut, or a view_submission authorizes nothing (no privilege widening). WIRED (E19 T2): the whole chain is now the shipped one — a signed form body enters POST /v1/slack/interactions, the raw-body v0 verify passes, the allow-list is consulted, and coordinator.AcceptCommand + ApplyApprovalDecision transition the publication DURABLY (approve and deny both proven against real PostgreSQL, with the decider recorded). LOCAL proof of the mapping itself: the interactive-approval unit tests. EXTENDED (E20 T4) with the SUPPLY side of \"a MINTED button\" — the half this case always assumed and nothing proved: an actionable element can be minted ONLY by interactions.go, and the Block Kit renderer that turns a run's answer into blocks is a CLOSED union whose output is SWEPT for the actionable families. Model output carrying a literal {\"type\":\"actions\",…,\"action_id\":\"palai_approve\"} renders as ZERO actionable elements and falls to INERT TEXT, so the \"bare/foreign button\" this case refuses at the click never reaches a human to be clicked at all. The sweep is proven to DISCRIMINATE by finding the two buttons this case's own approval message legitimately mints, and the singularity is pinned again by a source scan over the package's composite literals. §6 leg 1: a REAL Slack workspace external receipt is operator work and is NEVER claimed here — the local seam is the FAKE Slack peer, so `slack` closes PREVIEW, not stable."
expect_status: completed
proof:
  - adapters/integrations/slack/approval_test.go:TestMapInteractiveApprovalBindsHashUserWorkspace
  - adapters/integrations/slack/approval_test.go:TestMapInteractiveApprovalDenyIsMapped
  - adapters/integrations/slack/approval_test.go:TestMapInteractiveApprovalRejectsEverythingElse
  - apps/control-plane/internal/store/slack_interactions_component_test.go:TestSlackAuthorizedClickApprovesThroughTheWholeChain
  - apps/control-plane/internal/store/slack_interactions_component_test.go:TestSlackDenyClickDeniesThePublication
  - adapters/integrations/slack/blocks_test.go:TestRenderRefusesToMintAnActionableElementFromModelOutput
  - adapters/integrations/slack/blocks_test.go:TestApprovalMessageIsTheOnlyMintOfAnActionableElement
  - adapters/integrations/slack/blocks_test.go:TestNoFileButInteractionsMintsAnActionableElement
  - apps/control-plane/internal/store/slack_stream_component_test.go:TestSlackStopStreamCarriesRenderedBlocksAndNoForgedButton
