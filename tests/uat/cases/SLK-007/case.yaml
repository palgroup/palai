id: SLK-007
name: exact-approval-only-from-a-minted-hash-bearing-button
proof_class: component-real
provider: fake
input: "a high-risk approval is authorized ONLY by a signed interactive action from a minted button carrying the EXACT request_hash — the coordinator.ApplyApprovalDecision one-shot binding (a stale/mismatched hash authorizes nothing there). Message text ('yes', 'approve') is an ordinary event, never an interaction, and can never approve; a bare/foreign button, a missing hash, a shortcut, or a view_submission authorizes nothing (no privilege widening). WIRED (E19 T2): the whole chain is now the shipped one — a signed form body enters POST /v1/slack/interactions, the raw-body v0 verify passes, the allow-list is consulted, and coordinator.AcceptCommand + ApplyApprovalDecision transition the publication DURABLY (approve and deny both proven against real PostgreSQL, with the decider recorded). LOCAL proof of the mapping itself: the interactive-approval unit tests. §6 leg 1: a REAL Slack workspace external receipt is operator work and is NEVER claimed here — the local seam is the FAKE Slack peer, so `slack` closes PREVIEW, not stable."
expect_status: completed
proof:
  - adapters/integrations/slack/approval_test.go:TestMapInteractiveApprovalBindsHashUserWorkspace
  - adapters/integrations/slack/approval_test.go:TestMapInteractiveApprovalDenyIsMapped
  - adapters/integrations/slack/approval_test.go:TestMapInteractiveApprovalRejectsEverythingElse
  - apps/control-plane/internal/store/slack_interactions_component_test.go:TestSlackAuthorizedClickApprovesThroughTheWholeChain
  - apps/control-plane/internal/store/slack_interactions_component_test.go:TestSlackDenyClickDeniesThePublication
