id: FLC-004
name: an-irreversible-action-gets-a-different-confirmation-from-a-reversible-one-and-that-holds-for-every-such-action-rather-than-the-ones-a-spec-named
proof_class: e2e-deterministic
provider: fake
input: "T2 AND T3 EACH BUILT ONE HALF OF A RULE AND NEITHER OPENED A CASE FOR THE RULE, WHICH IS WHY THIS ID EXISTS AND WHY ITS DIRECTORY DID NOT UNTIL THE EXIT GATE. FLC-002 proves the policy page's dialog is an `alertdialog` that reviews what is about to die and that `Tab` cannot leave it; FLC-003 proves the fleet page's revoke dialog cannot open without the single read that carries the lease count while cordon still goes through the native confirmation. Both are assertions about the actions A SPEC HAPPENED TO NAME. The claim neither makes is the one an operator depends on: that EVERY irreversible action in this console is behind a dialog and EVERY reversible one is not — a property of the SET, which a per-action test cannot state and a source sweep can. THE CRITERION IS PUBLISHED AND THE SPLIT IS ITS CONSEQUENCE RATHER THAN A PREFERENCE. WCAG 2.2 SC 3.3.4 applies to pages that *modify or delete user-controllable data in data storage systems* and asks for ONE of three legs: *1. Reversible … 2. Checked … 3. Confirmed — A mechanism is available for reviewing, confirming, and correcting information before finalizing the submission.* `cordon` and `resume` satisfy leg 1 VERBATIM — `Resume` clears the flag (`execution/runner_gateway.go:324`) — so a `window.confirm` discharges the criterion and a modal would be code with no obligation behind it. `revoke` cannot reach leg 1 (`runner_gateway.go:328`, *a revoked runner identity is decommissioned, not paused*, and `runnerLifecycle.set`: *once revoked, neither flag comes back*), leg 2 is empty where the operator entered no data, so leg 3 is what is left — AND ITS WORD *REVIEWING* IS A DATA CALL RATHER THAN A PARAGRAPH: the machine's live lease count lives ONLY on the single read (`api/runners.go:48-59`, and it is a `*int64` because *zero is a real and important value here — it is the one that means the Mac can be unplugged*), so the dialog cannot open without `GET /v1/runners/{id}`. THE MEASUREMENT IS A SOURCE SWEEP AND THAT IS THE POINT. `TestEveryIrreversibleActionInTheConsoleIsBehindAnAlertDialog` parses `app/**/page.tsx` for both confirmation forms, resolves each occurrence to the action it guards, and refuses BOTH directions — an irreversible action outside a dialog, and a reversible one inside it. The second direction is not symmetry for its own sake: a build that wrapped everything in `ConfirmDestructive` would look MORE careful and would have stopped distinguishing, and the next reader converting the remaining `window.confirm` calls *for consistency* is the change this refuses. It was shown RED in both directions by mutation. AND THE LEDGER IS RE-DERIVED FROM THAT SWEEP RATHER THAN DECLARED — the bundle's action counters come from the parsed source, so an action added to a page without a confirmation reddens this gate rather than waiting for somebody to notice. WHAT THIS DOES NOT CLAIM, AND THE FIRST ITEM IS THE ONE A READER WILL ASSUME. A FOCUS TRAP IS NOT PROVEN TO A SCREEN-READER USER BY ANY OF THIS: the spec drives `Tab` and reads `document.activeElement`, which measures the DOM's focus order and not what an assistive technology announces or how the trap FEELS to somebody inside it — axe has no rule for either, and §6 leg 3 (a deployed console with a manual assistive-technology pass) is open and grew in this epic precisely because a modal dialog and a one-time value announcement are where scanners are weakest. Nor does it claim the dialog's DEFAULT FOCUS is correct: §3.5 W5 searched the ARIA APG alertdialog and modal-dialog patterns and found no normative sentence making *the least destructive action* the initial focus, so the cancel button takes focus because `window.confirm` already behaves that way — not changing a behaviour is the cheapest way to make no claim — and this is filed as `FLC-P5` rather than asserted anywhere. Every leg here is fake-upstream and deterministic against the shipped fixture control plane and a compose stack on one box; no machine in it is a real Mac, and `FLT-P15` stands over all of it."
expect_status: completed
