  # control plane's in-process Slack bridge (extensions/slack_*, api/slack*, the store's slack_*
  # component suites). Slack is served by apps/slack-bot now, a separate process that reaches this
  # control plane over `/v1`, so the mechanisms these lines proved are either gone or live in a
  # component this case does not cover. The case TEXT above is shipped and left byte-for-byte; the
  # checksum reads neither this list nor the text (caseChecksumParts hashes id + run_id + the release's
  # contracts digest), so withdrawing a proof cannot move a committed checksum.
  #   - apps/control-plane/internal/extensions/slack_socket_test.go:TestSlackSocketAcknowledgesBeforeDoingTheWork
  #   - apps/control-plane/internal/extensions/slack_socket_test.go:TestSlackSocketAckShapeMatchesTheDocumentedEnvelope
  #   - apps/control-plane/internal/extensions/slack_socket_test.go:TestSlackSocketOverlapsOnWarningAndLosesNoEvents
  #   - apps/control-plane/internal/extensions/slack_socket_test.go:TestSlackSocketStopsPermanentlyOnLinkDisabled
  #   - apps/control-plane/internal/extensions/slack_socket_test.go:TestSlackSocketDrainsGracefully
  #   - apps/control-plane/internal/extensions/slack_socket_test.go:TestSlackSocketNeverLogsTheTokenOrTheTicket
  #   - apps/control-plane/internal/store/slack_socket_component_test.go:TestSlackSocketModeAndHTTPShareOneCanonicalIdentity
  #
  # TIER LOWERED TO `unit` 2026-08-05, which the withdrawal above should have carried and did not. The class
  # says what a case's SURVIVING proofs support, and every line left resolves to an untagged file. The claim
  # is TWO transports normalizing to one identity; the Events API HTTP callback was deleted whole in the
  # cutover, so there is one transport and the last withdrawn line above is the proof that drove both orders
  # against real PostgreSQL. What remains — the frame decode, the ack shape, the mapping — is pure and is
  # genuinely a unit claim. The case TEXT is left byte-for-byte and its "both normalize" sentence should be
  # read against this note.
