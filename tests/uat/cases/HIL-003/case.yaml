id: HIL-003
name: the-run-parks-on-its-question-and-an-approval-nobody-presses-expires-and-releases-it
proof_class: component-real
provider: fake
input: "A RUN WAITING ON A HUMAN PARKS, AND THIS IS A REPAIR RATHER THAN A FEATURE. E22 shipped a publication tool that answered `pending_approval` and let the model carry on, so the run reached `completed` before anybody looked, and the click that arrived afterwards hit guardRunActive: Decide returned an ERROR, the interactivity route answered 503, the human saw Slack report a failure and the publication stayed pending forever. E22's own test measured exactly that and wrote it down. Now the run goes running -> waiting through the pause/detach choreography — a durable checkpoint if a sink is wired, then RunCmdWait, then an attempt that ends with NO tool.result — so the model is given nothing to continue on, no engine process is held and a parked run costs no compute while a human reads. THE PARK IS DECIDED BY THE DATABASE, NEVER BY THE RESULT BYTES: a pending approvals row THIS RUN owns is what parks it, not a tool answering `{\"status\":\"pending_approval\"}` — an MCP server can write that string and tool output is untrusted data — so the fix is one read in the dispatcher rather than a rule per publication tool, and merge inherited it without a line. THE SECOND HALF HAS NO PRIOR ART IN THIS TREE AND IT IS THE ONE TO READ: `approvals.expires_at` was declared in migration 000013 in 2023 and NOTHING EVER WROTE A VALUE INTO IT, which was harmless while nothing waited and became a run parked forever the moment something did. Every approval now carries a deadline (30 minutes, `PALAI_APPROVAL_TTL`), and a reaper sweeps lapsed ones: the call goes to `canceled`, `approval.expired.v1` is journaled through an EXISTING event type, and — the half that did not exist — THE PARKED RUN IS WOKEN. The model learns the outcome on the fresh attempt, which replays the committed transcript, reaches the same tool.request and consults the same ledger row. The wake lives in ONE function that approve, deny and the reaper all end in, because a gate whose closing and opening are written twice is a gate that one day only closes; the worst failure of an approval is not letting something through, it is holding a run open on a question nobody will ever answer. A DELIVERY FAILURE COSTS THE BUTTON AND NEVER THE RUN (SLK-006): a question Slack refuses is retried, retired as dead, and the approval is still recorded, still expires and still releases the run. INHERITED AND UNCHANGED: only the session's OLDEST pending approval is decidable, so two concurrent questions mean the second waits its turn; and a genuinely terminal run — cancelled or timed out while a question was open — STILL refuses the decision and still answers 503, deliberately, because a decision applied to a dead run would publish from a workspace nobody holds. LOCAL SEAM: component-real — the real orchestrator, the real reaper and the real wake against real PostgreSQL with the clock moved forward; the counterparty is a fake Slack peer. THE OPERATOR LEG THIS CASE DOES NOT COVER: §6 leg 6 — a real approval expiring in REAL time, an operator waiting a real thirty minutes and watching the parked run wake — is opened by E23 and stays OPEN; §6 leg 1 is untouched and grew again."
expect_status: completed
proof:
  - apps/control-plane/internal/execution/tool_approval_component_test.go:TestToolApprovalParksTheRunRatherThanAnsweringWithoutADecision
  - apps/control-plane/internal/execution/tool_approval_component_test.go:TestExpiredToolApprovalCancelsTheCallAndWakesTheParkedRun
  - apps/control-plane/internal/execution/reconciler_test.go:TestReconcilerSweepReportsDeadLetteredWithConfiguredCeiling
  - apps/control-plane/internal/execution/slack_publish_component_test.go:TestPublicationFromSlackParksTheRunSoTheApproveLands
  - apps/control-plane/internal/execution/slack_publish_component_test.go:TestPublicationFromSlackDenyWakesTheParkedRunAndPublishesNothing
  - apps/control-plane/internal/execution/slack_publish_component_test.go:TestPublicationFromSlackDeliveryFailureKeepsTheApprovalAndReleasesTheRun
  - apps/control-plane/internal/execution/slack_publish_component_test.go:TestPublicationFromSlackCeilingATerminalRunStillRefusesTheClick
  - apps/control-plane/internal/execution/slack_publish_component_test.go:TestPublicationFromSlackPostsAnApprovalMessageIntoTheThread
