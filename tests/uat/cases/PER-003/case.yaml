id: PER-003
name: a-bounded-window-soak-holds-memory-and-journal-growth-reclaims-payload-bytes-and-resumes-the-stream-with-no-gap
proof_class: component-real
provider: fake
input: "PER-003 keeps ONE session alive for a BOUNDED WINDOW (90s by default) with a client attached to its stream the whole time while new responses chain onto it, and measures four things on the running binary. MEMORY: the control-plane process's RSS is sampled through the window and the GATED growth is PEAK minus the first reading — an endpoint difference would report 0 for a process that grew 11 MB and handed 1 MB back before the last sample, and a soak whose only claim is 'it did not crash' is not a measurement. JOURNAL: mean payload bytes per event, sampled on every RSS tick, must stay under a per-event budget — that bounds the SIZE of an event and is explicitly NOT a proof that growth is linear in events rather than in session length, which would need a gate on the slope. COMPACTION: the REAL §8.3/§22.2 retention sweep reclaims the payload bytes of terminal store=false responses in this session AND the rows survive, so the journal is navigable and bounded; the purge cohort is sized under the reaper's 100-row batch so ONE sweep reclaims all of it rather than 'reclaimed' being a timing accident. RECONNECT: the stream is reconnected repeatedly with after_sequence and each resume must continue at exactly last+1 — zero gaps, zero duplicates — while the long-lived reader observes a contiguous sequence for the whole window. Percentiles are derived from raw samples.jsonl by the documented nearest-rank method behind the mandatory profile stamp. LOCAL SEAM: one control-plane process plus one PostgreSQL container on macOS + Docker Desktop, dispatch disabled per the E08 rule. §6 operator legs: 'SOAK' HERE IS A BOUNDED WINDOW OF MINUTES ON A LAPTOP and is named that way in the artifact — it is NOT the §64.15 RC soak, which is E18 §6 operator leg 7 and is claimed nowhere here. 'COMPACTION' HERE IS THE IMPLEMENTED RETENTION PAYLOAD SCRUB (§8.3/§22.2), NOT §25.14 context compaction — that is evaluation-gated and needs real model steps, dispatch is off per the E08 rule, so §25.14 is neither exercised nor claimed. No number carries an SLO or a reference-hardware claim (§6 leg 3)."
expect_status: completed
proof:
  - tests/performance/per003_soak_test.go:TestPER003LongSessionSoak
  - tests/performance/harness_test.go:TestHarnessWritesNothingWithoutAProfile
  - tests/performance/harness_test.go:TestHarnessPercentilesRecomputeFromTheRawSamples
  - tests/performance/harness_test.go:TestHarnessRecordsZeroGateValuesAndTheCeiling
# ceiling: run with `make test-performance TEST=service`. Docker-bound, so NOT in `make verify`.
